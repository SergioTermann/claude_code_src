<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风起时域 - 智能工作台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #ffffff;
            font-family: "Inter", "Noto Sans SC", sans-serif;
        }

        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
            padding: 30px 16px;
            display: flex;
            flex-direction: column;
            background: rgba(252, 252, 252, 0.85);
            border-right: 1px solid #e5e7eb;
        }

        .logo {
            margin-bottom: 34px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 4px;
        }

        .logo img {
            width: 82px;
            height: 86px;
            object-fit: contain;
        }

        .logo h1 {
            font-size: 18px;
            line-height: 1.2;
            font-weight: 700;
            color: #1f2937;
        }

        .nav-section {
            margin-bottom: 30px;
        }

        .nav-title {
            display: none;
            padding-left: 10px;
            margin-bottom: 15px;
            color: #9ca3af;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 8px;
            color: #374151;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background: #f3f4f6;
            color: #1f2937;
        }

        .nav-item.static {
            cursor: default;
            opacity: 0.74;
        }

        .nav-item.static:hover {
            background: transparent;
            color: #374151;
            transform: none;
        }

        .nav-item.active {
            background: rgba(69, 139, 250, 0.15);
            color: #458BFA;
        }

        .nav-item .icon {
            margin-right: 12px;
            color: #458BFA;
            font-size: 20px;
        }

        .nav-item .text {
            flex: 1;
        }

        .nav-item .title {
            display: block;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-item .desc {
            display: none;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #ffffff;
        }

        .chat-header {
            padding: 20px 30px;
            background: #ffffff;
        }

        .chat-header h2 {
            margin-bottom: 4px;
            color: #1f2937;
            font-size: 18px;
            font-weight: 600;
        }

        .chat-header p {
            color: #6b7280;
            font-size: 14px;
        }

        .chat-messages {
            flex: 1;
            min-height: 0;
            min-width: 0;
            padding: 28px 56px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            scrollbar-gutter: stable;
            overscroll-behavior: contain;
            background: #ffffff;
        }

        .chat-tip {
            margin-bottom: 12px;
            color: #414141;
            font-size: 18px;
            font-weight: 600;
        }

        .welcome-message {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 0;
            padding: 0;
            margin: 0;
        }

        .welcome-message img {
            display: block;
            width: min(720px, 80vw);
            max-width: 100%;
            max-height: 80vh;
            height: auto;
            object-fit: contain;
            opacity: 0.9;
        }

        .chat-messages.has-messages .welcome-message {
            display: none;
        }

        .message {
            display: flex;
            gap: 15px;
            max-width: 80%;
            min-width: 0;
        }

        .message.assistant.with-reasoning {
            max-width: min(980px, 92%);
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: #3b82f6;
            color: #ffffff;
        }

        .message.user .message-avatar {
            background: #e5e7eb;
            color: #6b7280;
        }

        .message-content {
            max-width: 100%;
            min-width: 0;
            padding: 16px 20px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: #ffffff;
            color: #374151;
            line-height: 1.6;
            overflow-x: auto;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .message.user .message-content {
            border: none;
            background: #3b82f6;
            color: #ffffff;
        }

        .message-content p {
            margin: 0.5em 0;
        }

        .message.assistant .message-content {
            line-height: 1.75;
        }

        .answer-section {
            margin: 0 0 14px;
            padding: 0 0 12px;
            border-bottom: 1px solid #eef2f7;
        }

        .answer-section:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .answer-section-title {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 0 0 7px;
            color: #1f2937;
            font-size: 14px;
            font-weight: 800;
        }

        .answer-section-title::before {
            content: "";
            width: 4px;
            height: 16px;
            border-radius: 999px;
            background: #2563eb;
        }

        .answer-section-body {
            color: #374151;
            font-size: 15px;
        }

        .answer-section-body p {
            margin: 0.32em 0;
        }

        .answer-list {
            margin: 0;
            padding-left: 1.35em;
        }

        .answer-list li {
            margin: 0.3em 0;
        }

        .answer-muted {
            color: #6b7280;
        }

        .message-content p:first-child {
            margin-top: 0;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .assistant-answer:empty {
            display: none;
        }

        .message.assistant.with-reasoning .assistant-answer {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
        }

        .message.assistant.with-reasoning .assistant-answer::before {
            content: "最终指令";
            display: block;
            margin-bottom: 8px;
            color: #2563eb;
            font-size: 12px;
            font-weight: 700;
        }

        .message-content pre {
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            background: #f3f4f6;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-content code {
            padding: 2px 5px;
            border-radius: 3px;
            background: #f3f4f6;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-content table {
            display: block;
            max-width: 100%;
            overflow-x: auto;
            border-collapse: collapse;
        }

        .message-content img {
            max-width: 100%;
            height: auto;
        }

        .message-content hr {
            display: none;
        }

        .thinking-hint {
            color: #9ca3af;
            animation: thinking-blink 1.2s ease-in-out infinite;
        }

        .thinking-card {
            margin: 0 0 12px;
            padding: 12px 13px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #f3f4f6;
            color: #5f6b7a;
            font-size: 13px;
            line-height: 1.65;
        }

        .thinking-card-title {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 7px;
            color: #64748b;
            font-size: 12px;
            font-weight: 800;
        }

        .thinking-card-title .material-symbols-outlined {
            font-size: 15px;
        }

        .final-answer-card {
            color: inherit;
        }

        @keyframes thinking-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .chat-input-area {
            padding: 20px 56px;
            background: #ffffff;
        }

        .admin-corner-link {
            position: fixed;
            left: 20px;
            bottom: 20px;
            z-index: 1000;
            height: 38px;
            min-width: 88px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #d8dee8;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.94);
            color: #374151;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.12);
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .admin-corner-link:hover {
            background: #ffffff;
            border-color: #bfdbfe;
            color: #2563eb;
            transform: translateY(-1px);
        }

        .chat-mode-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin: -2px 0 10px;
        }

        .graph-toggle-button {
            height: 32px;
            padding: 0 11px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        .graph-toggle-button .material-symbols-outlined {
            font-size: 17px;
        }

        .graph-toggle-button.off {
            border-color: #e5e7eb;
            background: #f9fafb;
            color: #6b7280;
        }

        .graph-toggle-button.active {
            border-color: #2563eb;
            background: #dbeafe;
            color: #1d4ed8;
        }

        .graph-toggle-button:hover {
            border-color: #93c5fd;
            background: #dbeafe;
        }

        .graph-toggle-button.off:hover {
            border-color: #d1d5db;
            background: #f3f4f6;
        }

        .chat-input-wrapper {
            position: relative;
            display: block;
        }

        .chat-input {
            width: 100%;
            min-height: 88px;
            padding: 14px 118px 14px 16px;
            border: 1px solid rgba(133, 182, 255, 0.15);
            border-radius: 8px;
            color: #111827;
            font: inherit;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            transition: all 0.2s ease;
        }

        .question-picker-button {
            position: absolute;
            right: 58px;
            top: 50%;
            transform: translateY(-50%);
            height: 34px;
            padding: 0 10px;
            border: 1px solid #dbeafe;
            border-radius: 10px;
            background: #ffffff;
            color: #458BFA;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .question-picker-button:hover {
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        .reasoning-question-menu {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(100% + 10px);
            display: none;
            grid-template-columns: 1fr;
            gap: 6px;
            padding: 8px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 18px 42px rgba(31, 41, 55, 0.16);
            z-index: 10;
        }

        .reasoning-question-menu.open {
            display: grid;
        }

        .reasoning-question-menu button {
            padding: 9px 10px;
            border: 1px solid #eef2f7;
            border-radius: 8px;
            background: #ffffff;
            color: #1f2937;
            text-align: left;
            line-height: 1.35;
            cursor: pointer;
        }

        .reasoning-question-menu button:hover {
            border-color: #bfdbfe;
            background: #eff6ff;
        }

        .reasoning-question-menu small {
            display: block;
            margin-top: 3px;
            color: #6b7280;
            font-size: 11px;
        }

        .chat-input:focus {
            outline: none;
            border-color: #85B6FF;
            box-shadow: 0 0 0 3px rgba(133, 182, 255, 0.12);
        }

        .send-button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: none;
            border-radius: 12px;
            background: #3b82f6;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .send-button .material-symbols-outlined {
            font-size: 22px;
        }

        .send-button:hover {
            background: #2563eb;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.24);
            transform: translateY(-50%) scale(1.03);
        }

        .send-button:active {
            transform: translateY(-50%) scale(0.98);
        }

        .suggested-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        .suggested-question {
            padding: 10px 14px;
            border: 1px solid #F2F2F2;
            border-radius: 8px;
            background: #ffffff;
            color: #333333;
            font-size: 12px;
            line-height: 1.4;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .suggested-question:hover {
            border-color: #e8e8e8;
            background: #fafafa;
            transform: translateY(-1px);
        }

        .llmwiki-insight {
            margin-top: 12px;
            padding: 12px;
            border: 1px solid #d8dee8;
            border-radius: 8px;
            background: #ffffff;
            color: #374151;
        }

        .llmwiki-insight-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .llmwiki-insight-title {
            min-width: 0;
            color: #111827;
            font-size: 13px;
            font-weight: 800;
            line-height: 1.4;
        }

        .llmwiki-confidence {
            flex: 0 0 auto;
            padding: 4px 8px;
            border-radius: 999px;
            background: #ecfdf3;
            color: #067647;
            font-size: 11px;
            font-weight: 800;
        }

        .llmwiki-summary {
            margin-bottom: 10px;
            color: #475467;
            font-size: 12px;
            line-height: 1.55;
        }

        .llmwiki-path {
            display: grid;
            gap: 6px;
            margin: 0 0 10px;
            padding: 0;
            list-style: none;
        }

        .llmwiki-path li {
            padding: 8px 9px;
            border: 1px solid #eef2f7;
            border-radius: 7px;
            background: #f9fafb;
            font-size: 12px;
            line-height: 1.45;
        }

        .llmwiki-stage {
            display: inline-flex;
            margin-right: 6px;
            color: #1d4ed8;
            font-weight: 800;
        }

        .llmwiki-next {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .llmwiki-next button {
            max-width: 100%;
            padding: 7px 9px;
            border: 1px solid #bfdbfe;
            border-radius: 7px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 12px;
            line-height: 1.35;
            cursor: pointer;
            overflow-wrap: anywhere;
        }

        .llmwiki-next button:hover {
            background: #dbeafe;
        }

        body.conversation-mode .suggested-questions,
        body.conversation-mode .chat-tip {
            display: none;
        }

        body.conversation-mode .chat-messages {
            padding: 34px 64px;
        }

        .reasoning-card {
            align-self: stretch;
            max-width: 92%;
            margin: -2px 0 8px 51px;
            padding: 14px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: #f3f4f6;
            box-shadow: none;
            color: #6b7280;
        }

        .message.assistant .reasoning-card {
            max-width: none;
            margin: 14px 0 0;
        }

        .reasoning-card-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .reasoning-card-title {
            color: #6b7280;
            font-size: 14px;
            font-weight: 700;
        }

        .reasoning-card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .reasoning-card-status {
            color: #8b95a1;
            font-size: 12px;
            font-weight: 600;
        }

        .reasoning-card-actions {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .reasoning-icon-button {
            width: 28px;
            height: 28px;
            border: 1px solid #d8dee8;
            border-radius: 8px;
            background: #ffffff;
            color: #64748b;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
        }

        .reasoning-icon-button:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
            color: #334155;
        }

        .reasoning-icon-button .material-symbols-outlined {
            font-size: 18px;
        }

        .reasoning-card.collapsed .reasoning-card-body {
            display: none;
        }

        .reasoning-card.collapsed {
            padding-bottom: 10px;
        }

        .reasoning-network-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(170px, 220px);
            gap: 10px;
            align-items: stretch;
            margin: 2px 0 12px;
        }

        .reasoning-network {
            position: relative;
            height: 430px;
            margin: 0;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            background:
                linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
                linear-gradient(135deg, rgba(148, 163, 184, 0.07), rgba(226, 232, 240, 0.18)),
                #f8f9fb;
            background-size: 28px 28px, 28px 28px, 100% 100%, 100% 100%;
        }

        .reasoning-live-action {
            min-width: 0;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }

        .reasoning-live-action-label {
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
        }

        .reasoning-live-action-text {
            color: #374151;
            font-size: 13px;
            line-height: 1.55;
            overflow-wrap: anywhere;
        }

        .reasoning-live-action-foot {
            color: #94a3b8;
            font-size: 11px;
            line-height: 1.35;
        }

        .reasoning-network svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .laneBand {
            fill: rgba(255, 255, 255, 0.48);
            stroke: rgba(148, 163, 184, 0.22);
            stroke-width: 1;
        }

        .lanePill {
            fill: rgba(255, 255, 255, 0.86);
            stroke: #d8dee8;
            stroke-width: 1;
        }

        .laneLabel {
            fill: #6b7280;
            font-size: 12px;
            font-weight: 700;
        }

        .laneLine {
            stroke: #cfd8e4;
            stroke-width: 1;
            stroke-dasharray: 4 8;
        }

        .edge {
            fill: none;
            stroke: #aeb8c6;
            stroke-opacity: 0.28;
            stroke-width: 1.25;
        }

        .edge.dim {
            stroke-opacity: 0.09;
        }

        .edge.live {
            stroke: #6b7280;
            stroke-opacity: 0.72;
            stroke-width: 2.5;
        }

        .edge.current {
            stroke: #6b7280;
            stroke-opacity: 0.84;
            stroke-width: 2.8;
        }

        .edge.supported {
            stroke: #7c8794;
            stroke-opacity: 0.62;
        }

        .edge.excluded {
            stroke: #94a3b8;
            stroke-dasharray: 6 5;
            stroke-opacity: 0.72;
        }

        .edge.confirmed {
            stroke: #6b7280;
            stroke-opacity: 0.72;
        }

        .edge.principle {
            stroke: #7c8aa0;
            stroke-dasharray: 3 5;
        }

        .edgeLabel {
            fill: #475467;
            font-size: 10px;
            paint-order: stroke;
            stroke: #ffffff;
            stroke-width: 3px;
            letter-spacing: 0;
        }

        .flowDot {
            filter: drop-shadow(0 0 5px rgba(107, 114, 128, 0.45));
        }

        .node circle {
            stroke: #f8fafc;
            stroke-width: 2px;
            filter: drop-shadow(0 3px 5px rgba(55, 65, 81, 0.12));
        }

        .node.dim {
            opacity: 0.25;
        }

        .node.live circle {
            stroke: #202938;
            stroke-width: 3.5px;
        }

        .node.current circle {
            stroke: #6b7280;
            stroke-width: 4px;
            filter: drop-shadow(0 0 9px rgba(107, 114, 128, 0.26));
        }

        .node.principle circle {
            fill: #8b9bb0;
            stroke: #e2e8f0;
        }

        .node.evidence circle {
            fill: #9aa4b2;
            stroke: #e5e7eb;
        }

        .node.supported circle {
            fill: #7c8794;
            stroke: #e5e7eb;
        }

        .node.excluded circle {
            fill: #94a3b8;
            stroke: #e2e8f0;
        }

        .node.confirmed circle {

                if (!node?.id || nodeIds.has(node.id)) return;
                nodeIds.add(node.id);
                nodes.push(node);
            };
            const addEdge = edge => {
                if (!edge?.source || !edge?.type || !edge?.target) return;
                const key = `${edge.source}|${edge.type}|${edge.target}`;
                if (edgeKeys.has(key)) return;
                edgeKeys.add(key);
                edges.push(edge);
            };
            (base.nodes || []).forEach(addNode);
            (extra.nodes || []).forEach(addNode);
            (base.edges || []).forEach(addEdge);
            (extra.edges || []).forEach(addEdge);

                ...base,

                aliases: [...(base.aliases || []), ...(extra.aliases || [])],
                weighted_aliases: [...(base.weighted_aliases || []), ...(extra.weighted_aliases || [])],

        function fillQuestion(text) {
            chatInput.value = text;
            resetChatInputHistoryNavigation();
            chatInput.focus();
            closeReasoningQuestionMenu();
        }

        function handleInputKeydown(event) {
            if ((event.key === 'ArrowUp' || event.key === 'ArrowDown') && !event.isComposing) {
                if (!event.shiftKey && !event.ctrlKey && !event.metaKey && !event.altKey && chatInputHistory.length) {
                    event.preventDefault();
                    navigateChatInputHistory(event.key === 'ArrowUp' ? -1 : 1);
                    return;
                }
            }
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
                return;
            }
            resetChatInputHistoryNavigation();
        }

        function loadChatInputHistory() {
            try {
                const parsed = JSON.parse(window.localStorage?.getItem(CHAT_INPUT_HISTORY_KEY) || '[]');
                return Array.isArray(parsed)
                    ? parsed.map(item => String(item || '').trim()).filter(Boolean).slice(-CHAT_INPUT_HISTORY_LIMIT)
                    : [];
            } catch {
                return [];
            }
        }

        function saveChatInputHistory() {
            try {
                window.localStorage?.setItem(CHAT_INPUT_HISTORY_KEY, JSON.stringify(chatInputHistory));
            } catch {}
        }

        function rememberChatInput(text) {
            const normalized = String(text || '').trim();
            if (!normalized) return;
            chatInputHistory = chatInputHistory.filter(item => item !== normalized);
            chatInputHistory.push(normalized);
            if (chatInputHistory.length > CHAT_INPUT_HISTORY_LIMIT) {
                chatInputHistory = chatInputHistory.slice(-CHAT_INPUT_HISTORY_LIMIT);
            }
            saveChatInputHistory();
            resetChatInputHistoryNavigation();
        }

        function resetChatInputHistoryNavigation() {
            chatInputHistoryIndex = null;
            chatInputHistoryDraft = '';
        }

        function setChatInputValue(value) {
            chatInput.value = value;
            chatInput.focus();
            const end = chatInput.value.length;
            chatInput.setSelectionRange(end, end);
        }

        function navigateChatInputHistory(direction) {
            if (!chatInputHistory.length) return;
            if (chatInputHistoryIndex === null) {
                chatInputHistoryDraft = chatInput.value;
                chatInputHistoryIndex = chatInputHistory.length;
            }

            const nextIndex = chatInputHistoryIndex + direction;
            if (nextIndex < 0) {
                chatInputHistoryIndex = 0;
                setChatInputValue(chatInputHistory[0]);
                return;
            }
            if (nextIndex >= chatInputHistory.length) {
                const draft = chatInputHistoryDraft;
                resetChatInputHistoryNavigation();
                setChatInputValue(draft);
                return;
            }

            chatInputHistoryIndex = nextIndex;
            setChatInputValue(chatInputHistory[chatInputHistoryIndex]);
        }

        const CONVERSATION_ID_KEY = 'windriseConversationId';

        function syncReasoningToggle() {
            if (!reasoningToggle || !reasoningToggleText) return;
            if (reasoningChainEnabled) {
                reasoningToggle.classList.add('active');
                reasoningToggle.classList.remove('off');
            } else {
                reasoningToggle.classList.remove('active');
                reasoningToggle.classList.add('off');

            reasoningToggle.setAttribute('aria-pressed', reasoningChainEnabled ? 'true' : 'false');
            reasoningToggle.title = reasoningChainEnabled
                ? '已开启：仅在故障诊断时显示诊断链，普通问答直接走大模型'
                : '已关闭：不显示诊断链，由 Windrise 自动识别故障码或普通问答';
            reasoningToggleText.textContent = reasoningChainEnabled ? '排查过程：开' : '排查过程：关';
        }

        function toggleReasoningChain() {
            reasoningChainEnabled = !reasoningChainEnabled;
            try {
                window.localStorage?.setItem('windriseReasoningChainEnabled', reasoningChainEnabled ? '1' : '0');
            } catch {}

                sessionStorage.removeItem('pendingQuestion');
                sendMessage(pendingQuestion);
            }
        });

        async function sendMessage(prefilledMessage) {
            const message = (prefilledMessage || chatInput.value).trim();
            if (!message) return;

            if (!isConversationPage()) {
                redirectToConversation(message);
                return;
            }

            if (messageInFlight) return;
            messageInFlight = true;
            try {
            rememberChatInput(message);
            addMessage(message, 'user');
            chatInput.value = '';

            const assistantMsg = addMessage('', 'assistant');
            const contentEl = assistantMsg.querySelector('.message-content');
            let fullText = '';
            const useReasoningChain = reasoningChainEnabled && shouldUseReasoningChain(message);
            if (!useReasoningChain) {
                clearReasoningPanels();
                contentEl.innerHTML = renderThinkingStatus('正在由 Windrise 自动识别问题类型，并结合已知现场反馈生成下一步动作...');
                try {
                    const chatResult = await requestWindriseChat(message);
                    fullText = chatResult.answer;
                    contentEl.innerHTML = renderAssistantAnswer(fullText || '未返回可展示内容。') + renderLlmWikiInsight(chatResult.reasoning);
                } catch (error) {
                    console.error(error);
                    contentEl.textContent = '抱歉，Windrise 自动问答暂时不可用，请稍后再试。';
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return;
            }

            assistantMsg.classList.add('with-reasoning');
            contentEl.innerHTML = `<div class="reasoning-slot"></div><div class="assistant-answer">${renderThinkingStatus('正在对照故障现象、已排除项和下一步验证动作...')}</div>`;
            const answerEl = contentEl.querySelector('.assistant-answer');
            const reasoningHost = contentEl.querySelector('.reasoning-slot');
            let reasoningResult = null;
            try {
                reasoningResult = await startReasoningForMessage(message, reasoningHost);
            } catch (error) {
                console.error(error);
                reasoningResult = buildTextReasoningFallbackGraph(message, '排查图初始化异常，已切换为文本诊断。');
                reasoningData = reasoningResult;
                renderReasoningPanel(reasoningResult, reasoningHost);
                await playReasoningSteps(reasoningResult).catch(err => {
                    console.error(err);
                    finishReasoningPanelAfterError(reasoningResult);
                });
            }
            answerEl.innerHTML = renderThinkingStatus('正在把排查过程收敛成一个最可能判断和一个现场验证动作...');
            try {
                const chatResult = await requestWindriseChat(message);
                fullText = chatResult.answer;
                answerEl.innerHTML = renderAssistantAnswer(fullText || '未返回可展示内容。') + renderLlmWikiInsight(chatResult.reasoning);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                return;
            } catch (error) {
                console.warn('Windrise /api/chat unavailable during reasoning mode, fallback to local answer', error);
                const docxAnswer = findOriginalDocxAnswer(message);
                if (docxAnswer) {
                    answerEl.innerHTML = renderAssistantAnswer(docxAnswer);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                    return;
                }
            }
            const modelQuery = reasoningResult?.steps?.length
                ? buildReasoningSummaryPrompt(reasoningResult.evidenceContext || message, reasoningResult)
                : message;

            try {
                fullText = await requestLocalModelAnswer(modelQuery);
                answerEl.innerHTML = renderAssistantAnswer(fullText || buildGraphFallbackAnswer(reasoningResult?.evidenceContext || message, reasoningResult));
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (error) {
                if (reasoningResult?.steps?.length) {
                    answerEl.innerHTML = renderAssistantAnswer(buildGraphFallbackAnswer(reasoningResult?.evidenceContext || message, reasoningResult));
                } else {
                    answerEl.textContent = '抱歉，连接服务失败，请稍后再试。';
                }
                console.error(error);
            }
            } finally {
                messageInFlight = false;
            }
        }

        function findOriginalDocxAnswer(message) {
            const normalized = normalizeQuestionText(message);
            let best = null;
            let bestScore = 0;
            for (const item of originalDocxQa) {
                const score = item.keys.reduce((sum, key) => normalized.includes(normalizeQuestionText(key)) ? sum + 1 : sum, 0);
                if (score > bestScore) {
                    best = item;
                    bestScore = score;
                }
            }
            return bestScore > 0 ? best.answer : '';
        }

        function normalizeQuestionText(value) {
            return String(value || '')
                .toLowerCase()
                .replace(/[\\s，。！？、；：,.!?;:()（）【】\\[\\]“”"']/g, '');
        }

        async function requestLocalModelAnswer(prompt) {
            throw new Error('Windrise backend unavailable');
        }

        async function requestWindriseChat(message) {
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: message,
                        message,
                        windrise_mode: 'auto',
                        response_mode: 'blocking',
                        conversation_id: conversationId || '',
                    }),
                    signal: AbortSignal.timeout(90_000),
                });
                if (!response.ok) {
                    throw new Error(`Windrise HTTP ${response.status}`);
                }
                const data = await response.json();
                if (data.conversation_id) saveConversationId(data.conversation_id);
                return {
                    answer: String(data.answer || data.message || data.text || '').trim(),
                    reasoning: data.reasoning || null,
                };
            } catch (error) {
                console.warn('Windrise /api/chat unavailable', error);
                return {
                    answer: await requestLocalModelAnswer(message),
                    reasoning: null,
                };
            }
        }

        async function requestWindriseFaultAnswer(message) {
            const result = await requestWindriseChat(message);
            return result.answer;
        }

        function toggleReasoningQuestionMenu(event) {
            event.stopPropagation();
            if (reasoningQuestionMenu.classList.contains('open')) {
                closeReasoningQuestionMenu();
            } else {
                renderReasoningQuestionMenu();
                reasoningQuestionMenu.classList.add('open');
            }
        }

        function closeReasoningQuestionMenu() {
            reasoningQuestionMenu.classList.remove('open');
        }

        function renderReasoningQuestionMenu() {
            reasoningQuestionMenu.innerHTML = reasoningQuestionPresets.map((preset, index) => {
                return `
                    <button type="button" data-index="${index}" onclick="selectReasoningQuestion(${index}, true)">
                        <b>${escapeHtml(preset.template)}</b>

        function selectReasoningQuestion(index, autoSend = false) {
            const preset = reasoningQuestionPresets[index] || reasoningQuestionPresets[0];
            chatInput.value = preset.template;

        function currentReasoningCase() {
            return getReasoningCase(chatInput.value) || getLastReasoningCase() || genericReasoningCase;
        }

        function getReasoningCase(text) {
            const normalized = (text || '').toLowerCase();
            if (!normalized) return null;
            const catalog = reasoningCaseCatalog();
            const scores = new Map();
            const activeDomains = detectFrontendReasoningDomains(normalized);
            const addScore = (id, score, label = '') => {
                if (!id || !score) return;
                const current = scores.get(id) || { score: 0, label };
                current.score += score;
                if (label && !current.label) current.label = label;
                scores.set(id, current);
            };
            for (const [key, id] of reasoningCaseAliases) {
                const term = String(key || '').trim().toLowerCase();
                if (!term || !normalized.includes(term)) continue;
                addScore(id, reasoningAliasScore(term, normalized), catalog[id]?.label);
            }
            for (const item of reasoningWeightedAliases) {
                const term = String(item.key || '').trim().toLowerCase();
                if (!term || !normalized.includes(term)) continue;
                addScore(item.id, reasoningWeightedAliasScore(item, normalized), catalog[item.id]?.label);
            }
            for (const node of window.__reasoningNodes || []) {
                if (node?.type !== 'fault_case' || !node.id) continue;
                const terms = [node.label, ...(node.aliases || [])]
                    .map(item => String(item || '').trim().toLowerCase())
                    .filter(item => item.length >= 2);
                for (const term of terms) {
                    if (!normalized.includes(term)) continue;
                    addScore(node.id, reasoningAliasScore(term, normalized) + 2, node.label);
                }
            }
            applyReasoningDomainScores(normalized, addScore);
            applyGraphSystemDomainScores(activeDomains, addScore);
            let best = null;
            for (const [id, item] of scores) {
                if (!best || item.score > best.score) best = { id, ...item };
            }
            if (!best || best.score < 3) return null;
            return catalog[best.id] || { id: best.id, label: best.label || 'LLMWiki推理案例' };
        }

        function reasoningAliasScore(term, normalized) {
            const lengthScore = Math.min(24, Math.max(1, term.length));
            const exactBonus = normalized.trim() === term ? 12 : 0;
            const specificBonus = term.length >= 4 ? 5 : 0;
            const genericPenalty = /^(温度|压力|液压|轴承|滤芯|润滑)$/.test(term) ? -6 : 0;
            return Math.max(1, lengthScore + exactBonus + specificBonus + genericPenalty);
        }

        function reasoningWeightedAliasScore(item, normalized) {
            const term = String(item.key || '').trim().toLowerCase();
            if (!term) return 0;
            const base = Number(item.weight) || 1;
            const exactBonus = normalized.trim() === term ? 18 : 0;
            const phraseBonus = term.length >= 6 ? 8 : 0;
            const weakPenalty = item.source === 'weak' ? 10 : 0;
            return Math.max(1, Math.round(base / 3) + exactBonus + phraseBonus - weakPenalty);
        }

        function applyReasoningDomainScores(normalized, addScore) {
            const hasGearbox = /(齿轮箱|gearbox)/i.test(normalized);
            const hasOilTemp = /(油温|油池温度|温度高|温升|过温|超温)/i.test(normalized);
            const hasFilterDiff = /(滤芯|过滤器|压差|入口油压|油过滤器)/i.test(normalized);
            const hasLube = /(润滑|齿轮油|油脂|润滑泵|分配器)/i.test(normalized);
            const hasVibration = /(振动|异响|磨损|齿面|齿轮副|轴承)/i.test(normalized);
            const hasYaw = /(偏航|yaw|制动压力|阻尼缓冲器)/i.test(normalized);
            const hasHydraulic = /(液压|蓄能器|建压|保压|电磁阀)/i.test(normalized);

            if (hasGearbox) {
                addScore('case:llmwiki_gearbox-bearing-gear-wear', 28, '齿轮箱轴承或齿轮磨损导致振动与温升');
                if (hasOilTemp || hasVibration) addScore('case:llmwiki_gearbox-bearing-gear-wear', 16);
                if (hasFilterDiff || hasLube) addScore('case:llmwiki_lubrication-system-flow-grease-oil', 34, '集中润滑或齿轮油润滑不足');
            }
            if (hasLube && (hasFilterDiff || /齿轮油/.test(normalized))) {
                addScore('case:llmwiki_lubrication-system-flow-grease-oil', 20, '集中润滑或齿轮油润滑不足');
            }
            if (hasYaw && hasHydraulic) {
                addScore('case:yaw_hydraulic_pressure', 18, '偏航液压系统压力异常');
            }
            if (/(绕组|发电机).*(温度|过温|温升)|温度.*(绕组|发电机)/.test(normalized)) {
                addScore('case:generator_winding_temp_jump', 18, '发电机绕组端温度高/跳变');
            }
        }

        function detectFrontendReasoningDomains(normalized) {
            const domains = window.__reasoningSystemDomains || [];
            return domains
                .map(domain => {
                    let score = normalized.includes(domain.label.toLowerCase()) ? 28 : 0;
                    for (const keyword of domain.keywords || []) {
                        const key = String(keyword || '').trim().toLowerCase();
                        if (!key || !normalized.includes(key)) continue;
                        score += Math.min(18, Math.max(4, key.length));
                    }
                    const subsystems = (domain.subsystems || [])
                        .map(subsystem => {
                            let subsystemScore = normalized.includes(subsystem.label.toLowerCase()) ? 36 : 0;
                            const hasAnchor = !(subsystem.anchors || []).length || subsystem.anchors.some(anchor => normalized.includes(String(anchor || '').trim().toLowerCase()));
                            if (!hasAnchor) return { ...subsystem, score: 0 };
                            for (const anchor of subsystem.anchors || []) {
                                const key = String(anchor || '').trim().toLowerCase();
                                if (key && normalized.includes(key)) subsystemScore += Math.min(30, Math.max(12, key.length + 8));
                            }
                            for (const keyword of subsystem.keywords || []) {
                                const key = String(keyword || '').trim().toLowerCase();
                                if (!key || !normalized.includes(key)) continue;
                                subsystemScore += Math.min(26, Math.max(8, key.length + 4));
                            }
                            return { ...subsystem, score: subsystemScore };
                        })
                        .filter(subsystem => subsystem.score > 0)
                        .sort((a, b) => b.score - a.score);
                    if (subsystems[0]) score += Math.min(40, subsystems[0].score);
                    return { ...domain, subsystems, score };
                })
                .filter(domain => domain.score > 0)
                .sort((a, b) => b.score - a.score)
                .slice(0, 2);
        }

        function applyGraphSystemDomainScores(activeDomains, addScore) {
            for (const domain of activeDomains || []) {
                for (const caseId of domain.caseIds || []) {
                    addScore(caseId, 30 + Math.min(20, domain.score));
                }
                for (const subsystem of domain.subsystems || []) {
                    for (const caseId of subsystem.caseIds || []) {
                        addScore(caseId, 45 + Math.min(30, subsystem.score));
                    }
                }
            }
        }

        function getLastReasoningCase() {
            if (!reasoningCaseId) return null;
            return reasoningCaseCatalog()[reasoningCaseId] || null;
        }

        function isReasoningFollowUpMessage(text) {
            const normalized = String(text || '').trim();
            if (!normalized) return false;
            return /^(继续|接着|再说|然后呢|下一步|上面|上述|这个|该问题|那|还要|还需)/.test(normalized)
                || /(刚才|前面|上一轮|上一个|这个问题|该故障|该报警|该告警|继续)/.test(normalized);
        }

        function inferReasoningCaseForMessage(message) {
            return getReasoningCase(message) || (isReasoningFollowUpMessage(message) ? getLastReasoningCase() : null) || genericReasoningCase;
        }

        function hasReasoningGraphCase(id) {
            return (window.__reasoningNodes || []).some(node => node?.id === id && node?.type === 'fault_case');
        }

        function isGenericReasoningCase(id) {
            return id === genericReasoningCase.id;
        }

        function reasoningCaseCatalog() {
            return {
                'case:generic_wind_fault_chain': genericReasoningCase,
                'case:yaw_hydraulic_pressure': { id: 'case:yaw_hydraulic_pressure', label: '偏航液压系统压力异常' },
                'case:yaw_brake_pressure_sensor': { id: 'case:yaw_brake_pressure_sensor', label: 'T_228/T_229 偏航制动压力低/传感器故障' },
                'case:hydraulic_pump_runtime': { id: 'case:hydraulic_pump_runtime', label: 'YX277/YX278/YX279 液压泵动作时间异常' },
                'case:hydraulic_pump_breaker_trip': { id: 'case:hydraulic_pump_breaker_trip', label: '5806 液压泵断路器跳闸' },
                'case:brake_pump_no_pressure': { id: 'case:brake_pump_no_pressure', label: '65 刹车泵无压力/A240.1无反馈' },
                'case:yaw_speed_encoder_feedback': { id: 'case:yaw_speed_encoder_feedback', label: '192/193/194 偏航速度/位置反馈异常' },
                'case:converter_igbt': { id: 'case:converter_igbt', label: '变流器IGBT板卡故障' },
