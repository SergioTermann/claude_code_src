                'case:llmwiki_gearbox-bearing-gear-wear': { id: 'case:llmwiki_gearbox-bearing-gear-wear', label: '齿轮箱轴承或齿轮磨损导致振动与温升' },
                'case:llmwiki_lubrication-system-flow-grease-oil': { id: 'case:llmwiki_lubrication-system-flow-grease-oil', label: '集中润滑或齿轮油润滑不足' },
                ...(window.__reasoningCaseCatalog || {}),
            };
        }

        function detectReasoningIntent(query) {
            if (/(预防|复发|防止|避免)/.test(query)) return 'prevention';
            if (/(处理|修复|更换|解决|验证|效果)/.test(query)) return 'action';
            if (/(排查|定位|检查|诊断|怎么查|如何查)/.test(query)) return 'diagnosis';
            if (/(原因|导致|根因|为什么|因果)/.test(query)) return 'cause';
            if (/(证据|支持|数据|现象|表现|报警|温度|压力)/.test(query)) return 'evidence';
            return 'cause';
        }

        function shouldUseReasoningChain(message) {
            const text = String(message || '').trim();
            if (!text) return false;
            if (isSmallTalkMessage(text)) return false;
            if (isConversationMemoryQuestion(text)) return false;
            if (getReasoningCase(text)) return true;
            if (!hasFaultKnowledgeSignal(text)) return false;
            return /(故障|报警|告警|停机|复位|排查|检查|诊断|原因|处理|为什么|怎么|如何|原理|机理|机制|压力|温度|电流|反馈|阀|泵|传感器|编码器|液压|变桨|偏航|制动|风机|风电|PLC|SCADA|HMI|故障码|代码)/i.test(
                text,
            );
        }

        function isConversationMemoryQuestion(text) {
            const normalized = String(text || '').trim();
            if (!normalized) return false;
            return /(刚才|之前|前面|上一个|上一条|上一轮|上次|最近)/.test(normalized)
                && /(问|说|提到|提了|聊|查|查询)/.test(normalized)
                && /(故障码|故障代码|报码|报警码|告警码|代码|fault\s*code|alarm\s*code)/i.test(normalized);
        }

        function isSmallTalkMessage(text) {
            const normalized = normalizeQuestionText(text);
            if (!normalized) return false;
            if (normalized.length <= 6 && /^(你好|您好|哈喽|hi|hello|在吗|在不在|早上好|晚上好|中午好|谢谢|收到|明白了|ok|好的|嗯|嗯嗯|嗨)$/i.test(normalized)) {
                return true;
            }
            return /^(你好|您好|哈喽|hi|hello|在吗|在不在|早上好|晚上好|中午好)/i.test(normalized) && normalized.length <= 12 && !hasFaultKnowledgeSignal(text);
        }

        function hasFaultKnowledgeSignal(text) {
            return /([A-Za-z]?_?[0-9]{3,}|故障码|故障代码|报警码|告警码|fault\s*code|怎么处理|如何处理|处理方法|处置|排查|检查|维修|复位|短路|断路|丢失|不可复位|停机|报警|告警|报错|压力|温度|过热|过温|超温|电流|阀|泵|传感器|编码器|液压|变桨|偏航|制动|风机|风电|齿轮箱|PLC|SCADA|HMI|发热)/i.test(text);
        }

        function buildReasoningGraph(seedId, intent, message = '') {
            const baseGraph = reasoningGraphCache();
            const baseSeed = baseGraph.byId.get(seedId);
            if (!baseSeed) return null;
            const graph = buildRuntimeEvidenceGraph(baseGraph, baseSeed, message);
            const seed = graph.byId.get(seedId);
            if (!seed) return null;

            const wanted = new Set([seed.id]);
            for (const edge of graph.edges.filter(e => e.runtime)) {
                wanted.add(edge.source);
                wanted.add(edge.target);
            }
            let frontier = [seed.id];
            const visibility = { hasRuntimeEvidence: (graph.runtimeEvidence || []).length > 0 };
            visibility.confirmedNodeIds = confirmedRuntimeNodeIds(graph);
            for (let depth = 0; depth < 3; depth++) {
                const next = [];
                for (const id of frontier) {
                    const rel = graph.edges
                        .filter(e => e.source === id || e.target === id)
                        .filter(e => reasoningEdgeVisibleBeforeEvidence(e, graph.byId, visibility))
                        .sort((a, b) => reasoningEdgePriority(a.type) - reasoningEdgePriority(b.type))
                        .slice(0, depth === 0 ? 18 : 10);
                    for (const e of rel) {
                        if (!wanted.has(e.source)) {
                            wanted.add(e.source);
                            next.push(e.source);
                        }
                        if (!wanted.has(e.target)) {
                            wanted.add(e.target);
                            next.push(e.target);
                        }
                    }
                }
                frontier = next.slice(0, 28);
            }

            const pool = graph.edges
                .filter(e => wanted.has(e.source) && wanted.has(e.target))
                .filter(e => reasoningEdgeVisibleBeforeEvidence(e, graph.byId, visibility));
            const stageMap = {
                cause: [
                    ['原理基础', ['PRINCIPLE', 'INVOLVES_COMPONENT'], 8],
                    ['机理原型', ['EXPLAINED_BY_ARCHETYPE'], 4],
                    ['机理分层', ['HAS_MECHANISM_LAYER', 'MECHANISM_RESULTS_IN'], 10],
                    ['失效模式', ['HAS_FAILURE_MODE'], 8],
                    ['竞争假设', ['HAS_COMPETING_HYPOTHESIS', 'DISCRIMINATES_ARCHETYPE'], 8],
                    ['传播链路', ['HAS_PROPAGATION_START', 'HAS_PROPAGATION_STEP', 'MECHANISM_PROPAGATES_TO'], 12],
                    ['故障表现', ['MANIFESTS_AS'], 8],
                    ['对话证据', ['DIAGNOSED_BY'], 12],
                    ['证据支持', ['CONFIRMS'], 12],
                    ['排除校验', ['EXCLUDES'], 8],
                    ['根因推导', ['LEADS_TO', 'CAN_TRIGGER', 'CAN_ESCALATE_TO'], 18],
                ],
                diagnosis: [
                    ['原理基础', ['PRINCIPLE', 'INVOLVES_COMPONENT'], 8],
                    ['机理原型', ['EXPLAINED_BY_ARCHETYPE'], 4],
                    ['对话证据', ['DIAGNOSED_BY'], 12],
                    ['证据支持', ['CONFIRMS'], 12],
                    ['排除校验', ['EXCLUDES'], 8],
                    ['排查路径', ['HAS_DIAGNOSTIC_STEP'], 12],
                    ['机理验证', ['HAS_OBSERVABLE', 'VERIFIED_BY_TEST', 'VALIDATES_ARCHETYPE'], 12],
                    ['鉴别诊断', ['HAS_COMPETING_HYPOTHESIS', 'REQUIRES_DISCRIMINATING_EVIDENCE', 'RESOLVED_BY_COUNTERFACTUAL_TEST', 'HAS_DECISION_RULE'], 12],
                    ['定位证据', ['DIAGNOSES_EARLY'], 12],
                    ['根因回扣', ['LEADS_TO', 'CAN_TRIGGER'], 6],
                ],
                evidence: [
                    ['原理基础', ['PRINCIPLE', 'INVOLVES_COMPONENT'], 8],
                    ['机理观测', ['HAS_OBSERVABLE', 'VALIDATES_ARCHETYPE'], 12],
                    ['鉴别证据', ['REQUIRES_DISCRIMINATING_EVIDENCE', 'HAS_DECISION_RULE'], 10],
                    ['对话证据', ['DIAGNOSED_BY'], 12],
                    ['证据支持', ['SUPPORTED_BY', 'CONFIRMS', 'MANIFESTS_AS', 'CAN_ESCALATE_TO'], 18],
                    ['排除校验', ['EXCLUDES'], 8],
                    ['证据解释', ['LEADS_TO', 'RESULTS_IN'], 8],
                ],
                action: [
                    ['处置方案', ['TEMPORARILY_MITIGATED_BY', 'MITIGATED_BY'], 10],
                    ['机理验证', ['VERIFIED_BY_TEST', 'HAS_OBSERVABLE'], 8],
                    ['反事实试验', ['RESOLVED_BY_COUNTERFACTUAL_TEST', 'HAS_DECISION_RULE'], 8],
                    ['效果验证', ['VERIFIED_BY', 'SUPPORTED_BY'], 8],
                    ['故障依据', ['DIAGNOSED_BY', 'MANIFESTS_AS'], 6],
                ],
                prevention: [
                    ['控制屏障', ['CONTROLLED_BY_BARRIER'], 10],
                    ['预防复发', ['PREVENTED_BY', 'PREVENTS'], 14],
                    ['机理原型', ['EXPLAINED_BY_ARCHETYPE', 'HAS_FAILURE_MODE', 'HAS_COMPETING_HYPOTHESIS'], 8],
                    ['根因控制', ['LEADS_TO', 'CAN_TRIGGER'], 8],
                    ['效果验证', ['VERIFIED_BY'], 6],
                ],
            };

            const stages = stageMap[intent] || stageMap.cause;
            const result = [];
            const seen = new Set();
            for (const [stage, types, limit] of stages) {
                const sorter = ['原理基础', '根因推导', '根因回扣', '根因控制', '证据解释'].includes(stage) ? reasoningEdgeFlowCompare(graph.byId, seed) : reasoningEdgeStageCompare(graph.byId, seed);
                const list = pool
                    .filter(e => types.includes(e.type))
                    .filter(e => reasoningStageEdgeAllowed(stage, e, graph.byId, visibility))
                    .sort(sorter)
                    .slice(0, limit);
                for (const e of list) {
                    const seenKey = `${stage}|${e.source}|${e.type}|${e.target}`;
                    if (seen.has(seenKey)) continue;
                    seen.add(seenKey);
                    const from = graph.byId.get(e.source);
                    const to = graph.byId.get(e.target);
                    const node = e.target === seed.id ? from : to;
                    result.push({ stage, edge: e, from, to, node });
                }
            }

            const steps = result.slice(0, 40);
            return {
                seed,
                intent,
                steps,
                graph,
                runtimeEvidence: graph.runtimeEvidence || [],
                assessment: assessReasoningObjectivity(seed, steps, graph.runtimeEvidence || []),
            };
        }

        function assessReasoningObjectivity(seed, steps, runtimeEvidence) {
            const evidenceTags = new Set(runtimeEvidence.flatMap(item => item.tags || []));
            const causes = uniqueLabels(steps
                .filter(step => step.from.type === 'causal_factor' || step.to.type === 'causal_factor')
                .map(step => step.from.type === 'causal_factor' ? step.from.label : step.to.label));
            const supportedFaultLinks = uniqueLabels(steps
                .filter(step => step.edge.runtime && step.edge.type === 'CONFIRMS' && step.to.type === 'intermediate_failure')
                .map(step => step.to.label));
            const excluded = uniqueLabels(steps
                .filter(step => step.edge.type === 'EXCLUDES' || step.to.type === 'excluded_cause')
                .map(step => step.to.label));
            const diagnosticSteps = uniqueLabels(steps
                .filter(step => step.edge.type === 'HAS_DIAGNOSTIC_STEP')
                .map(step => step.to.label));
            const confirmed = uniqueLabels(steps
                .filter(step => step.edge.type === 'CONFIRMS' && step.edge.runtime)
                .map(step => step.to.label));
            const confirmedCauses = uniqueLabels(steps
                .filter(step => step.edge.type === 'CONFIRMS' && step.edge.runtime && step.to.type === 'causal_factor')
                .map(step => step.to.label));
            const evidenceCount = runtimeEvidence.length;
            const exclusionCount = excluded.length;
            const confirmedCount = confirmed.length;
            const hasFaultPhenomenon = evidenceTags.has('pressure') || evidenceTags.has('time') || evidenceTags.has('display_alarm');
            const hasAbnormalLink = supportedFaultLinks.length > 0;
            const hasCompetingExclusion = exclusionCount > 0;
            const hasDirectCauseEvidence = confirmedCauses.length > 0;
            const hasPostFixValidation = evidenceTags.has('post_fix_validation');
            const counterEvidence = buildCounterEvidence(runtimeEvidence);
            const counterPenalty = Math.min(40, counterEvidence.reduce((sum, item) => sum + item.penalty, 0));
            const scoreBreakdown = buildReasoningScoreBreakdown({
                evidenceCount,
                excluded,
                supportedFaultLinks,
                confirmedCauses,
                hasFaultPhenomenon,
                hasAbnormalLink,
                hasCompetingExclusion,
                hasDirectCauseEvidence,
                hasPostFixValidation,
                counterEvidence,
                counterPenalty,
            });
            const positiveScore = scoreBreakdown.filter(item => item.earned > 0).reduce((sum, item) => sum + item.earned, 0);
            const score = Math.max(0, Math.min(100, positiveScore - counterPenalty));
            let level = '待验证';
            if (score >= 45 && hasAbnormalLink) level = '中等可信';
            if (score >= 72 && hasDirectCauseEvidence && hasPostFixValidation) level = '较高可信';
            if (counterEvidence.length) level = score >= 60 && hasDirectCauseEvidence && hasPostFixValidation ? '有反证待复核' : '待验证';
            const requiredChecks = buildRequiredReasoningChecks(seed, {
                hasFaultPhenomenon,
                hasAbnormalLink,
                hasCompetingExclusion,
                hasDirectCauseEvidence,
                hasPostFixValidation,
                excluded,
            });
            const riskWarnings = buildReasoningRiskWarnings(seed, {
                hasFaultPhenomenon,
                hasAbnormalLink,
                hasCompetingExclusion,
                hasDirectCauseEvidence,
                hasPostFixValidation,
                confirmedCauses,
                counterEvidence,
            });
            return {
                level,
                score,
                scoreBreakdown,
                counterEvidence,
                counterPenalty,
                positiveScore,
                evidenceCount,
                supportedHypotheses: causes.slice(0, 4),
                supportedFaultLinks: supportedFaultLinks.slice(0, 4),
                confirmed: confirmed.slice(0, 3),
                confirmedCauses: confirmedCauses.slice(0, 3),
                excluded: excluded.slice(0, 5),
                requiredChecks,
                riskWarnings,
                pendingChecks: requiredChecks.length ? requiredChecks : diagnosticSteps.filter(item => !excluded.includes(item)).slice(0, 5),
                summary: `${seed.label}：${level}，可信度${score}/100，已提取${evidenceCount}项现场证据，已排除${exclusionCount}项竞争原因${counterEvidence.length ? `，存在${counterEvidence.length}项反证/替代假设` : ''}。`,
            };
        }

        function buildReasoningScoreBreakdown(state) {
            const evidenceScore = Math.min(24, state.evidenceCount * 6);
            const exclusionScore = Math.min(18, state.excluded.length * 6);
            const items = [
                {
                    key: 'field_evidence',
                    label: '现场证据数量与来源',
                    earned: evidenceScore,
                    max: 24,
                    status: evidenceScore >= 18 ? '充分' : evidenceScore > 0 ? '部分' : '缺失',
                    evidence: state.evidenceCount ? `已提取${state.evidenceCount}项对话证据` : '未提取到现场数据',
                },
                {
                    key: 'fault_phenomenon',
                    label: '故障现象量化',
                    earned: state.hasFaultPhenomenon ? 12 : 0,
                    max: 12,
                    status: state.hasFaultPhenomenon ? '满足' : '缺失',
                    evidence: state.hasFaultPhenomenon ? '已有压力/时间/告警等现象证据' : '缺少压力、时间或告警记录',
                },
                {
                    key: 'abnormal_link',
                    label: '异常环节定位',
                    earned: state.hasAbnormalLink ? 16 : 0,
                    max: 16,
                    status: state.hasAbnormalLink ? '满足' : '缺失',
                    evidence: state.hasAbnormalLink ? `已支持：${state.supportedFaultLinks.join('、')}` : '尚未把现象落到建压慢、流量受限等环节',
                },
                {
                    key: 'competing_exclusion',
                    label: '竞争原因排除',
                    earned: exclusionScore,
                    max: 18,
                    status: exclusionScore >= 12 ? '较充分' : exclusionScore > 0 ? '部分' : '缺失',
                    evidence: state.excluded.length ? `已排除：${state.excluded.join('、')}` : '尚未形成主回路、阀件或检测回路排除证据',
                },
                {
                    key: 'direct_cause',
                    label: '直接根因证据',
                    earned: state.hasDirectCauseEvidence ? 18 : 0,
                    max: 18,
                    status: state.hasDirectCauseEvidence ? '满足' : '缺失',
                    evidence: state.hasDirectCauseEvidence ? `直接指向：${state.confirmedCauses.join('、')}` : '缺少拆检、厂家确认或部件实物证据',
                },
                {
                    key: 'post_fix_validation',
                    label: '处理后复测闭环',
                    earned: state.hasPostFixValidation ? 12 : 0,
                    max: 12,
                    status: state.hasPostFixValidation ? '满足' : '缺失',
                    evidence: state.hasPostFixValidation ? '已有清理/处理后的压力、时间或告警复测结果' : '缺少处理后复测结果',
                },
            ];
            if (state.counterEvidence?.length) {
                items.push({
                    key: 'counter_evidence',
                    label: '反证/替代假设扣减',
                    earned: -state.counterPenalty,
                    max: 0,
                    status: '需复核',
                    evidence: state.counterEvidence.map(item => `${item.label}：${item.implication}`).join('；'),
                });
            }
            return items;
        }

        function buildCounterEvidence(runtimeEvidence) {
            const rules = [
                {
                    tag: 'counter_valve_transfer',
                    label: '调换电磁换向阀后故障随阀转移',
                    implication: '更支持电磁换向阀故障，不支持继续优先指向隐蔽阻尼缓冲器',
                    penalty: 18,
                },
                {
                    tag: 'counter_after_clean_no_change',
                    label: '清理/更换隐蔽阻尼缓冲器后压力恢复无改善',
                    implication: '直接削弱隐蔽阻尼缓冲器堵塞结论，需要回查阀件、油路污染和测量回路',
                    penalty: 24,
                },
                {
                    tag: 'counter_sensor_mismatch',
                    label: '机械压力表正常但HMI/SCADA显示异常',
                    implication: '更支持压力传感器、接插件、AI通道或显示回路异常',
                    penalty: 16,
                },
                {
                    tag: 'counter_main_loop_abnormal',
                    label: '主回路压力或液压泵电流异常',
                    implication: '更支持主回路/泵源问题，不能直接定位偏航支路阻尼元件',
                    penalty: 16,
                },
            ];
            const tags = new Set(runtimeEvidence.flatMap(item => item.tags || []));
            return rules
                .filter(rule => tags.has(rule.tag))
                .map(rule => {
                    const sources = runtimeEvidence
                        .filter(item => (item.tags || []).includes(rule.tag))
                        .map(item => item.source || '当前对话');
                    return { ...rule, source: [...new Set(sources)].join('、') };
                });
        }

        function buildRequiredReasoningChecks(seed, state) {
            if (seed.id !== 'case:yaw_hydraulic_pressure') {
                return ['补充现场实测数据', '完成动作复测', '记录处理前后状态'];
            }
            const checks = [];
            if (!state.hasFaultPhenomenon) checks.push('补充偏航释放/恢复过程的压力值、恢复时间和SCADA/HMI告警记录');
            if (!state.hasAbnormalLink) checks.push('用压力下降幅度和恢复时间确认是否属于建压缓慢/流量受限，而不是单纯显示误差');
            if (!state.hasCompetingExclusion) checks.push('通过主回路压力、电机电流、换向阀调换、截止阀/单向阀/节流阀检查排除相邻原因');
            if (!state.hasDirectCauseEvidence) checks.push('拆检并确认隐蔽阻尼缓冲器孔洞堵塞或通流受限，不能只凭压力慢恢复定责');
            if (!state.hasPostFixValidation) checks.push('清理或更换后复测建压时间、目标压力和告警复现情况，形成处理闭环');
            if (state.counterEvidence?.length) checks.push('先复核反证：确认故障是否随阀件转移、处理后是否无改善、机械表与HMI是否不一致，再决定是否继续沿当前根因推进');
            return checks;
        }

        function buildReasoningRiskWarnings(seed, state) {
            const warnings = [];
            if (state.counterEvidence?.length) warnings.push(`存在反证/替代假设：${state.counterEvidence.map(item => `${item.label}，${item.implication}`).join('；')}`);
            if (!state.hasFaultPhenomenon) warnings.push('缺少现场量化数据，当前只能作为原理性排查方向');
            if (state.hasDirectCauseEvidence && !state.hasCompetingExclusion) warnings.push('已有直接根因线索，但相邻阀件/主回路排除不足，结论仍需谨慎');
            if (state.hasDirectCauseEvidence && !state.hasPostFixValidation) warnings.push('缺少处理后复测，不能证明该根因解释了全部故障现象');
            if (state.confirmedCauses?.length && !state.hasFaultPhenomenon) warnings.push('根因描述缺少故障现象支撑，建议补充压力和时间数据');
            return warnings;
        }

        function buildRuntimeEvidenceGraph(baseGraph, seed, message) {
            const nodes = baseGraph.nodes.map(node => ({ ...node }));
            const edges = baseGraph.edges.map(edge => ({ ...edge }));
            addPrincipleLayer(nodes, edges, seed);
            const runtimeEvidence = extractRuntimeEvidenceNodes(message);
            for (const node of runtimeEvidence) {
                nodes.push(node);
                edges.push({
                    id: `runtime-edge:${node.id}`,
                    source: seed.id,
                    type: 'DIAGNOSED_BY',
                    target: node.id,
                    runtime: true,
                });
                for (const edge of inferRuntimeEvidenceEdges(node, seed, baseGraph.byId)) {
                    edges.push(edge);
                }
            }
            const byId = new Map(nodes.map(node => [node.id, node]));
            return { nodes, edges, byId, runtimeEvidence };
        }

        function addPrincipleLayer(nodes, edges, seed) {
            const nodeIds = new Set(nodes.map(node => node.id));
            const edgeKeys = new Set(edges.map(edge => `${edge.source}|${edge.type}|${edge.target}`));
            const addNode = node => {
                if (!nodeIds.has(node.id)) {
                    nodes.push(node);
                    nodeIds.add(node.id);
                }
            };
            const addEdge = edge => {
                const key = `${edge.source}|${edge.type}|${edge.target}`;
                if (!edgeKeys.has(key)) {
                    edges.push(edge);
                    edgeKeys.add(key);
                }
            };

            if (seed.id === 'case:yaw_hydraulic_pressure') {
                addNode({ id: 'principle:yaw_oil_flow_pressure', type: 'intermediate_failure', label: '偏航回路油流决定建压速度' });
                addNode({ id: 'principle:yaw_restriction_slow_pressure', type: 'intermediate_failure', label: '节流或堵塞会造成压力恢复变慢' });
                addEdge({ source: 'component:yaw_damper', type: 'PRINCIPLE', target: 'principle:yaw_oil_flow_pressure' });
                addEdge({ source: 'principle:yaw_oil_flow_pressure', type: 'PRINCIPLE', target: 'principle:yaw_restriction_slow_pressure' });
                addEdge({ source: 'principle:yaw_restriction_slow_pressure', type: 'MANIFESTS_AS', target: 'symptom:yaw_pressure_slow' });
            }
        }

        function extractRuntimeEvidenceNodes(message) {
            const text = String(message || '');
            const found = [];
            const sourceTurns = [...text.matchAll(/第(\d+)轮：([^\n]+)/g)].map(match => ({
                turn: Number(match[1]),
                text: match[2],
            }));
            const sourcesFor = pattern => {
                const turns = sourceTurns
                    .filter(item => pattern.test(item.text))
                    .map(item => `第${item.turn}轮`);
                return turns.length ? [...new Set(turns)].join('、') : '当前对话';
            };
            const add = (label, tags = [], source = '当前对话') => {
                if (!label || found.some(item => item.label === label)) return;
                found.push({
                    id: `runtime:evidence:${reasoningHash(label)}`,
                    type: 'diagnostic_signal',
                    label,
                    tags,
                    source,
                    runtime: true,
                });
            };

            const codes = [...text.matchAll(/\b(T_\d+|YX\d+|5806|Q16\.1|A240\.1|3\.07EL1008-CH7|192|193|194)\b/gi)].map(m => m[1]);
            if (codes.length) add(`现场故障码/反馈：${[...new Set(codes)].join('、')}`, ['fault_code'], sourcesFor(/\b(T_\d+|YX\d+|5806|Q16\.1|A240\.1|3\.07EL1008-CH7|192|193|194)\b/i));

            const pressures = [...text.matchAll(/\d+(?:\.\d+)?\s*bar/gi)].map(m => m[0].replace(/\s+/g, ''));
            if (pressures.length) add(`现场压力数据：${[...new Set(pressures)].join('、')}`, ['pressure', 'yaw_pressure_build_slow'], sourcesFor(/\d+(?:\.\d+)?\s*bar/i));

            const currents = [...text.matchAll(/\d+(?:\.\d+)?\s*A\b/g)].map(m => m[0].replace(/\s+/g, ''));
            if (currents.length) add(`现场电流数据：${[...new Set(currents)].join('、')}`, ['current', 'main_loop_test'], sourcesFor(/\d+(?:\.\d+)?\s*A\b/));

            const times = [...text.matchAll(/\d+(?:\.\d+)?\s*(?:s|秒|分钟|h|小时)/gi)].map(m => m[0].replace(/\s+/g, ''));
            if (times.length) add(`现场时间数据：${[...new Set(times)].join('、')}`, ['time', 'yaw_pressure_build_slow'], sourcesFor(/\d+(?:\.\d+)?\s*(?:s|秒|分钟|h|小时)/i));

            if (/机械压力表|HMI|SCADA|告警/.test(text)) add('现场显示/告警反馈已提供', ['display_alarm'], sourcesFor(/机械压力表|HMI|SCADA|告警/));
            if (/无反馈|反馈为0|24VDC|端口/.test(text)) add('现场反馈信号异常', ['feedback_signal'], sourcesFor(/无反馈|反馈为0|24VDC|端口/));
            if (/动作一次|频繁动作|启动次数/.test(text)) add('液压站动作次数已提供', ['pump_action_count'], sourcesFor(/动作一次|频繁动作|启动次数/));
            if (/无异常声响|异常声响|温度偏高|发热/.test(text)) add('现场声音/温升现象已提供', ['sound_temperature'], sourcesFor(/无异常声响|异常声响|温度偏高|发热/));
            if (/接插件|端子|松动|压接/.test(text)) add('现场接线/端子状态已提供', ['terminal_wiring'], sourcesFor(/接插件|端子|松动|压接/));
            if (/调换.*电磁换向阀.*(未转移|没有转移|仍然|依旧|还是|仍在偏航)|电磁换向阀.*调换.*(未转移|没有转移|仍然|依旧|还是|仍在偏航)|15\.2.*15\.1.*(未转移|仍然|依旧|还是)|15\.1.*15\.2.*(未转移|仍然|依旧|还是)/.test(text)) add('调换电磁换向阀后现象未转移', ['exclude_directional_valve'], sourcesFor(/调换.*电磁换向阀.*(未转移|没有转移|仍然|依旧|还是|仍在偏航)|电磁换向阀.*调换.*(未转移|没有转移|仍然|依旧|还是|仍在偏航)|15\.2.*15\.1.*(未转移|仍然|依旧|还是)|15\.1.*15\.2.*(未转移|仍然|依旧|还是)/));
            if (/调换.*电磁换向阀.*(转移|跟随|跟着|随阀)|电磁换向阀.*调换.*(转移|跟随|跟着|随阀)|换阀后.*(故障|现象).*(转移|跟随|跟着|随阀)/.test(text)) add('调换电磁换向阀后故障随阀转移', ['counter_valve_transfer'], sourcesFor(/调换.*电磁换向阀.*(转移|跟随|跟着|随阀)|电磁换向阀.*调换.*(转移|跟随|跟着|随阀)|换阀后.*(故障|现象).*(转移|跟随|跟着|随阀)/));
            if (/主回路|液压泵电流|泵电流|出口压力/.test(text)) add('主回路压力/液压泵电流检查结果已提供', ['main_loop_test'], sourcesFor(/主回路|液压泵电流|泵电流|出口压力/));
            if (/主回路.*(异常|不足|达不到|偏低)|液压泵电流.*(异常|偏大|偏小)|泵电流.*(异常|偏大|偏小)|出口压力.*(异常|不足|偏低)/.test(text)) add('主回路压力或液压泵电流异常', ['counter_main_loop_abnormal'], sourcesFor(/主回路.*(异常|不足|达不到|偏低)|液压泵电流.*(异常|偏大|偏小)|泵电流.*(异常|偏大|偏小)|出口压力.*(异常|不足|偏低)/));
            if (/截止阀|10\.2/.test(text)) add('截止阀检查结果已提供', ['exclude_cutoff_valve'], sourcesFor(/截止阀|10\.2/));
            if (/单向阀|9\.3/.test(text)) add('单向阀检查结果已提供', ['exclude_check_valve'], sourcesFor(/单向阀|9\.3/));
            if (/定差节流阀|节流阀|22\.1/.test(text)) add('定差节流阀检查结果已提供', ['exclude_throttle_valve'], sourcesFor(/定差节流阀|节流阀|22\.1/));
            if (/外部阻尼|外部.*缓冲器/.test(text)) add('外部阻尼缓冲器清洗/检查结果已提供', ['external_damper_checked'], sourcesFor(/外部阻尼|外部.*缓冲器/));
            if (/隐蔽阻尼|图纸未标注|厂家确认|孔洞|清理后|11s|153bar/.test(text)) add('隐蔽阻尼缓冲器检查或清理验证结果已提供', ['hidden_damper_confirm'], sourcesFor(/隐蔽阻尼|图纸未标注|厂家确认|孔洞|清理后|11s|153bar/));
            if (/(清理后|更换后|处理后).*(压力|建压|恢复|告警|复测)|复测.*(正常|恢复|无新增告警|不再触发)|无新增告警|不再触发|11s|153bar/.test(text)) add('处理后复测结果已提供', ['post_fix_validation'], sourcesFor(/(清理后|更换后|处理后).*(压力|建压|恢复|告警|复测)|复测.*(正常|恢复|无新增告警|不再触发)|无新增告警|不再触发|11s|153bar/));
            if (/(清理|更换|处理).*(隐蔽阻尼|阻尼缓冲器).*(无改善|无变化|仍然|依旧|还是)|清理后.*(压力恢复|建压).*(无改善|无变化|仍然|依旧|还是)/.test(text)) add('清理隐蔽阻尼缓冲器后压力恢复无改善', ['counter_after_clean_no_change'], sourcesFor(/(清理|更换|处理).*(隐蔽阻尼|阻尼缓冲器).*(无改善|无变化|仍然|依旧|还是)|清理后.*(压力恢复|建压).*(无改善|无变化|仍然|依旧|还是)/));
            if (/机械压力表.*正常.*(HMI|SCADA).*(异常|偏低|不一致)|机械表.*正常.*(HMI|SCADA).*(异常|偏低|不一致)|(HMI|SCADA).*(异常|偏低|不一致).*机械压力表.*正常/.test(text)) add('机械压力表正常但HMI/SCADA显示异常', ['counter_sensor_mismatch'], sourcesFor(/机械压力表.*正常.*(HMI|SCADA).*(异常|偏低|不一致)|机械表.*正常.*(HMI|SCADA).*(异常|偏低|不一致)|(HMI|SCADA).*(异常|偏低|不一致).*机械压力表.*正常/));

            return found.slice(0, 12);
        }

        function inferRuntimeEvidenceEdges(node, seed, byId) {
            const tags = new Set(node.tags || []);
            const edges = [];
            const add = (source, type, target) => {
                if (source !== node.id && !byId.has(source)) return;
                if (target !== node.id && !byId.has(target)) return;
                edges.push({
                    id: `runtime-edge:${node.id}:${source}:${type}:${target}`,
                    source,
                    type,
                    target,
                    runtime: true,
                });
            };

            if (seed.id === 'case:yaw_hydraulic_pressure') {
                if (tags.has('pressure') || tags.has('time') || tags.has('yaw_pressure_build_slow') || tags.has('pump_action_count')) {
                    add(node.id, 'CONFIRMS', 'failure:yaw_pressure_build_slow');
                    add(node.id, 'CONFIRMS', 'failure:yaw_flow_restricted');
                    add('failure:yaw_pressure_build_slow', 'DIAGNOSED_BY', node.id);
                    add('failure:yaw_flow_restricted', 'LEADS_TO', 'failure:yaw_pressure_build_slow');
                }
                if (tags.has('display_alarm')) add('case:yaw_hydraulic_pressure', 'MANIFESTS_AS', 'symptom:yaw_underpressure_alarm');
                if (tags.has('main_loop_test')) add(node.id, 'EXCLUDES', 'cause:main_loop_fault');
                if (tags.has('exclude_directional_valve')) add(node.id, 'EXCLUDES', 'cause:directional_valve_fault');
                if (tags.has('exclude_cutoff_valve')) add(node.id, 'EXCLUDES', 'cause:cutoff_valve_blocked');
                if (tags.has('exclude_check_valve')) add(node.id, 'EXCLUDES', 'cause:check_valve_blocked');
                if (tags.has('exclude_throttle_valve')) add(node.id, 'EXCLUDES', 'cause:throttle_valve_blocked');
                if (tags.has('external_damper_checked')) add(node.id, 'EXCLUDES', 'cause:throttle_valve_blocked');
                if (tags.has('hidden_damper_confirm')) {
                    add(node.id, 'CONFIRMS', 'cause:hidden_damper_blocked');
                    add('cause:hidden_damper_blocked', 'LEADS_TO', 'failure:yaw_flow_restricted');
                }
            }
            return edges;
        }

        function reasoningEdgeVisibleBeforeEvidence(edge, byId, options = {}) {
            const source = byId.get(edge.source);
            const target = byId.get(edge.target);
            if (!source || !target) return false;
            if (source.runtime || target.runtime || edge.runtime) return true;
            if (isStaticEvidenceNode(source) || isStaticEvidenceNode(target)) return false;

            const hasRuntimeEvidence = !!options.hasRuntimeEvidence;
            const confirmedNodeIds = options.confirmedNodeIds || new Set();
            if (!hasRuntimeEvidence) {
                if (isPreEvidenceHiddenNode(source) || isPreEvidenceHiddenNode(target)) return false;
                return ['INVOLVES_COMPONENT', 'HAS_DIAGNOSTIC_STEP', 'MANIFESTS_AS', 'LEADS_TO', 'PRINCIPLE'].includes(edge.type);
            }

            if ((isEvidenceGatedNode(source) && !confirmedNodeIds.has(source.id)) || (isEvidenceGatedNode(target) && !confirmedNodeIds.has(target.id))) {
                return false;
            }
            if (['DIAGNOSED_BY', 'SUPPORTED_BY', 'CONFIRMS', 'EXCLUDES', 'VERIFIED_BY'].includes(edge.type)) return false;
            return true;
        }

        function reasoningStageEdgeAllowed(stage, edge, byId, visibility) {
            if (!['根因推导', '根因回扣', '根因控制', '证据解释'].includes(stage)) return true;
            const confirmedNodeIds = visibility.confirmedNodeIds || new Set();
            const source = byId.get(edge.source);
            const target = byId.get(edge.target);
            if (!source || !target) return false;
            if (source.id.startsWith('principle:') || target.id.startsWith('principle:')) return true;
            return confirmedNodeIds.has(source.id) || confirmedNodeIds.has(target.id);
        }

        function isStaticEvidenceNode(node) {
            return !!node && !node.runtime && ['diagnostic_signal', 'evidence', 'validation'].includes(node.type);
        }

        function isPreEvidenceHiddenNode(node) {
            return !!node && !node.runtime && (
                ['causal_factor', 'management_factor', 'excluded_cause', 'action', 'temporary_action', 'prevention', 'validation', 'diagnostic_signal', 'evidence'].includes(node.type)
                || (node.type === 'intermediate_failure' && !node.id.startsWith('principle:'))
            );
        }

        function isEvidenceGatedNode(node) {
            return !!node && !node.runtime && (
                ['causal_factor', 'management_factor', 'excluded_cause', 'action', 'temporary_action', 'prevention', 'validation'].includes(node.type)
                || (node.type === 'intermediate_failure' && !node.id.startsWith('principle:'))
            );
        }

        function confirmedRuntimeNodeIds(graph) {
            const ids = new Set();
            for (const edge of graph.edges || []) {
                if (edge.runtime && edge.type === 'CONFIRMS') ids.add(edge.target);
                if (edge.runtime && edge.type === 'EXCLUDES') ids.add(edge.target);
            }
            return ids;
        }

        function reasoningGraphCache() {
            if (window.__reasoningGraphCache) return window.__reasoningGraphCache;
            const nodes = window.__reasoningNodes || [];
            const edges = window.__reasoningEdges || [];
            const byId = new Map(nodes.map(node => [node.id, node]));
            window.__reasoningGraphCache = { nodes, edges, byId };
            return window.__reasoningGraphCache;
        }

        function reasoningEdgeFlowCompare(byId, seed = null) {
            return (a, b) => {
                const activeSeed = seed || byId.get(reasoningCaseId) || byId.get('case:yaw_hydraulic_pressure');
                const as = reasoningLaneRank(byId.get(a.source), activeSeed);
                const at = reasoningLaneRank(byId.get(a.target), activeSeed);
                const bs = reasoningLaneRank(byId.get(b.source), activeSeed);
                const bt = reasoningLaneRank(byId.get(b.target), activeSeed);
                return Math.max(as, at) - Math.max(bs, bt) || Math.min(as, at) - Math.min(bs, bt) || reasoningEdgePriority(a.type) - reasoningEdgePriority(b.type);
            };
        }

        function reasoningEdgeStageCompare(byId, seed = null) {
            return (a, b) => reasoningEdgePriority(a.type) - reasoningEdgePriority(b.type) || reasoningEdgeFlowCompare(byId, seed)(a, b);
        }

        function reasoningLaneRank(n, seed) {
            if (!n || !seed) return 3;
            const map = { root_cause: 0, failure: 1, fault: 2, evidence: 3, action: 4, validation: 5 };
            return map[reasoningLaneFor(n, seed)] ?? 3;
        }

        function reasoningLaneFor(n, seed) {
            if (n.id === seed.id) return 'fault';
            if (['causal_factor', 'management_factor', 'excluded_cause'].includes(n.type)) return 'root_cause';
            if (['intermediate_failure', 'component', 'mechanism_archetype', 'mechanism_layer', 'failure_mode', 'propagation_step', 'diagnostic_hypothesis', 'decision_rule'].includes(n.type)) return 'failure';
            if (['fault_case', 'risk'].includes(n.type)) return 'fault';
            if (['diagnostic_signal', 'diagnostic_step', 'symptom', 'evidence', 'observable', 'verification_test', 'discriminating_evidence', 'counterfactual_test'].includes(n.type)) return 'evidence';
            if (['action', 'temporary_action'].includes(n.type)) return 'action';
            if (['prevention', 'validation', 'control_barrier'].includes(n.type)) return 'validation';
            return 'evidence';
        }

        function reasoningEdgePriority(type) {
            return {
                PRINCIPLE: 1, EXPLAINED_BY_ARCHETYPE: 2, HAS_MECHANISM_LAYER: 3, MECHANISM_RESULTS_IN: 4,
                HAS_FAILURE_MODE: 5, HAS_PROPAGATION_START: 6, MECHANISM_PROPAGATES_TO: 7, HAS_PROPAGATION_STEP: 8,
                HAS_COMPETING_HYPOTHESIS: 9, DISCRIMINATES_ARCHETYPE: 10, CAN_TRIGGER: 11, LEADS_TO: 12,
                HAS_OBSERVABLE: 13, REQUIRES_DISCRIMINATING_EVIDENCE: 14, RESOLVED_BY_COUNTERFACTUAL_TEST: 15,
                HAS_DECISION_RULE: 16, VERIFIED_BY_TEST: 17, VALIDATES_ARCHETYPE: 18, HAS_DIAGNOSTIC_STEP: 19,
                RESULTS_IN: 20, CONFIRMS: 21, DIAGNOSED_BY: 21, SUPPORTED_BY: 22, TEMPORARILY_MITIGATED_BY: 23,
                MITIGATED_BY: 24, VERIFIED_BY: 25, CONTROLLED_BY_BARRIER: 26, PREVENTED_BY: 27, PREVENTS: 28,
                EXCLUDES: 29, MANIFESTS_AS: 30, CAN_ESCALATE_TO: 31, DIAGNOSES_EARLY: 32
            }[type] ?? 30;
        }

        async function startReasoningForMessage(message, host) {
            if (reasoningChainTimer) {
                clearInterval(reasoningChainTimer);
                reasoningChainTimer = null;
            }
            clearReasoningPanels(host);
            reasoningData = null;

            try {
                await reasoningGraphReady;
            } catch (error) {
                console.error(error);
                const fallbackGraph = buildTextReasoningFallbackGraph(message, '排查图加载失败，已切换为文本诊断。');
                reasoningData = fallbackGraph;
                renderReasoningPanel(fallbackGraph, host);
                playReasoningSteps(fallbackGraph).catch(err => finishReasoningPanelAfterError(fallbackGraph));
                return fallbackGraph;
            }

            const intent = detectReasoningIntent(message);
            const seed = inferReasoningCaseForMessage(message);
            const evidenceContext = rememberReasoningEvidence(seed.id, message);

            let graph = null;
            try {
                graph = isGenericReasoningCase(seed.id) ? null : buildReasoningGraph(seed.id, intent, evidenceContext);
            } catch (error) {
                console.error(error);
                graph = buildTextReasoningFallbackGraph(message, '排查图构建异常，已切换为文本诊断。', seed, intent, evidenceContext);
            }
            if (!graph || !graph.steps.length) {
                graph = buildTextReasoningFallbackGraph(message, '未命中专用案例，已按通用风机故障排查路径诊断。', seed, intent, evidenceContext);
            }

            reasoningData = graph;
            reasoningCaseId = seed.id;
            graph.currentMessage = message;
            graph.evidenceContext = evidenceContext;
            renderReasoningPanel(graph, host);
            playReasoningSteps(graph).catch(error => {
                console.error(error);
                finishReasoningPanelAfterError(graph);
            });
            return graph;
        }

        function rememberReasoningEvidence(seedId, message) {
            reasoningTurnIndex += 1;
            const text = String(message || '').trim();
            if (!text) return '';
            if (!reasoningEvidenceMemory.has(seedId)) reasoningEvidenceMemory.set(seedId, []);
            const bucket = reasoningEvidenceMemory.get(seedId);
            if (!bucket.some(item => item.text === text)) {
                bucket.push({ turn: reasoningTurnIndex, text });
            }
            return bucket.slice(-8).map(item => `第${item.turn}轮：${item.text}`).join('\n');
        }

        function buildTextReasoningFallbackGraph(message, reason, seed = null, intent = null, evidenceContext = '') {
            const inferredSeed = seed || inferReasoningCaseForMessage(message);
            const inferredIntent = intent || detectReasoningIntent(message);
            const safeSeed = {
                id: inferredSeed.id || genericReasoningCase.id,
                type: 'fault_case',
                label: inferredSeed.label || '风机故障通用因果链',
            };
            const text = String(evidenceContext || message || '').trim();
            const runtimeEvidence = extractRuntimeEvidenceNodes(text);
            if (!runtimeEvidence.length && text) {
                runtimeEvidence.push({
                    id: `runtime:evidence:${reasoningHash(text)}`,
                    type: 'diagnostic_signal',
                    label: `当前问题：${text.replace(/^第\d+轮：/, '').slice(0, 56)}`,
                    tags: ['user_question'],
                    source: '当前对话',
                    runtime: true,
                });
            }

            const nodes = [
                safeSeed,
                { id: 'fallback:component_chain', type: 'component', label: '相关元器件与控制反馈回路' },
                { id: 'fallback:mechanism_signal_mismatch', type: 'intermediate_failure', label: '现场状态与控制反馈不一致' },
                { id: 'fallback:cause_power_signal_wiring', type: 'causal_factor', label: '供电、触点、线路、传感器或采集模块异常' },
                { id: 'fallback:symptom_alarm_trip', type: 'symptom', label: '告警、停机、复位失败或动作异常' },
                { id: 'fallback:step_confirm_alarm', type: 'diagnostic_step', label: '确认原始告警码、告警时间和伴随状态' },
                { id: 'fallback:step_measure_signal', type: 'diagnostic_step', label: '核对现场实测值与PLC/HMI反馈是否一致' },
                { id: 'fallback:step_check_component', type: 'diagnostic_step', label: '检查电源、端子、触点、传感器、线缆和执行元件' },
                { id: 'fallback:action_repair_verified_point', type: 'action', label: '修复已验证异常点后再复位' },
                { id: 'fallback:validation_trend', type: 'validation', label: '复测趋势、动作时间、反馈信号和告警复现情况' },
                ...runtimeEvidence,
            ];
            const edges = [
                { id: 'fallback-edge:seed-component', source: safeSeed.id, type: 'INVOLVES_COMPONENT', target: 'fallback:component_chain' },
                { id: 'fallback-edge:cause-failure', source: 'fallback:cause_power_signal_wiring', type: 'LEADS_TO', target: 'fallback:mechanism_signal_mismatch' },
                { id: 'fallback-edge:failure-seed', source: 'fallback:mechanism_signal_mismatch', type: 'CAN_TRIGGER', target: safeSeed.id },
                { id: 'fallback-edge:seed-symptom', source: safeSeed.id, type: 'MANIFESTS_AS', target: 'fallback:symptom_alarm_trip' },
                { id: 'fallback-edge:step-confirm', source: safeSeed.id, type: 'HAS_DIAGNOSTIC_STEP', target: 'fallback:step_confirm_alarm' },
                { id: 'fallback-edge:step-signal', source: safeSeed.id, type: 'HAS_DIAGNOSTIC_STEP', target: 'fallback:step_measure_signal' },
                { id: 'fallback-edge:step-component', source: safeSeed.id, type: 'HAS_DIAGNOSTIC_STEP', target: 'fallback:step_check_component' },
                { id: 'fallback-edge:seed-action', source: safeSeed.id, type: 'MITIGATED_BY', target: 'fallback:action_repair_verified_point' },
                { id: 'fallback-edge:action-validation', source: 'fallback:action_repair_verified_point', type: 'VERIFIED_BY', target: 'fallback:validation_trend' },
            ];
            runtimeEvidence.forEach((node, index) => {
                edges.push({ id: `fallback-edge:evidence-${index}`, source: safeSeed.id, type: 'DIAGNOSED_BY', target: node.id, runtime: true });
                edges.push({ id: `fallback-edge:evidence-support-${index}`, source: node.id, type: 'CONFIRMS', target: 'fallback:mechanism_signal_mismatch', runtime: true });
            });
            const byId = new Map(nodes.map(node => [node.id, node]));
            const graph = { nodes, edges, byId, runtimeEvidence };
            const steps = [
                edges.find(edge => edge.type === 'INVOLVES_COMPONENT'),
                edges.find(edge => edge.type === 'MANIFESTS_AS'),
                ...edges.filter(edge => edge.runtime && edge.type === 'DIAGNOSED_BY'),
                ...edges.filter(edge => edge.runtime && edge.type === 'CONFIRMS'),
                ...edges.filter(edge => edge.type === 'HAS_DIAGNOSTIC_STEP'),
                edges.find(edge => edge.type === 'MITIGATED_BY'),
                edges.find(edge => edge.type === 'VERIFIED_BY'),
            ].filter(Boolean).map(edge => {
                const from = byId.get(edge.source);
                const to = byId.get(edge.target);
                return {
                    stage: fallbackReasoningStage(edge.type),
                    edge,
                    from,
                    to,
                    node: to?.id === safeSeed.id ? from : to,
                };
            }).filter(step => step.from && step.to && step.node);
            const assessment = assessReasoningObjectivity(safeSeed, steps, runtimeEvidence);
            assessment.summary = `${reason || '已切换为文本诊断'} ${assessment.summary || ''}`.trim();
            if (!assessment.requiredChecks?.length) {
                assessment.requiredChecks = ['补充原始告警码、关键测量值和处理后复测结果'];
            }
            return {
                seed: safeSeed,
                intent: inferredIntent,
                steps,
                graph,
                runtimeEvidence,
                assessment,
                fallbackReason: reason,
                evidenceContext: text || message,
            };
        }

        function fallbackReasoningStage(edgeType) {
            return {
                INVOLVES_COMPONENT: '原理基础',
                MANIFESTS_AS: '故障表现',
                DIAGNOSED_BY: '对话证据',
                CONFIRMS: '证据支持',
                HAS_DIAGNOSTIC_STEP: '排查路径',
                EXPLAINED_BY_ARCHETYPE: '机理原型',
                HAS_MECHANISM_LAYER: '机理分层',
                MECHANISM_RESULTS_IN: '机理分层',
                HAS_FAILURE_MODE: '失效模式',
                HAS_COMPETING_HYPOTHESIS: '竞争假设',
                DISCRIMINATES_ARCHETYPE: '竞争假设',
                REQUIRES_DISCRIMINATING_EVIDENCE: '鉴别证据',
                RESOLVED_BY_COUNTERFACTUAL_TEST: '反事实试验',
                HAS_DECISION_RULE: '判别规则',
                HAS_PROPAGATION_START: '传播链路',
                HAS_PROPAGATION_STEP: '传播链路',
                MECHANISM_PROPAGATES_TO: '传播链路',
                HAS_OBSERVABLE: '机理观测',
                VALIDATES_ARCHETYPE: '机理验证',
                VERIFIED_BY_TEST: '机理验证',
                CONTROLLED_BY_BARRIER: '控制屏障',
                MITIGATED_BY: '处置方案',
                VERIFIED_BY: '效果验证',
            }[edgeType] || '文本诊断';
        }

        function playReasoningSteps(graph, root = activeReasoningPanel) {
            const scope = root || document;
            const networkEl = scope.querySelector('#reasoningNetwork');
            const flowEl = scope.querySelector('#reasoningFlow');
            const resultEl = scope.querySelector('#reasoningDynamicResult');
            const legendEl = scope.querySelector('#reasoningLegend');
            const stepsEl = scope.querySelector('#reasoningSteps');
            const statusEl = scope.querySelector('#reasoningCardStatus');
            const liveActionEl = scope.querySelector('#reasoningLiveAction');
            if (!networkEl || !flowEl || !stepsEl || !statusEl) return Promise.resolve();

            renderReasoningNetwork(graph, networkEl, -1);
            if (legendEl) renderReasoningLegend(legendEl);
            flowEl.innerHTML = '';
            if (resultEl) renderDynamicReasoningResult(graph, resultEl, -1, false);
            if (liveActionEl) renderReasoningLiveAction(graph, liveActionEl, -1, false);
            stepsEl.innerHTML = '';

            const nodes = [graph.seed.label];
            for (const step of graph.steps.slice(0, 8)) {
                nodes.push(step.node.label);
            }

            for (let i = 0; i < nodes.length; i++) {
                const node = document.createElement('div');
                node.className = 'reasoning-node';
                node.textContent = nodes[i];
                node.dataset.index = String(i);
                flowEl.appendChild(node);
                if (i < nodes.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = 'reasoning-arrow';
                    arrow.textContent = '→';
                    flowEl.appendChild(arrow);
                }
            }

            graph.steps.forEach((step, index) => {
                const item = document.createElement('div');
                item.className = 'reasoning-step';
                item.innerHTML = `<span class="tag">${escapeHtml(step.stage)}</span>${escapeHtml(formatReasoningStepText(step))}`;
                stepsEl.appendChild(item);
            });

            return new Promise(resolve => {
                let index = 0;
                let settled = false;
                const finish = () => {
                    if (settled) return;
                    settled = true;
                    statusEl.textContent = `完成 · ${graph.steps.length} 步`;
                    renderReasoningNetwork(graph, networkEl, graph.steps.length - 1, true);
                    if (resultEl) renderDynamicReasoningResult(graph, resultEl, graph.steps.length - 1, true);
                    if (liveActionEl) renderReasoningLiveAction(graph, liveActionEl, graph.steps.length - 1, true);
                    clearInterval(reasoningChainTimer);
                    reasoningChainTimer = null;
                    resolve();
                };
                const stepDelayMs = 900;
                const maxPlaybackMs = Math.min(24000, Math.max(12000, graph.steps.length * stepDelayMs + 1800));
                const timeout = setTimeout(finish, maxPlaybackMs);
                const highlight = () => {
                    const nodeEls = flowEl.querySelectorAll('.reasoning-node');
                    const stepEls = stepsEl.querySelectorAll('.reasoning-step');
                    nodeEls.forEach(el => el.classList.remove('active'));
                    stepEls.forEach(el => el.classList.remove('active'));

                    if (index >= graph.steps.length) {
                        clearTimeout(timeout);
                        finish();
                        return;
                    }

                    const step = graph.steps[index];
                    const nodeIndex = Math.min(index + 1, nodeEls.length - 1);
                    if (nodeEls[nodeIndex]) nodeEls[nodeIndex].classList.add('active');
                    if (stepEls[index]) stepEls[index].classList.add('active');
                    renderReasoningNetwork(graph, networkEl, index);
                    if (resultEl) renderDynamicReasoningResult(graph, resultEl, index, false);
                    if (liveActionEl) renderReasoningLiveAction(graph, liveActionEl, index, false);
                    statusEl.textContent = `分析中 ${index + 1}/${graph.steps.length} · ${step.stage} · ${step.node.label}`;
                    index += 1;
                };

                highlight();
                reasoningChainTimer = setInterval(highlight, stepDelayMs);
            });
        }

        function finishReasoningPanelAfterError(graph, root = activeReasoningPanel) {
            const scope = root || document;
            const networkEl = scope.querySelector('#reasoningNetwork');
            const resultEl = scope.querySelector('#reasoningDynamicResult');
            const statusEl = scope.querySelector('#reasoningCardStatus');
            const liveActionEl = scope.querySelector('#reasoningLiveAction');
            if (statusEl) statusEl.textContent = '动画已中断 · 已保留诊断结论';
            if (networkEl) {
                try {
                    renderReasoningNetwork(graph, networkEl, graph.steps.length - 1, true);
                } catch (error) {
                    console.error(error);
                }
            }
            if (resultEl) {
                try {
                    renderDynamicReasoningResult(graph, resultEl, graph.steps.length - 1, true);
                } catch (error) {
                    console.error(error);
                }
            }
            if (liveActionEl) {
                try {
                    renderReasoningLiveAction(graph, liveActionEl, graph.steps.length - 1, true);
                } catch (error) {
                    console.error(error);
                }
            }
        }

        function renderDynamicReasoningResult(graph, host, activeIndex, finished) {
            const upto = graph.steps.slice(0, Math.max(0, activeIndex + 1));
            const current = graph.steps[activeIndex] || null;
            const conclusion = finished
                ? reasoningFinalConclusion(graph, upto)
                : current
                    ? `${current.stage}：${formatReasoningStepText(current)}`
                    : `先建立${graph.seed.label}的原理关系，等待现场证据进入`;
            const nextStep = finished
                ? reasoningFinalAction(graph, upto)
                : reasoningNextStep(graph, activeIndex);
            const validation = finished
                ? reasoningFinalValidation(graph, upto)
                : reasoningLiveValidation(graph, upto);
            const assessment = graph.assessment || {};
            const visualState = reasoningVisualState(graph, finished ? graph.steps : upto);
            const stateText = reasoningStateSummary(graph, visualState);

            host.innerHTML = [
                ['当前判断', `${assessment.level ? `【${assessment.level}】` : ''}${conclusion}`],
                ['可信度', `${Number.isFinite(assessment.score) ? `${assessment.score}/100` : '待评估'}；${assessment.summary || '等待证据评估'}`],
                ['评分依据', reasoningScoreBreakdownText(assessment)],
                ['图谱状态', stateText],
                ['反证扣分', assessment.counterEvidence?.length ? `${assessment.counterPenalty || 0}分；${assessment.counterEvidence.map(item => `${item.label}（${item.source}）`).join('；')}` : '未识别到明确反证'],
                ['对话证据', graph.runtimeEvidence?.length ? graph.runtimeEvidence.map(item => `${item.label}（${item.source || '当前对话'}）`).join('；') : '尚未从对话中提取到现场数据证据'],
                ['排除状态', assessment.excluded?.length ? `已排除：${assessment.excluded.join('、')}` : '尚未形成充分排除证据'],
                ['证据缺口', assessment.requiredChecks?.length ? assessment.requiredChecks.join('；') : '关键证据已覆盖，进入复测闭环确认'],
                ['反证提醒', assessment.riskWarnings?.length ? assessment.riskWarnings.join('；') : '当前未发现明显反证缺口'],
                ['下一步动作', nextStep],
                ['验证指标', validation],
            ].map(([label, text]) => `
                <div class="reasoning-result-item">
                    <div class="reasoning-result-label">${escapeHtml(label)}</div>
                    <div class="reasoning-result-text">${escapeHtml(text)}</div>
                </div>
            `).join('');
        }

        function renderReasoningLiveAction(graph, host, activeIndex, finished) {
            const current = graph.steps[activeIndex] || null;
            const text = finished
                ? reasoningFinalAction(graph, graph.steps)
                : current && ['排查路径', '定位证据', '处置方案', '效果验证', '预防复发'].includes(current.stage)
                    ? formatReasoningStepText(current)
                    : reasoningNextStep(graph, activeIndex);
            const label = finished ? '最终现场动作' : current ? `当前：${current.stage}` : '现场动作';
            host.innerHTML = `
                <div>
                    <div class="reasoning-live-action-label">${escapeHtml(label)}</div>
                    <div class="reasoning-live-action-text">${escapeHtml(text)}</div>
                </div>
                <div class="reasoning-live-action-foot">${finished ? '导图已完成，可导出图片' : '跟随高亮节点自动更新'}</div>
            `;
        }

        function reasoningScoreBreakdownText(assessment) {
            const items = assessment?.scoreBreakdown || [];
            if (!items.length) return '尚未形成可解释评分';
            return items.map(item => `${item.label}${item.earned}/${item.max}（${item.status}）`).join('；');
        }

        function reasoningStateSummary(graph, state) {
            const byId = graph.graph?.byId || reasoningGraphCache().byId;
            const labels = ids => [...ids].map(id => byId.get(id)?.label).filter(Boolean);
            const confirmed = labels(state.confirmed);
            const excluded = labels(state.excluded);
            const supported = labels(state.supported).filter(label => !confirmed.includes(label));
            const parts = [];
            if (confirmed.length) parts.push(`已确认：${confirmed.join('、')}`);
            if (supported.length) parts.push(`已支持：${supported.join('、')}`);
            if (excluded.length) parts.push(`已排除：${excluded.join('、')}`);
            if (!parts.length) parts.push('当前仅形成原理链和候选方向，等待现场证据进入');
            return parts.join('；');
        }

        function reasoningNextStep(graph, activeIndex) {
            const next = graph.steps.slice(activeIndex + 1).find(step => ['排查路径', '定位证据', '处置方案', '效果验证', '预防复发'].includes(step.stage));
            if (next) return `${next.stage}：${formatReasoningStepText(next)}`;
            const action = graph.steps.find(step => ['MITIGATED_BY', 'TEMPORARILY_MITIGATED_BY'].includes(step.edge.type));
            return action ? `准备执行：${action.to.label}` : '继续沿高亮路径补充证据并排除相邻原因';
        }

        function formatReasoningStepText(step) {
            const relation = reasoningRelationLabel[step.edge.type] || step.edge.type;
            if (step.edge.runtime && step.to.runtime) return `从${step.to.source || '当前对话'}提取到“${step.to.label}”，作为${step.from.label}的现场证据。`;
            if (step.edge.runtime && step.edge.type === 'EXCLUDES') return `根据“${step.from.label}”，暂时排除${step.to.label}。`;
            if (step.edge.runtime && step.edge.type === 'CONFIRMS') {
                return step.to.type === 'causal_factor'
                    ? `根据“${step.from.label}”，${step.to.label}进入已支持候选根因。`
                    : `根据“${step.from.label}”，${step.to.label}进入已支持异常环节。`;
            }
            if (step.edge.type === 'HAS_DIAGNOSTIC_STEP') return `针对${step.from.label}，下一步检查${step.to.label}。`;
            if (step.edge.type === 'MANIFESTS_AS') return `${step.from.label}通常会表现为${step.to.label}。`;
            if (step.edge.type === 'PRINCIPLE') return `${step.from.label}的基本原理是：${step.to.label}。`;
            if (step.edge.type === 'EXPLAINED_BY_ARCHETYPE') return `${step.from.label}可用“${step.to.label}”解释底层机理。`;
            if (step.edge.type === 'HAS_MECHANISM_LAYER') return `${step.from.label}包含机理层级：${step.to.label}。`;
            if (step.edge.type === 'MECHANISM_RESULTS_IN') return `${step.from.label}进一步形成${step.to.label}。`;
            if (step.edge.type === 'HAS_FAILURE_MODE') return `${step.from.label}的典型失效模式包括：${step.to.label}。`;
            if (step.edge.type === 'HAS_COMPETING_HYPOTHESIS') return `${step.from.label}需要鉴别：${step.to.label}。`;
            if (step.edge.type === 'DISCRIMINATES_ARCHETYPE') return `${step.from.label}用于区分“${step.to.label}”是否成立。`;
            if (step.edge.type === 'REQUIRES_DISCRIMINATING_EVIDENCE') return `鉴别${step.from.label}时，需要补充证据：${step.to.label}。`;
            if (step.edge.type === 'RESOLVED_BY_COUNTERFACTUAL_TEST') return `建议用反事实试验“${step.to.label}”来解决${step.from.label}。`;
            if (step.edge.type === 'HAS_DECISION_RULE') return `${step.from.label}的判别规则：${step.to.label}。`;
            if (step.edge.type === 'HAS_PROPAGATION_START') return `${step.from.label}的机理传播从${step.to.label}开始。`;
            if (step.edge.type === 'HAS_PROPAGATION_STEP' || step.edge.type === 'MECHANISM_PROPAGATES_TO') return `${step.from.label}会沿机理链传播到${step.to.label}。`;
            if (step.edge.type === 'HAS_OBSERVABLE') return `验证${step.from.label}时应观察：${step.to.label}。`;
            if (step.edge.type === 'VALIDATES_ARCHETYPE') return `${step.from.label}可用于验证“${step.to.label}”是否成立。`;
            if (step.edge.type === 'VERIFIED_BY_TEST') return `建议用“${step.to.label}”验证${step.from.label}。`;
            if (step.edge.type === 'CONTROLLED_BY_BARRIER') return `预防${step.from.label}复发，应建立控制屏障：${step.to.label}。`;
            if (step.edge.type === 'LEADS_TO') return `${step.from.label}会造成${step.to.label}。`;
            if (step.edge.type === 'INVOLVES_COMPONENT') return `${step.from.label}需要关注${step.to.label}。`;
            return `${step.from.label}${relation}${step.to.label}。`;
        }

        function reasoningLiveValidation(graph, steps) {
            const validation = steps.find(step => step.to.type === 'validation' || step.edge.type === 'VERIFIED_BY');
            if (validation) return validation.to.label;
            const evidence = steps.find(step => ['DIAGNOSED_BY', 'SUPPORTED_BY', 'CONFIRMS', 'RESULTS_IN'].includes(step.edge.type));
            return evidence ? evidence.to.label : '等待关键测量值、告警复现情况或动作后状态反馈';
        }

        function reasoningFinalConclusion(graph, steps) {
            const assessment = graph.assessment || {};
            if (assessment.counterEvidence?.length) {
                return `存在反证待复核：${assessment.counterEvidence.map(item => item.label).join('、')}，当前不能确认原根因`;
            }
            const confirmedCause = [...steps].reverse().find(step => step.edge.runtime && step.edge.type === 'CONFIRMS' && step.to.type === 'causal_factor');
            if (confirmedCause) return assessment.level === '较高可信' && (assessment.score || 0) >= 72
                ? `确认根因：${confirmedCause.to.label}`
                : `证据支持的优先排查方向：${confirmedCause.to.label}`;
            const confirmedLink = [...steps].reverse().find(step => step.edge.runtime && step.edge.type === 'CONFIRMS' && step.to.type === 'intermediate_failure');
            if (confirmedLink) return `已支持异常环节：${confirmedLink.to.label}，仍需继续定位具体元器件`;
            const cause = [...steps].reverse().find(step => step.from.type === 'causal_factor');
            if (cause) return `候选排查方向：${cause.from.label}`;
            return `已形成${graph.seed.label}的原理关系，等待现场证据闭环`;
        }

        function reasoningFinalAction(graph, steps) {
            const action = steps.find(step => ['MITIGATED_BY', 'TEMPORARILY_MITIGATED_BY'].includes(step.edge.type) || ['action', 'temporary_action'].includes(step.to.type));
            if (action) return action.to.label;
            const prevention = steps.find(step => ['PREVENTED_BY', 'PREVENTS'].includes(step.edge.type));
            return prevention ? prevention.to.label : '按已高亮排查项逐项闭环并记录处理前后数据';
        }

        function reasoningFinalValidation(graph, steps) {
            const validation = steps.find(step => step.edge.type === 'VERIFIED_BY' || step.to.type === 'validation');
            if (validation) return validation.to.label;
            const signal = steps.find(step => ['DIAGNOSED_BY', 'SUPPORTED_BY', 'RESULTS_IN'].includes(step.edge.type));
            return signal ? `复核：${signal.to.label}` : '复位后连续观察告警、压力/电流/反馈信号和动作时间';
        }

        function renderReasoningLegend(host) {
            const items = [
                ['principle', '原理/机理'],
                ['evidence', '对话证据'],
                ['supported', '证据支持'],
                ['excluded', '已排除'],
                ['confirmed', '闭环确认'],
                ['candidate', '候选方向'],

            host.innerHTML = items.map(([type, label]) => `
                <span class="reasoning-legend-item">
                    <span class="reasoning-legend-dot ${type}"></span>
                    <span>${escapeHtml(label)}</span>
                </span>
            `).join('');
        }

                    context.font = '800 13px "Noto Sans SC", "Inter", sans-serif';
                    context.fillText('当前判断', 88, 800);
                    context.fillStyle = '#374151';
                    context.font = '500 17px "Noto Sans SC", "Inter", sans-serif';
                    wrapCanvasText(context, resultText, 170, 800, logical.width - 285, 25, 2);
                }
                URL.revokeObjectURL(url);
                const link = document.createElement('a');

                link.click();
            } catch (error) {
