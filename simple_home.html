        }

        function drawRoundRect(context, x, y, width, height, radius, fill, stroke) {
            context.beginPath();
            context.moveTo(x + radius, y);
            context.lineTo(x + width - radius, y);
            context.quadraticCurveTo(x + width, y, x + width, y + radius);
            context.lineTo(x + width, y + height - radius);
            context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            context.lineTo(x + radius, y + height);
            context.quadraticCurveTo(x, y + height, x, y + height - radius);
            context.lineTo(x, y + radius);
            context.quadraticCurveTo(x, y, x + radius, y);
            context.closePath();
            if (fill) {
                context.fillStyle = fill;
                context.fill();
            }
            if (stroke) {
                context.strokeStyle = stroke;
                context.lineWidth = 1;
                context.stroke();
            }
        }

        function wrapCanvasText(context, text, x, y, maxWidth, lineHeight, maxLines = 4) {
            const chars = Array.from(String(text || ''));
            let line = '';
            let lineCount = 0;
            for (let i = 0; i < chars.length; i++) {
                const testLine = line + chars[i];
                if (context.measureText(testLine).width > maxWidth && line) {
                    lineCount += 1;
                    const isLast = lineCount >= maxLines;
                    context.fillText(isLast ? `${line.slice(0, Math.max(0, line.length - 1))}...` : line, x, y);
                    if (isLast) return;
                    y += lineHeight;
                    line = chars[i];
                } else {
                    line = testLine;
                }
            }
            if (line && lineCount < maxLines) context.fillText(line, x, y);
        }

        function renderReasoningNetwork(graph, host, activeIndex = -1, finished = false) {
            const svgNS = 'http://www.w3.org/2000/svg';
            const source = graph.graph || reasoningGraphCache();
            const net = reasoningVisibleNetwork(graph.seed, source);
            const activeNodes = new Set([graph.seed.id]);
            const activeEdges = new Set();
            const current = graph.steps[activeIndex] || null;
            const visibleSteps = graph.steps.slice(0, finished ? graph.steps.length : Math.max(0, activeIndex + 1));
            const state = reasoningVisualState(graph, visibleSteps);

            visibleSteps.forEach(step => {
                activeNodes.add(step.from.id);
                activeNodes.add(step.to.id);
                activeEdges.add(step.edge.id);
            });

            const svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('role', 'img');
            svg.setAttribute('aria-label', `${graph.seed.label}证据链动态图`);
            host.innerHTML = '';
            host.appendChild(svg);
            layoutReasoningNetwork(svg, net, graph.seed);

            const defs = document.createElementNS(svgNS, 'defs');
            defs.innerHTML = '<filter id="edgeGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#111827"></path></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb"></path></marker>';
            svg.appendChild(defs);
            drawReasoningLanes(svg);

            for (const edge of net.edges) {
                const from = source.byId.get(edge.source);
                const to = source.byId.get(edge.target);
                if (!from || !to) continue;
                const pathData = reasoningEdgePath(from, to, edge);
                const path = document.createElementNS(svgNS, 'path');
                const live = activeEdges.has(edge.id);
                const isCurrent = current?.edge.id === edge.id && !finished;
                const edgeStatus = reasoningEdgeStatus(edge, state);
                path.setAttribute('class', `edge${edgeStatus ? ` ${edgeStatus}` : ''}${activeEdges.size && !live ? ' dim' : ''}${live ? ' live' : ''}${isCurrent ? ' current' : ''}`);
                path.setAttribute('d', pathData);
                path.setAttribute('marker-end', isCurrent ? 'url(#arrowBlue)' : live ? 'url(#arrow)' : '');
                svg.appendChild(path);

                if (live) {
                    const mid = reasoningPointOnCurve(from, to, edge, 0.5);
                    const label = document.createElementNS(svgNS, 'text');
                    label.setAttribute('class', 'edgeLabel');
                    label.setAttribute('x', mid.x);
                    label.setAttribute('y', mid.y - 6);
                    label.setAttribute('text-anchor', 'middle');
                    label.textContent = reasoningRelationLabel[edge.type] || edge.type;
                    svg.appendChild(label);
                }

                if (isCurrent) {
                    const dot = document.createElementNS(svgNS, 'circle');
                    dot.setAttribute('class', 'flowDot');
                    dot.setAttribute('r', '5');
                    dot.setAttribute('fill', '#2563eb');
                    const anim = document.createElementNS(svgNS, 'animateMotion');
                    anim.setAttribute('dur', '.72s');
                    anim.setAttribute('repeatCount', '2');
                    anim.setAttribute('path', pathData);
                    dot.appendChild(anim);
                    svg.appendChild(dot);
                }
            }

            for (const node of net.nodes) {
                const group = document.createElementNS(svgNS, 'g');
                const live = activeNodes.has(node.id);
                const isCurrent = current?.node.id === node.id && !finished;
                const nodeStatus = reasoningNodeStatus(node, state);
                group.setAttribute('class', `node${nodeStatus ? ` ${nodeStatus}` : ''}${activeNodes.size && !live ? ' dim' : ''}${live ? ' live' : ''}${isCurrent ? ' current' : ''}`);
                group.setAttribute('transform', `translate(${node.x},${node.y})`);

                if (isCurrent) {
                    const halo = document.createElementNS(svgNS, 'circle');
                    halo.setAttribute('class', 'halo');
                    group.appendChild(halo);
                }

                const circle = document.createElementNS(svgNS, 'circle');
                circle.setAttribute('r', node.type === 'fault_case' ? '22' : node.type === 'causal_factor' ? '17' : '14');
                circle.setAttribute('fill', reasoningNodeColor(node.type));
                group.appendChild(circle);
                const badge = makeReasoningStatusBadge(svg, nodeStatus);
                if (badge) group.appendChild(badge);
                group.appendChild(makeReasoningNodeLabel(svg, node));
                svg.appendChild(group);
            }
        }

        function reasoningVisualState(graph, steps) {
            const supported = new Set();
            const excluded = new Set();
            const confirmed = new Set();
            const evidence = new Set((graph.runtimeEvidence || []).map(item => item.id));
            for (const step of steps) {
                if (step.edge.runtime && step.edge.type === 'CONFIRMS') {
                    supported.add(step.to.id);
                    if (step.to.type === 'causal_factor' && graph.assessment?.level === '较高可信' && (graph.assessment?.score || 0) >= 72) {
                        confirmed.add(step.to.id);
                    }
                }
                if (step.edge.runtime && step.edge.type === 'EXCLUDES') excluded.add(step.to.id);
                if (step.edge.runtime && step.to.runtime) evidence.add(step.to.id);
            }
            return { supported, excluded, confirmed, evidence };
        }

        function reasoningNodeStatus(node, state) {
            if (state.confirmed.has(node.id)) return 'confirmed';
            if (state.excluded.has(node.id)) return 'excluded';
            if (state.supported.has(node.id)) return 'supported';
            if (state.evidence.has(node.id) || node.runtime) return 'evidence';
            if (node.id.startsWith('principle:')) return 'principle';
            if (node.type === 'causal_factor') return 'candidate';
            return '';
        }

        function reasoningEdgeStatus(edge, state) {
            if (edge.type === 'PRINCIPLE') return 'principle';
            if (edge.runtime && edge.type === 'EXCLUDES') return 'excluded';
            if (edge.runtime && edge.type === 'CONFIRMS') return state.confirmed.has(edge.target) ? 'confirmed' : 'supported';
            return '';
        }

        function makeReasoningStatusBadge(svg, status) {
            const labels = {
                principle: '原理',
                evidence: '证据',
                supported: '支持',
                excluded: '排除',
                confirmed: '确认',
                candidate: '候选',
            };
            const label = labels[status];
            if (!label) return null;
            const svgNS = 'http://www.w3.org/2000/svg';
            const group = document.createElementNS(svgNS, 'g');
            group.setAttribute('transform', 'translate(10,-24)');
            const width = label.length * 10 + 10;
            const rect = document.createElementNS(svgNS, 'rect');
            rect.setAttribute('class', 'nodeStatusBadge');
            rect.setAttribute('x', -width / 2);
            rect.setAttribute('y', -8);
            rect.setAttribute('width', width);
            rect.setAttribute('height', 16);
            rect.setAttribute('rx', 5);
            const text = document.createElementNS(svgNS, 'text');
            text.setAttribute('class', 'nodeStatusText');
            text.setAttribute('x', 0);
            text.setAttribute('y', 4);
            text.setAttribute('text-anchor', 'middle');
            text.textContent = label;
            group.append(rect, text);
            return group;
        }

        function layoutReasoningNodes(nodes, seed) {
            const xByLane = {
                root_cause: 120,
                failure: 270,
                fault: 450,
                evidence: 610,
                action: 750,
                validation: 850,
            };
            const lanes = new Map();
            for (const node of nodes) {
                const lane = reasoningLaneFor(node, seed);
                if (!lanes.has(lane)) lanes.set(lane, []);
                lanes.get(lane).push(node);
            }

            const positions = new Map();
            for (const [lane, items] of lanes.entries()) {
                const x = xByLane[lane] || 610;
                const ordered = items.sort((a, b) => (a.id === seed.id ? -1 : b.id === seed.id ? 1 : a.label.localeCompare(b.label, 'zh-Hans-CN')));
                const gap = ordered.length <= 1 ? 0 : Math.min(72, 220 / (ordered.length - 1));
                const start = ordered.length <= 1 ? 170 : 170 - gap * (ordered.length - 1) / 2;
                ordered.forEach((node, index) => {
                    positions.set(node.id, {
                        x: x + (index % 2 === 0 ? 0 : 12),
                        y: node.id === seed.id ? 170 : start + gap * index,
                    });
                });
            }
            return positions;
        }

        function curvedPath(x1, y1, x2, y2) {
            const dx = Math.max(60, Math.abs(x2 - x1) * 0.42);
            return `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
        }

        function addSvgLabel(group, label, maxLines) {
            const svgNS = 'http://www.w3.org/2000/svg';
            const text = document.createElementNS(svgNS, 'text');
            const chars = [...label];
            const lines = [];
            while (chars.length && lines.length < maxLines) {
                lines.push(chars.splice(0, 7).join(''));
            }
            if (chars.length && lines.length) {
                lines[lines.length - 1] = lines[lines.length - 1].slice(0, 6) + '…';
            }
            const start = -((lines.length - 1) * 14) / 2 + 4;
            lines.forEach((line, index) => {
                const tspan = document.createElementNS(svgNS, 'tspan');
                tspan.setAttribute('x', '0');
                tspan.setAttribute('y', String(start + index * 14));
                tspan.textContent = line;
                text.appendChild(tspan);
            });
            group.appendChild(text);
        }

        function compactReasoningLabel(label) {
            return String(label || '').replace(/[（）()]/g, '').replace(/\s+/g, '');
        }

        function cssEscape(value) {
            if (window.CSS?.escape) return CSS.escape(value);
            return String(value).replace(/["\\]/g, '\\$&');
        }

        function reasoningVisibleNetwork(seed, graph) {
            const wanted = new Set([seed.id]);
            const visibility = {
                hasRuntimeEvidence: graph.nodes.some(item => item.runtime),
                confirmedNodeIds: confirmedRuntimeNodeIds(graph),
            };
            let frontier = [seed.id];
            for (let depth = 0; depth < 3; depth++) {
                const next = [];
                for (const id of frontier) {
                    const related = graph.edges
                        .filter(edge => edge.source === id || edge.target === id)
                        .filter(edge => reasoningEdgeVisibleBeforeEvidence(edge, graph.byId, visibility))
                        .sort((a, b) => reasoningEdgePriority(a.type) - reasoningEdgePriority(b.type))
                        .slice(0, depth === 0 ? 18 : 10);
                    for (const edge of related) {
                        if (!wanted.has(edge.source)) {
                            wanted.add(edge.source);
                            next.push(edge.source);
                        }
                        if (!wanted.has(edge.target)) {
                            wanted.add(edge.target);
                            next.push(edge.target);
                        }
                    }
                }
                frontier = next.slice(0, 28);
            }
            for (const node of graph.nodes.filter(item => item.runtime)) {
                wanted.add(node.id);
            }
            for (const edge of graph.edges.filter(item => {
                const source = graph.byId.get(item.source);
                const target = graph.byId.get(item.target);
                return source?.runtime || target?.runtime;
            })) {
                wanted.add(edge.source);
                wanted.add(edge.target);
            }
            return {
                nodes: graph.nodes.filter(node => wanted.has(node.id)),
                edges: graph.edges.filter(edge => wanted.has(edge.source) && wanted.has(edge.target)),
            };
        }

        function layoutReasoningNetwork(svg, net, seed) {
            const rect = svg.getBoundingClientRect();
            const width = Math.max(rect.width, 760);
            const height = Math.max(rect.height, 430);
            svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
            const lanes = reasoningLaneConfig(width);
            const buckets = { root_cause: [], failure: [], fault: [], evidence: [], action: [], validation: [] };
            for (const node of net.nodes) {
                (buckets[reasoningLaneFor(node, seed)] || buckets.evidence).push(node);
            }
            for (const [lane, items] of Object.entries(buckets)) {
                const sorted = items.sort((a, b) => reasoningNodePriority(a) - reasoningNodePriority(b) || a.label.localeCompare(b.label, 'zh-Hans-CN'));
                const x = lanes[lane].x;
                const gap = Math.max(42, Math.min(68, (height - 140) / Math.max(1, sorted.length)));
                const start = height / 2 - gap * (sorted.length - 1) / 2;
                sorted.forEach((node, index) => {
                    node.x = x;
                    node.y = Math.max(70, Math.min(height - 44, start + index * gap));
                });
            }
        }

        function reasoningLaneConfig(width) {
            return {
                root_cause: { x: width * 0.10, label: '根因' },
                failure: { x: width * 0.27, label: '中间失效' },
                fault: { x: width * 0.45, label: '故障' },
                evidence: { x: width * 0.62, label: '证据/表现' },
                action: { x: width * 0.79, label: '处理' },
                validation: { x: width * 0.93, label: '验证/预防' },
            };
        }

        function drawReasoningLanes(svg) {
            const svgNS = 'http://www.w3.org/2000/svg';
            const view = svg.getAttribute('viewBox').split(' ').map(Number);
            const width = view[2];
            const height = view[3];
            const lanes = reasoningLaneConfig(width);
            const keys = ['root_cause', 'failure', 'fault', 'evidence', 'action', 'validation'];
            for (let i = 0; i < keys.length; i++) {
                const lane = lanes[keys[i]];
                const prev = i === 0 ? 16 : (lanes[keys[i - 1]].x + lane.x) / 2;
                const next = i === keys.length - 1 ? width - 16 : (lane.x + lanes[keys[i + 1]].x) / 2;
                const band = document.createElementNS(svgNS, 'rect');
                band.setAttribute('class', 'laneBand');
                band.setAttribute('x', prev + 6);
                band.setAttribute('y', 52);
                band.setAttribute('width', Math.max(28, next - prev - 12));
                band.setAttribute('height', height - 76);
                band.setAttribute('rx', 10);
                svg.appendChild(band);

                const pill = document.createElementNS(svgNS, 'rect');
                pill.setAttribute('class', 'lanePill');
                pill.setAttribute('x', lane.x - 43);
                pill.setAttribute('y', 18);
                pill.setAttribute('width', 86);
                pill.setAttribute('height', 26);
                pill.setAttribute('rx', 6);
                svg.appendChild(pill);

                const label = document.createElementNS(svgNS, 'text');
                label.setAttribute('class', 'laneLabel');
                label.setAttribute('x', lane.x);
                label.setAttribute('y', 35);
                label.setAttribute('text-anchor', 'middle');
                label.textContent = lane.label;
                svg.appendChild(label);

                if (i < keys.length - 1) {
                    const nextLane = lanes[keys[i + 1]];
                    const line = document.createElementNS(svgNS, 'line');
                    line.setAttribute('class', 'laneLine');
                    line.setAttribute('x1', (lane.x + nextLane.x) / 2);
                    line.setAttribute('x2', (lane.x + nextLane.x) / 2);
                    line.setAttribute('y1', 58);
                    line.setAttribute('y2', height - 24);
                    svg.appendChild(line);
                }
            }
        }

        function reasoningEdgePath(from, to, edge) {
            const sign = Math.sign(to.x - from.x || 1);
            const dx = Math.max(44, Math.abs(to.x - from.x) * 0.46);
            const offset = ((reasoningHash(edge.id) % 5) - 2) * 8;
            return `M ${from.x} ${from.y} C ${from.x + sign * dx} ${from.y + offset}, ${to.x - sign * dx} ${to.y - offset}, ${to.x} ${to.y}`;
        }

        function reasoningPointOnCurve(from, to, edge, progress) {
            const sign = Math.sign(to.x - from.x || 1);
            const dx = Math.max(44, Math.abs(to.x - from.x) * 0.46);
            const offset = ((reasoningHash(edge.id) % 5) - 2) * 8;
            const c1 = { x: from.x + sign * dx, y: from.y + offset };
            const c2 = { x: to.x - sign * dx, y: to.y - offset };
            const a = (1 - progress) ** 3;
            const b = 3 * (1 - progress) ** 2 * progress;
            const c = 3 * (1 - progress) * progress * progress;
            const d = progress ** 3;
            return {
                x: a * from.x + b * c1.x + c * c2.x + d * to.x,
                y: a * from.y + b * c1.y + c * c2.y + d * to.y,
            };
        }

        function makeReasoningNodeLabel(svg, node) {
            const svgNS = 'http://www.w3.org/2000/svg';
            const viewWidth = Number(svg.getAttribute('viewBox').split(' ')[2]);
            const rightSide = node.x > viewWidth * 0.86;
            const lines = reasoningLabelLines(node.label, rightSide ? 7 : 8);
            const width = Math.max(...lines.map(line => Array.from(line).length)) * 12 + 16;
            const height = lines.length * 15 + 9;
            const group = document.createElementNS(svgNS, 'g');
            group.setAttribute('class', 'nodeLabel');
            group.setAttribute('transform', `translate(${rightSide ? -width - 24 : 24},${-height / 2})`);

            const rect = document.createElementNS(svgNS, 'rect');
            rect.setAttribute('rx', 5);
            rect.setAttribute('width', width);
            rect.setAttribute('height', height);

            const text = document.createElementNS(svgNS, 'text');
            text.setAttribute('x', 8);
            text.setAttribute('y', lines.length === 1 ? height / 2 + 4 : 14);
            lines.forEach((line, index) => {
                const tspan = document.createElementNS(svgNS, 'tspan');
                tspan.setAttribute('x', 8);
                if (index > 0) tspan.setAttribute('dy', 15);
                tspan.textContent = line;
                text.appendChild(tspan);
            });
            group.append(rect, text);
            return group;
        }

        function reasoningLabelLines(label, max) {
            const chars = Array.from(label);
            if (chars.length <= max) return [label];
            return [
                chars.slice(0, max).join(''),
                chars.slice(max, max * 2 - 1).join('') + (chars.length > max * 2 - 1 ? '...' : ''),
            ];
        }

        function reasoningNodePriority(node) {
            return ({
                management_factor: 1,
                causal_factor: 2,
                excluded_cause: 3,
                component: 4,
                intermediate_failure: 5,
                fault_case: 6,
                diagnostic_step: 7,
                diagnostic_signal: 8,
                evidence: 9,
                symptom: 10,
                temporary_action: 11,
                action: 12,
                prevention: 13,
                validation: 14,
                risk: 15,
            }[node.type] ?? 30);
        }

        function reasoningNodeColor(type) {
            return ({
                fault_case: '#cf3f4a',
                component: '#2f6fed',
                causal_factor: '#c05621',
                intermediate_failure: '#f97316',
                management_factor: '#a16207',
                excluded_cause: '#94a3b8',
                symptom: '#dc2626',
                diagnostic_signal: '#057a85',
                action: '#27864f',
                diagnostic_step: '#7657c8',
                temporary_action: '#b7791f',
                prevention: '#0f766e',
                evidence: '#64748b',
                validation: '#16a34a',
                risk: '#be123c',
            }[type] || '#64748b');
        }

        function reasoningHash(value) {
            let hash = 0;
            for (let i = 0; i < value.length; i++) {
                hash = (hash * 31 + value.charCodeAt(i)) | 0;
            }
            return Math.abs(hash);
        }

        function buildReasoningSummaryPrompt(userQuestion, graph) {
            const steps = graph.steps.slice(0, 18).map((step, index) => ({
                order: index + 1,
                stage: step.stage,
                from: step.from.label,
                relation: reasoningRelationLabel[step.edge.type] || step.edge.type,
                to: step.to.label,
                evidence: step.edge.evidence || '',
            }));
            const assessment = graph.assessment || {};

            return [
                '你是风电运维故障诊断专家。上方卡片已经展示思考过程，下面请只输出给现场人员看的最终指令。',
                '不要写成报告；不要出现“推理”“图谱”“证据链”“结构化结果”“右侧/下方卡片”等界面词；不要暴露 JSON。',

        function buildGraphFallbackAnswer(userQuestion, graph) {
            if (!graph?.steps?.length) {
                return '本地模型暂时不可用，当前问题也没有匹配到可用的排查路径。请换用故障码、部件名称或故障现象重新提问。';
            }
            const steps = graph.steps;
            const conclusion = reasoningFinalConclusion(graph, steps);
            const action = reasoningFinalAction(graph, steps);
            const validation = reasoningFinalValidation(graph, steps);
            const assessment = graph.assessment || {};
            const diagnostic = uniqueLabels(steps
                .filter(step => step.edge.type === 'HAS_DIAGNOSTIC_STEP')
                .map(step => step.to.label))
                .slice(0, 1);
            const nextStep = diagnostic[0] || action || '按告警对象确认现场实测值与HMI/PLC反馈是否一致';
            const feedback = validation || '把该动作的实测结果反馈回来';
            const isConfirmed = Number.isFinite(assessment.score) && assessment.score >= 72;

            return [
                `结论：${isConfirmed ? conclusion : `先按“${graph.seed.label}”方向排查，暂不定最终根因。`}`,
                '',
                `下一步只做一件事：${nextStep}。`,
                '',
                `请反馈：${feedback}。`,
            ].join('\n');
        }

        function uniqueLabels(items) {
            return [...new Set(items.filter(Boolean))];
        }

        function renderMarkdown(text) {
            // 先转义 HTML 再交给 marked：markdown 语法(#/**/`)照常渲染，
            // 但 LLM/知识库文本里的原始 HTML 标签被转义为纯文本，杜绝 XSS。
            if (window.marked?.parse) return marked.parse(escapeHtml(text));
            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        function renderAssistantAnswer(text) {
            const parts = splitThinkingAnswer(text);
            const thinking = parts.thinking
                ? `<div class="thinking-card"><div class="thinking-card-title"><span class="material-symbols-outlined">psychology</span>思考过程</div>${renderMarkdown(parts.thinking)}</div>`
                : '';
            return `${thinking}<div class="final-answer-card">${renderStructuredAnswer(parts.answer || text || '')}</div>`;
        }

        function renderStructuredAnswer(text) {
            const normalized = normalizeAnswerText(text);
            if (!normalized) return '';
            const sections = splitAnswerSections(normalized);
            if (sections.length >= 2) {
                return sections.map(section => `
                    <section class="answer-section">
                        <div class="answer-section-title">${escapeHtml(section.title)}</div>
                        <div class="answer-section-body">${renderAnswerBody(section.body)}</div>
                    </section>
                `).join('');
            }
            return renderMarkdown(normalized);
        }

        function normalizeAnswerText(text) {
            return String(text || '')
                .replace(/\r\n/g, '\n')
                .replace(/([。！？；])(?=(?:判断|结论|原因|可能原因|排查|检查|验证|处理|建议|下一步|只做这一步|做完反馈|反馈|依据|来源|风险|注意)[:：])/g, '$1\n')
                .replace(/([。！？；])(?=\s*(?:\d+[\.\)、]|[（(]\d+[）)]|[-*]\s))/g, '$1\n')
                .replace(/(判断|结论|原因分析|可能原因|排查步骤|现场验证|处理建议|下一步|只做这一步|做完反馈|依据来源|来源|注意事项|风险提示)[:：]/g, '\n$1：')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
        }

        function splitAnswerSections(text) {
            const lines = String(text || '').split(/\n+/).map(line => line.trim()).filter(Boolean);
            const sections = [];
            let current = null;
            const headingPattern = /^(判断|结论|原因分析|可能原因|排查步骤|现场验证|处理建议|下一步|只做这一步|做完反馈|依据来源|来源|注意事项|风险提示)[:：]\s*(.*)$/;
            for (const line of lines) {
                const match = line.match(headingPattern);
                if (match) {
                    if (current) sections.push(current);
                    current = { title: normalizeAnswerHeading(match[1]), body: match[2] || '' };
                    continue;
                }
                if (!current) current = { title: '答复', body: '' };
                current.body = [current.body, line].filter(Boolean).join('\n');
            }
            if (current) sections.push(current);
            return sections.filter(section => section.body || section.title !== '答复');
        }

        function normalizeAnswerHeading(title) {
            return ({
                结论: '判断',
                可能原因: '原因分析',
                原因: '原因分析',
                排查: '排查步骤',
                检查: '排查步骤',
                验证: '现场验证',
                处理: '处理建议',
                建议: '处理建议',
                下一步: '只做这一步',
                反馈: '做完反馈',
                来源: '依据来源',
            }[title] || title);
        }

        function renderAnswerBody(text) {
            const lines = String(text || '').split(/\n+/).map(line => line.trim()).filter(Boolean);
            if (!lines.length) return '';
            const listItems = lines.map(line => line.replace(/^[-*]\s*/, '').replace(/^\d+[\.\)、]\s*/, '').trim());
            if (lines.length > 1 || lines.some(line => /^([-*]\s*|\d+[\.\)、]\s*)/.test(line))) {
                return `<ol class="answer-list">${listItems.map(item => `<li>${renderInlineAnswerText(item)}</li>`).join('')}</ol>`;
            }
            return `<p>${renderInlineAnswerText(lines[0])}</p>`;
        }

        function renderInlineAnswerText(text) {
            return escapeHtml(text)
                .replace(/(合格标准|反馈|依据|来源|风险|注意)[:：]/g, '<b>$1：</b>')
                .replace(/(先|再|最后|不要|必须|重点)[:：]/g, '<b>$1：</b>');
        }

        function renderLlmWikiInsight(reasoning) {
            if (!reasoning || !reasoning.case || !Array.isArray(reasoning.steps) || !reasoning.steps.length) return '';
            const steps = reasoning.steps.slice(0, 6).map(step => {
                const source = step.source?.label || '';
                const target = step.target?.label || '';
                const relation = step.relation || '';
                return `
                    <li>
                        <span class="llmwiki-stage">${escapeHtml(step.stage || '推理')}</span>
                        ${escapeHtml(source)} <b>${escapeHtml(relation)}</b> ${escapeHtml(target)}
                    </li>
                `;
            }).join('');
            const next = (reasoning.next_questions || []).slice(0, 4).map(question => {
                return `<button type="button" onclick="sendFollowUpQuestion('${escapeJsString(question)}')">${escapeHtml(question)}</button>`;
            }).join('');
            const action = reasoning.field_action?.next_step
                ? `<div class="llmwiki-summary"><b>下一步：</b>${escapeHtml(reasoning.field_action.next_step)}；<b>反馈：</b>${escapeHtml(reasoning.field_action.feedback || '')}</div>`
                : '';
            const taxonomy = [reasoning.system_domain?.label, reasoning.subsystem?.label].filter(Boolean).join(' / ');
            const taxonomyLine = taxonomy
                ? `<div class="llmwiki-summary"><b>定位：</b>${escapeHtml(taxonomy)}${reasoning.inherited_context ? '（继承上一轮）' : ''}</div>`
                : '';
            const alternatives = (reasoning.alternatives || []).slice(0, 3).map(item => {
                const scope = [item.system_domain?.label, item.subsystem?.label].filter(Boolean).join(' / ');
                return [item.case?.label, scope ? `(${scope})` : ''].filter(Boolean).join(' ');
            }).filter(Boolean);
            const alternativeLine = alternatives.length
                ? `<div class="llmwiki-summary"><b>备选：</b>${escapeHtml(alternatives.join('；'))}</div>`
                : '';
            return `
                <div class="llmwiki-insight">
                    <div class="llmwiki-insight-head">
                        <div class="llmwiki-insight-title">LLMWiki 证据路径 · ${escapeHtml(reasoning.case.label)} · ${escapeHtml(reasoning.intent_label || reasoning.intent || '诊断')}</div>
                        <div class="llmwiki-confidence">${escapeHtml(reasoning.confidence_label || '待验证')} ${Number.isFinite(reasoning.confidence) ? `${reasoning.confidence}/100` : ''}</div>
                    </div>
                    ${taxonomyLine}
                    ${alternativeLine}
                    <div class="llmwiki-summary">${escapeHtml(reasoning.summary || '')}</div>
                    <ul class="llmwiki-path">${steps}</ul>
                    ${action}
                    ${next ? `<div class="llmwiki-next">${next}</div>` : ''}
                </div>
            `;
        }

        function sendFollowUpQuestion(question) {
            const text = String(question || '').trim();
            if (!text) return;
            chatInput.value = text;
            resetChatInputHistoryNavigation();
            sendMessage();
        }

        function escapeJsString(text) {
            return String(text || '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\n/g, '\\n')
                .replace(/\r/g, '');
        }

        function renderThinkingStatus(text) {
            return `<div class="thinking-card"><div class="thinking-card-title"><span class="material-symbols-outlined">psychology</span>思考过程</div><span class="thinking-hint">${escapeHtml(text)}</span></div>`;
        }

        function splitThinkingAnswer(text) {
            const raw = String(text || '').trim();
            if (!raw) return { thinking: '', answer: '' };
            const thinkMatch = raw.match(/<think>([\s\S]*?)<\/think>/i);
            if (thinkMatch) {
                return {
                    thinking: thinkMatch[1].trim(),
                    answer: raw.replace(thinkMatch[0], '').trim(),
                };
            }
            const markerMatch = raw.match(/(?:^|\n)(思考过程|分析过程|推理过程)[:：]\s*([\s\S]*?)(?:\n(?:最终答案|答案|结论|最可能判断)[:：]|$)/);
            if (markerMatch) {
                const beforeAnswer = raw.slice(markerMatch.index + markerMatch[0].length);
                const answerStart = raw.match(/\n(?:最终答案|答案|结论|最可能判断)[:：]/);
                return {
                    thinking: markerMatch[2].trim(),
                    answer: answerStart ? raw.slice(answerStart.index + 1).trim() : beforeAnswer.trim(),
                };
            }
            return { thinking: '', answer: raw };
        }

        function intentToLabel(intent) {
            return ({
                cause: '原因链',
                diagnosis: '排查路径',
                evidence: '证据支持',
                action: '处理验证',
                prevention: '预防复发',
            }[intent] || '诊断');
        }

        function addMessage(content, sender) {
            chatMessages.classList.add('has-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = sender === 'user'
                ? '<span class="material-symbols-outlined">person</span>'
                : '<span class="material-symbols-outlined">smart_toy</span>';

            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.innerHTML = sender === 'user' ? escapeHtml(content) : content;

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(messageContent);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('click', (event) => {
            if (!reasoningQuestionMenu.contains(event.target) && event.target !== questionPickerButton) {
                closeReasoningQuestionMenu();
            }
        });

        chatInput.addEventListener('focus', () => {
            if (reasoningQuestionMenu.classList.contains('open')) {
                renderReasoningQuestionMenu();
            }
        });

        chatInput.addEventListener('input', () => {
            if (reasoningData) return;
            if (reasoningQuestionMenu.classList.contains('open')) {
                renderReasoningQuestionMenu();
            }
        });

        chatContainer.addEventListener('wheel', (event) => {
            if (!chatMessages || event.ctrlKey) return;
            if (reasoningQuestionMenu.contains(event.target)) return;
            const target = event.target instanceof Element ? event.target : null;
            if (!target) return;
            if (
                target.closest('textarea') ||
                target.closest('.chat-header') ||
                target.closest('.chat-input-area') ||
                target.closest('.reasoning-panel')
            ) {
                const delta = Math.abs(event.deltaY) > Math.abs(event.deltaX) ? event.deltaY : event.deltaX;
                if (!delta) return;
                event.preventDefault();
                chatMessages.scrollTop += delta;
            }
        }, { passive: false, capture: true });
    </script>
</body>
</html>
