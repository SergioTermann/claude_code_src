  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    .workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 0;transition:grid-template-columns .28s ease;border-top:1px solid transparent}.reasoning-open .workspace{grid-template-columns:minmax(0,1fr) minmax(520px,46%)}
    .chatPane{min-width:0;min-height:0;display:grid;grid-template-rows:1fr auto;background:#fff}.messages{overflow:auto;padding:28px 56px;display:flex;flex-direction:column;gap:20px;background:#fff}.welcome{margin:auto;text-align:center;color:#414141}.welcomeTitle{font-size:26px;font-weight:700;margin-bottom:10px}.welcomeText{font-size:14px;color:#6b7280}
    .msg{display:flex;gap:15px;max-width:80%;min-width:0}.msg.user{align-self:flex-end;flex-direction:row-reverse}.msg.assistant{align-self:flex-start}.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}.assistant .avatar{background:#3b82f6;color:#fff}.user .avatar{background:#e5e7eb;color:#6b7280}.message-content{max-width:100%;min-width:0;padding:16px 20px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;color:#374151;line-height:1.6;white-space:pre-wrap;overflow-wrap:break-word}.user .message-content{border:none;background:#3b82f6;color:#fff}.assistant.typing .message-content{border-color:#3b82f6;box-shadow:0 5px 16px rgba(59,130,246,.12)}
    .composer{position:relative;display:flex;gap:8px;padding:16px 30px 22px;background:#fff}.composer input{flex:1;height:44px;border:1px solid #e5e7eb;border-radius:8px;padding:0 14px;font-size:14px}.composer input:focus{outline:none;border-color:#458BFA;box-shadow:0 0 0 3px rgba(69,139,250,.12)}.composer button{height:44px;border:1px solid #3b82f6;background:#3b82f6;color:#fff;border-radius:8px;padding:0 16px;cursor:pointer;font-weight:600}.composer .presetBtn{background:#fff;color:#458BFA;border-color:#dbeafe}.questionMenu{position:absolute;left:30px;right:108px;bottom:72px;display:none;grid-template-columns:1fr;gap:6px;padding:8px;border:1px solid #e5e7eb;border-radius:10px;background:rgba(255,255,255,.98);box-shadow:0 18px 40px rgba(31,41,55,.16);z-index:5}.questionMenu.open{display:grid}.questionMenu button{text-align:left;height:auto;background:#fff;color:#1f2937;border-color:#e5e7eb;padding:9px 10px;line-height:1.35;box-shadow:none}.questionMenu button:hover,.questionMenu button.active{border-color:#458BFA;background:#eff6ff;color:#1d4ed8}.questionMenu small{display:block;color:#6b7280;margin-top:3px;font-size:11px}
    .reasonPane{min-width:0;min-height:0;display:grid;grid-template-rows:1fr 240px;border-left:1px solid #e5e7eb;background-color:#f8fafc;background-image:linear-gradient(rgba(99,116,139,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(99,116,139,.08) 1px,transparent 1px),linear-gradient(135deg,rgba(37,99,235,.06),rgba(15,118,110,.05) 42%,rgba(192,86,33,.04));background-size:28px 28px,28px 28px,100% 100%;opacity:0;pointer-events:none;transform:translateX(14px);transition:opacity .24s ease,transform .24s ease}.reasoning-open .reasonPane{opacity:1;pointer-events:auto;transform:translateX(0)}
    .graphWrap{min-height:0;position:relative}svg{width:100%;height:100%;display:block}.status{position:absolute;left:14px;top:12px;right:14px;border:1px solid #d8dee8;background:rgba(255,255,255,.92);border-radius:6px;padding:8px 10px;color:#475467;font-size:12px;box-shadow:0 4px 12px rgba(32,41,56,.05)}
    .trace{overflow:auto;background:rgba(255,255,255,.95);border-top:1px solid #d8dee8;padding:10px 12px}.traceTitle{font-size:12px;font-weight:700;color:#344054;margin-bottom:7px}.step{position:relative;border:1px solid #d8dee8;border-radius:6px;background:#fff;padding:7px 8px 7px 24px;margin:7px 0;font-size:12px}.step:before{content:"";position:absolute;left:9px;top:12px;width:7px;height:7px;border-radius:50%;background:#98a2b3;box-shadow:0 0 0 3px #eef2f6}.step.active{border-color:#2563eb;background:#eff6ff}.step.active:before{background:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.14)}.tag{display:inline-block;font-size:10px;padding:3px 6px;border-radius:999px;background:#eff6ff;color:#1d4ed8;border:1px solid #cfe0ff;margin-right:5px}
    .laneBand{fill:rgba(255,255,255,.48);stroke:rgba(148,163,184,.22);stroke-width:1}.lanePill{fill:rgba(255,255,255,.86);stroke:#d8dee8;stroke-width:1}.laneLabel{font-size:12px;fill:#475467;font-weight:700}.laneLine{stroke:#cfd8e4;stroke-width:1;stroke-dasharray:4 8}.edge{fill:none;stroke:#aeb8c6;stroke-opacity:.28;stroke-width:1.25}.edge.dim{stroke-opacity:.09}.edge.live{stroke:#344054;stroke-opacity:.9;stroke-width:2.5}.edge.current{stroke:#2563eb;stroke-width:3.2;stroke-opacity:1;filter:url(#edgeGlow)}.edgeLabel{font-size:10px;fill:#475467;paint-order:stroke;stroke:#fff;stroke-width:3px}.flowDot{filter:drop-shadow(0 0 7px rgba(37,99,235,.82))}
    .node circle{stroke:#fff;stroke-width:2px;filter:drop-shadow(0 3px 5px rgba(32,41,56,.22))}.node.dim{opacity:.25}.node.live circle{stroke:#202938;stroke-width:3.5px}.node.current circle{stroke:#2563eb;stroke-width:5px;filter:drop-shadow(0 0 11px rgba(37,99,235,.45))}.nodeLabel rect{fill:rgba(255,255,255,.95);stroke:#d8dee8;stroke-width:1;filter:drop-shadow(0 3px 8px rgba(32,41,56,.08))}.nodeLabel text{font-size:11px;fill:#202938;paint-order:stroke;stroke:#fff;stroke-width:3px}.halo{fill:none;stroke:#2563eb;stroke-width:2;opacity:.28;animation:halo 1.2s ease-out infinite}@keyframes halo{0%{r:18;opacity:.36}100%{r:38;opacity:0}}
    @media(max-width:1100px){main{grid-template-columns:1fr;grid-template-rows:minmax(520px,1fr)620px}.chatPane{border-right:0;border-bottom:1px solid #d8dee8}}
  </style>
</head>
<body>
<div id="app" class="container">
  <aside class="sidebar">
    <div class="logo">
      <div class="logoMark">风</div>
      <h1>风起时域</h1>
    </div>
    <div class="nav-section">
      <div class="nav-title">故障案例</div>
      <div id="caseBar" class="caseBar"></div>
    </div>
  </aside>
  <section class="chat-area">
    <div class="chat-header">
      <h2>智能问答</h2>
      <p>像正常对话一样提问；命中故障推理后，右侧会自动展开证据链。</p>
    </div>
    <main class="workspace">
      <section class="chatPane">
        <div id="messages" class="messages"></div>
        <div class="composer">
          <div id="questionMenu" class="questionMenu"></div>
          <button id="presetToggle" class="presetBtn">问题</button>
          <input id="question" placeholder="输入风电部件故障问题，或点击左侧“问题”选择预设问题">
          <button id="ask">发送</button>
        </div>
      </section>
      <section class="reasonPane">
        <div class="graphWrap">
          <svg id="graph"></svg>
          <div id="status" class="status">提问后自动展开推理链。</div>
        </div>
        <div class="trace">
          <div class="traceTitle">同步推理步骤</div>
          <div id="steps"></div>
        </div>
      </section>
    </main>
  </section>
</div>
<script>
const colors={fault_case:"#cf3f4a",component:"#2f6fed",causal_factor:"#c05621",intermediate_failure:"#f97316",management_factor:"#a16207",excluded_cause:"#94a3b8",symptom:"#dc2626",diagnostic_signal:"#057a85",action:"#27864f",diagnostic_step:"#7657c8",temporary_action:"#b7791f",prevention:"#0f766e",evidence:"#64748b",validation:"#16a34a",risk:"#be123c"};
const relationLabel={CAN_TRIGGER:"触发",LEADS_TO:"导致",HAS_DIAGNOSTIC_STEP:"排查",RESULTS_IN:"形成",CONFIRMS:"确认",DIAGNOSED_BY:"证据",SUPPORTED_BY:"佐证",TEMPORARILY_MITIGATED_BY:"临时缓解",MITIGATED_BY:"处理",VERIFIED_BY:"验证",PREVENTED_BY:"预防",PREVENTS:"防止",EXCLUDES:"排除",MANIFESTS_AS:"表现为",CAN_ESCALATE_TO:"升级为",DIAGNOSES_EARLY:"早期诊断"};
const presets=[
  {intent:"cause",name:"原因链推理",hint:"从根因到故障",template:"{case}是什么原因导致？根因链是什么？"},
  {intent:"diagnosis",name:"排查路径推理",hint:"先查什么、如何定位",template:"{case}如何排查定位？排查步骤是什么？"},
  {intent:"evidence",name:"证据支持推理",hint:"哪些现象和数据能证明",template:"{case}有哪些证据支持？证据链是什么？"},
  {intent:"action",name:"处理验证推理",hint:"怎么处理、如何确认有效",template:"{case}怎么处理并验证效果？"},
  {intent:"prevention",name:"预防复发推理",hint:"怎么防止再次发生",template:"{case}如何预防复发？"}
];
const app=document.getElementById("app"),svg=document.getElementById("graph"),caseBar=document.getElementById("caseBar"),questionMenu=document.getElementById("questionMenu"),presetToggle=document.getElementById("presetToggle"),messages=document.getElementById("messages"),question=document.getElementById("question"),stepsHost=document.getElementById("steps"),statusBox=document.getElementById("status");
let nodes=[],edges=[],by=new Map(),activeNodes=new Set(),activeEdges=new Set(),chain=[],currentNodeId=null,currentEdgeId=null,currentSeed=null,currentIntent="cause",playTimer=null,typeTimer=null;
fetch("curated-parts-graph.json").then(r=>r.json()).then(data=>{nodes=data.nodes.map(n=>({...n}));edges=data.edges.map((e,i)=>({...e,id:`edge:${i}`}));by=new Map(nodes.map(n=>[n.id,n]));currentSeed=by.get("case:yaw_hydraulic_pressure")||nodes.find(n=>n.type==="fault_case");renderCases();renderQuestionMenu();showWelcome()});
function renderCases(){caseBar.innerHTML=nodes.filter(n=>n.type==="fault_case").map(n=>`<button class="${n.id===currentSeed?.id?"active":""}" data-id="${esc(n.id)}">${esc(shortCase(n.label))}</button>`).join("");for(const b of caseBar.querySelectorAll("button"))b.onclick=()=>{currentSeed=by.get(b.dataset.id);setQuestion(currentIntent);renderCases();renderQuestionMenu();resetReasoning()}}
function renderQuestionMenu(){questionMenu.innerHTML=presets.map((p,i)=>`<button class="${p.intent===currentIntent?"active":""}" data-intent="${p.intent}"><b>${i+1}. ${esc(questionText(p))}</b><small>${esc(p.name)} · ${esc(p.hint)}</small></button>`).join("");for(const b of questionMenu.querySelectorAll("button"))b.onclick=()=>{currentIntent=b.dataset.intent;setQuestion(currentIntent);closeQuestionMenu();submitQuestion()}}
function questionText(p){return p.template.replace("{case}",currentSeed.label)}
function setQuestion(intent){const p=presets.find(x=>x.intent===intent)||presets[0];question.value=questionText(p)}
function openQuestionMenu(){renderQuestionMenu();questionMenu.classList.add("open")}
function closeQuestionMenu(){questionMenu.classList.remove("open")}
function toggleQuestionMenu(){questionMenu.classList.toggle("open");if(questionMenu.classList.contains("open"))renderQuestionMenu()}
function shortCase(label){return label.replace("故障","").slice(0,13)}
function submitQuestion(){const q=question.value.trim();if(!q)return;if(playTimer)clearInterval(playTimer);if(typeTimer)clearInterval(typeTimer);closeQuestionMenu();messages.querySelector(".welcome")?.remove();const seed=findSeed(q);currentSeed=seed;currentIntent=detectIntent(q);renderCases();renderQuestionMenu();appendUser(q);activeNodes=new Set([seed.id]);activeEdges=new Set();currentNodeId=seed.id;currentEdgeId=null;chain=buildChain(seed,currentIntent);app.classList.add("reasoning-open");renderSteps(-1);requestAnimationFrame(()=>drawFull(seed));statusBox.textContent=`开始回答 · ${seed.label} · ${intentLabel(currentIntent)}`;const answer=buildAnswer(seed,currentIntent,chain);const bubble=appendAssistant("",true);streamAnswer(bubble,answer);setTimeout(()=>playChain(seed),120)}
function showWelcome(){messages.innerHTML='<div class="welcome"><div class="welcomeTitle">今天想分析哪个故障？</div><div class="welcomeText">直接输入问题，或点击输入框左侧“问题”选择预设问题。推理链会在提问后自动展开。</div></div>'}
function makeMessage(role,text,typing=false){const el=document.createElement("div");el.className=`msg ${role}`+(typing?" typing":"");const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="user"?"你":"风";const content=document.createElement("div");content.className="message-content";content.textContent=text;el.append(avatar,content);messages.append(el);messages.scrollTop=messages.scrollHeight;return content}
function appendUser(text){return makeMessage("user",text,false)}
function appendAssistant(text,typing){return makeMessage("assistant",text,typing)}
function streamAnswer(el,text){let i=0;typeTimer=setInterval(()=>{i+=2;el.textContent=text.slice(0,i);messages.scrollTop=messages.scrollHeight;if(i>=text.length){clearInterval(typeTimer);typeTimer=null;el.parentElement.classList.remove("typing")}},28)}
function playChain(seed){let index=0;const tick=()=>{if(index>=chain.length){statusBox.textContent=`推理完成 · ${intentLabel(currentIntent)} · 共 ${chain.length} 步`;currentEdgeId=null;drawFull(seed);clearInterval(playTimer);playTimer=null;return}const step=chain[index];activeNodes.add(step.from.id);activeNodes.add(step.to.id);activeEdges.add(step.edge.id);currentNodeId=step.node.id;currentEdgeId=step.edge.id;statusBox.textContent=`推理中 ${index+1}/${chain.length} · ${step.stage} · 当前节点：${step.node.label}`;renderSteps(index);drawFull(seed);index++};tick();playTimer=setInterval(tick,760)}
function renderSteps(active=-1){stepsHost.innerHTML=chain.map((s,i)=>`<div class="step ${i===active?"active":""}"><span class="tag">${esc(s.stage)}</span><b>${i+1}. ${esc(relationLabel[s.edge.type]||s.edge.type)}</b><br>${esc(s.from.label)} → ${esc(s.to.label)}</div>`).join("");const activeEl=stepsHost.querySelector(".active");if(activeEl)activeEl.scrollIntoView({block:"nearest"})}
function resetReasoning(){activeNodes=new Set();activeEdges=new Set();chain=[];currentNodeId=null;currentEdgeId=null;stepsHost.innerHTML="";app.classList.remove("reasoning-open");statusBox.textContent="提问后自动展开推理链。"}
function buildAnswer(seed,intent,items){const lines=items.slice(0,10).map((s,i)=>`${i+1}. ${s.from.label} --${relationLabel[s.edge.type]||s.edge.type}→ ${s.to.label}`);const map={cause:`结论：${seed.label}的核心推理是从根因和中间失效逐步推到故障表现。\n\n推理过程：\n${lines.join("\n")}\n\n因此，判断重点不是只看故障名称，而是看根因是否能连续解释中间失效、故障表现和现场证据。`,diagnosis:`结论：${seed.label}应按“先排查、再确认、再回扣根因”的顺序定位。\n\n排查路径：\n${lines.join("\n")}\n\n这条路径的意义是先排除常见可疑项，再用证据确认真正故障点。`,evidence:`结论：支持${seed.label}判断的证据主要来自现场现象、测量数据、诊断结果和处理后的佐证。\n\n证据链：\n${lines.join("\n")}\n\n如果这些证据能够互相印证，故障判断就比较稳。`,action:`结论：${seed.label}的处理需要同时包含处置动作和效果验证。\n\n处理与验证：\n${lines.join("\n")}\n\n只有处理后指标恢复、告警消除或试验通过，才能认为处置闭环完成。`,prevention:`结论：${seed.label}的预防重点是针对根因建立维护、图纸、巡检或监测闭环。\n\n预防链：\n${lines.join("\n")}\n\n预防不是简单复位，而是把导致故障的条件提前控制住。`};return map[intent]||map.cause}
function findSeed(q){const text=q.toLowerCase();const aliases=[["偏航","case:yaw_hydraulic_pressure"],["液压","case:yaw_hydraulic_pressure"],["igbt","case:converter_igbt"],["变流","case:converter_igbt"],["主轴","case:main_shaft_bearing_wear"],["轴承","case:main_shaft_bearing_wear"],["绕组","case:generator_winding_temp_jump"],["温度","case:generator_winding_temp_jump"]];for(const [key,id] of aliases)if(text.includes(key))return by.get(id);return currentSeed||nodes.find(n=>n.type==="fault_case")}
function detectIntent(q){if(/预防|复发|防止|避免/.test(q))return"prevention";if(/处理|修复|更换|解决|验证|效果/.test(q))return"action";if(/排查|定位|检查|诊断|怎么查|如何查/.test(q))return"diagnosis";if(/原因|导致|根因|为什么|因果/.test(q))return"cause";if(/证据|支持|数据|现象|表现|报警|温度|压力/.test(q))return"evidence";return currentIntent}
function intentLabel(intent){return(presets.find(p=>p.intent===intent)||presets[0]).name}
function network(seed){const wanted=new Set([seed.id]);let frontier=[seed.id];for(let depth=0;depth<3;depth++){const next=[];for(const id of frontier){const rel=edges.filter(e=>e.source===id||e.target===id).sort((a,b)=>edgePriority(a.type)-edgePriority(b.type)).slice(0,depth===0?18:10);for(const e of rel){if(!wanted.has(e.source)){wanted.add(e.source);next.push(e.source)}if(!wanted.has(e.target)){wanted.add(e.target);next.push(e.target)}}}frontier=next.slice(0,28)}const ns=nodes.filter(n=>wanted.has(n.id));const es=edges.filter(e=>wanted.has(e.source)&&wanted.has(e.target));return{nodes:ns,edges:es}}
function buildChain(seed,intent){const net=network(seed),ids=new Set(net.nodes.map(n=>n.id)),pool=edges.filter(e=>ids.has(e.source)&&ids.has(e.target));const result=[],seen=new Set(),causePath=causalPathEdges(seed,pool);const touches=e=>result.some(s=>s.from.id===e.source||s.from.id===e.target||s.to.id===e.source||s.to.id===e.target);const add=(stage,list,limit)=>{for(const e of list.slice(0,limit)){if(seen.has(e.id))continue;seen.add(e.id);const from=by.get(e.source),to=by.get(e.target),node=stepNode(e,seed);result.push({stage:stageName(stage,e,seed),edge:e,from,to,node})}};const fromSeed=types=>pool.filter(e=>e.source===seed.id&&types.includes(e.type)).sort(edgeStageCompare(seed));const typed=types=>pool.filter(e=>types.includes(e.type)).sort(edgeStageCompare(seed));if(intent==="cause"){add("根因链",causePath,14);add("故障表现",fromSeed(["MANIFESTS_AS","CAN_ESCALATE_TO"]),5);add("关键证据",fromSeed(["DIAGNOSED_BY","SUPPORTED_BY"]),4)}else if(intent==="diagnosis"){const checks=fromSeed(["HAS_DIAGNOSTIC_STEP"]);add(checks.length?"排查入口":"定位证据",checks.length?checks:fromSeed(["DIAGNOSED_BY","SUPPORTED_BY","MANIFESTS_AS"]),10);add("检查结果",typed(["RESULTS_IN","EXCLUDES","CONFIRMS","DIAGNOSES_EARLY"]).filter(e=>touches(e)||by.get(e.source)?.type==="diagnostic_step"),12);add("根因回扣",causePath,10)}else if(intent==="evidence"){add("故障现象",fromSeed(["MANIFESTS_AS","CAN_ESCALATE_TO"]),6);add("诊断证据",fromSeed(["DIAGNOSED_BY","SUPPORTED_BY"]),10);add("证据解释",typed(["CONFIRMS","RESULTS_IN"]).filter(e=>touches(e)||by.get(e.source)?.type==="diagnostic_step"),8);add("因果解释",causePath,8)}else if(intent==="action"){add("处置方案",fromSeed(["TEMPORARILY_MITIGATED_BY","MITIGATED_BY"]),10);add("效果验证",typed(["VERIFIED_BY"]).filter(e=>touches(e)||by.get(e.source)?.type==="action"||by.get(e.source)?.type==="temporary_action"),10);add("验证佐证",fromSeed(["SUPPORTED_BY"]),5);add("处置依据",fromSeed(["DIAGNOSED_BY","MANIFESTS_AS"]),6)}else if(intent==="prevention"){add("预防策略",fromSeed(["PREVENTED_BY"]),10);add("反向控制",typed(["PREVENTS"]).filter(e=>touches(e)||["prevention","action","temporary_action"].includes(by.get(e.source)?.type)),10);add("根因控制",causePath,12);add("风险闭环",fromSeed(["CAN_ESCALATE_TO","SUPPORTED_BY"]),4)}if(!result.length)add("关联推理",pool.sort(edgeStageCompare(seed)),16);return result.slice(0,40)}
