<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>风电部件故障证据链网络</title>
  <style>
    body{margin:0;background:#eef2f6;color:#202938;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    .app{height:100vh;display:grid;grid-template-rows:auto 1fr}
    header{background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #d8dee8;padding:14px 18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;box-shadow:0 8px 22px rgba(32,41,56,.05)}
    h1{font-size:20px;margin:0}.meta{font-size:12px;color:#667085;margin-top:4px}
    .ask{display:flex;gap:8px;align-items:center}.ask input{width:450px;height:36px;border:1px solid #cfd8e4;border-radius:6px;padding:0 10px;background:#fff;box-shadow:inset 0 1px 2px rgba(32,41,56,.04)}.ask button,.ask select{height:36px;border:1px solid #1d4ed8;background:#2563eb;color:#fff;border-radius:6px;padding:0 12px;cursor:pointer;box-shadow:0 6px 14px rgba(37,99,235,.18)}.ask button:hover{background:#1d4ed8}.ask select{background:#fff;color:#202938;border-color:#d8dee8;box-shadow:none}
    main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr)410px}
    .stage{position:relative;min-width:0;min-height:0;background-color:#f8fafc;background-image:linear-gradient(rgba(99,116,139,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(99,116,139,.08) 1px,transparent 1px),linear-gradient(135deg,rgba(37,99,235,.06),rgba(15,118,110,.05) 42%,rgba(192,86,33,.04));background-size:28px 28px,28px 28px,100% 100%}svg{width:100%;height:100%;display:block}
    aside{background:rgba(255,255,255,.95);border-left:1px solid #d8dee8;padding:14px;overflow:auto;box-shadow:-8px 0 20px rgba(32,41,56,.04)}
    .status{border:1px solid #d8dee8;background:linear-gradient(135deg,#fff,#f7fafc);border-radius:6px;padding:9px 10px;color:#475467;font-size:12px;line-height:1.45;margin-bottom:10px;box-shadow:0 4px 12px rgba(32,41,56,.04)}.progress{height:7px;border-radius:999px;background:#e5eaf2;overflow:hidden;margin:8px 0 12px}.bar{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#0f766e);transition:width .32s ease}
    .caseChips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.caseChips button,.questionChips button{border:1px solid #d8dee8;background:#fff;color:#344054;border-radius:6px;padding:6px 8px;font-size:12px;cursor:pointer;box-shadow:0 1px 2px rgba(32,41,56,.04)}.caseChips button.active,.questionChips button.active{border-color:#2563eb;background:#eff6ff;color:#1d4ed8;box-shadow:0 4px 10px rgba(37,99,235,.12)}
    .questionChips{display:grid;grid-template-columns:1fr;gap:6px;margin:0 0 12px}.questionChips button{text-align:left;line-height:1.35;padding:8px 9px}.questionChips .qNo{display:inline-block;min-width:18px;color:#1d4ed8;font-weight:700}.questionChips .qText{font-size:12px;color:#202938}.questionChips small{display:block;color:#667085;margin-top:3px;font-size:11px;padding-left:22px}
    .sectionTitle{display:block;margin:10px 0 6px;font-size:12px;color:#344054;letter-spacing:0;font-weight:700}.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;padding:8px;border:1px solid #e5eaf2;border-radius:6px;background:#f8fafc}.legend div{font-size:12px;color:#475467}.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
    .step{position:relative;border:1px solid #d8dee8;border-radius:6px;background:#fff;padding:8px 8px 8px 24px;margin:8px 0;cursor:pointer;transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}.step:before{content:"";position:absolute;left:9px;top:13px;width:7px;height:7px;border-radius:50%;background:#98a2b3;box-shadow:0 0 0 3px #eef2f6}.step.active{border-color:#2563eb;background:#eff6ff;transform:translateX(2px);box-shadow:0 5px 14px rgba(37,99,235,.12)}.step.active:before{background:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.14)}.stepHead{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.stepTag{display:inline-block;font-size:10px;line-height:1;padding:4px 6px;border-radius:999px;background:#eff6ff;color:#1d4ed8;border:1px solid #cfe0ff}.step.active .stepTag{background:#dbeafe}.step b{display:inline;font-size:13px}.step span{display:block;font-size:12px;color:#667085;margin-top:3px;line-height:1.35}
    .laneBand{fill:rgba(255,255,255,.48);stroke:rgba(148,163,184,.22);stroke-width:1}.lanePill{fill:rgba(255,255,255,.82);stroke:#d8dee8;stroke-width:1}.laneLabel{font-size:12px;fill:#475467;font-weight:700;letter-spacing:0}.laneLine{stroke:#cfd8e4;stroke-width:1;stroke-dasharray:4 8}.edge{fill:none;stroke:#aeb8c6;stroke-opacity:.34;stroke-width:1.35;transition:stroke .2s ease,stroke-width .2s ease,stroke-opacity .2s ease}.edge.dim{stroke-opacity:.12}.edge.live{stroke:#344054;stroke-opacity:.92;stroke-width:2.8}.edge.current{stroke:#2563eb;stroke-width:3.4;stroke-opacity:1;filter:url(#edgeGlow)}.edgeLabel{font-size:10px;fill:#475467;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}.flowDot{filter:drop-shadow(0 0 7px rgba(37,99,235,.82))}
    .node circle{stroke:#fff;stroke-width:2px;filter:drop-shadow(0 3px 5px rgba(32,41,56,.22));transition:stroke .2s ease,stroke-width .2s ease,r .2s ease,opacity .2s ease}.node text{font-size:12px;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.nodeLabel rect{fill:rgba(255,255,255,.94);stroke:#d8dee8;stroke-width:1;filter:drop-shadow(0 3px 8px rgba(32,41,56,.08))}.nodeLabel text{font-size:11px;fill:#202938;stroke:#fff;stroke-width:3px}.node.dim{opacity:.28}.node.live circle{stroke:#202938;stroke-width:3.5px}.node.current circle{stroke:#2563eb;stroke-width:5px;filter:drop-shadow(0 0 11px rgba(37,99,235,.45))}.node.pulse circle{animation:pulse .8s ease}.halo{fill:none;stroke:#2563eb;stroke-width:2;opacity:.28;animation:halo 1.2s ease-out infinite}@keyframes halo{0%{r:18;opacity:.36}100%{r:38;opacity:0}}@keyframes pulse{0%{filter:drop-shadow(0 0 0 rgba(37,99,235,.0))}50%{filter:drop-shadow(0 0 15px rgba(37,99,235,.62))}100%{filter:drop-shadow(0 3px 5px rgba(32,41,56,.22))}}
    @media(max-width:980px){header{grid-template-columns:1fr}.ask{display:grid}.ask input{width:100%}main{grid-template-columns:1fr;grid-template-rows:minmax(460px,1fr)390px}aside{border-left:0;border-top:1px solid #d8dee8}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>风电部件故障证据链网络</h1>
      <div class="meta">以网络形状展示：故障中心、原因链、排查步骤、诊断证据、处理和预防措施</div>
    </div>
    <div class="ask">
      <input id="question" value="偏航液压系统压力异常是什么原因导致，证据链是什么？">
      <select id="speed">
        <option value="1100">慢速</option>
        <option value="760" selected>标准</option>
        <option value="430">快速</option>
      </select>
      <button id="run">播放证据链</button>
    </div>
  </header>
  <main>
    <div class="stage"><svg id="graph"></svg></div>
    <aside>
      <div id="status" class="status">点击“播放证据链”，网络会按证据链逐条点亮。</div>
      <div class="progress"><div id="bar" class="bar"></div></div>
      <div id="caseChips" class="caseChips"></div>
      <span class="sectionTitle">点击问题开始推理</span>
      <div id="questionChips" class="questionChips"></div>
      <span class="sectionTitle">图谱类型</span>
      <div class="legend" id="legend"></div>
      <span class="sectionTitle">证据链步骤</span>
      <div id="steps"></div>
    </aside>
  </main>
</div>
<script>
const colors={fault_case:"#cf3f4a",component:"#2f6fed",causal_factor:"#c05621",intermediate_failure:"#f97316",management_factor:"#a16207",excluded_cause:"#94a3b8",symptom:"#dc2626",diagnostic_signal:"#057a85",action:"#27864f",diagnostic_step:"#7657c8",temporary_action:"#b7791f",prevention:"#0f766e",evidence:"#64748b",validation:"#16a34a",risk:"#be123c"};
const typeLabel={fault_case:"故障",component:"部件",causal_factor:"原因",intermediate_failure:"中间失效",management_factor:"管理因素",excluded_cause:"排除项",symptom:"表现",diagnostic_signal:"诊断信号",action:"处理",diagnostic_step:"排查步骤",temporary_action:"临时措施",prevention:"预防",evidence:"证据",validation:"验证",risk:"风险"};
const relationLabel={CAN_TRIGGER:"触发",LEADS_TO:"导致",HAS_DIAGNOSTIC_STEP:"排查",RESULTS_IN:"形成",CONFIRMS:"确认",DIAGNOSED_BY:"证据",SUPPORTED_BY:"佐证",TEMPORARILY_MITIGATED_BY:"临时缓解",MITIGATED_BY:"处理",VERIFIED_BY:"验证",PREVENTED_BY:"预防",PREVENTS:"防止",EXCLUDES:"排除",MANIFESTS_AS:"表现为",CAN_ESCALATE_TO:"升级为",DIAGNOSES_EARLY:"早期诊断"};
const questionPresets=[
  {intent:"cause",no:"1",name:"原因链推理",hint:"从根因到故障",template:"{case}是什么原因导致？根因链是什么？"},
  {intent:"diagnosis",no:"2",name:"排查路径推理",hint:"先查什么、如何定位",template:"{case}如何排查定位？排查步骤是什么？"},
  {intent:"evidence",no:"3",name:"证据支持推理",hint:"哪些现象和数据能证明",template:"{case}有哪些证据支持？证据链是什么？"},
  {intent:"action",no:"4",name:"处理验证推理",hint:"怎么处理、如何确认有效",template:"{case}怎么处理并验证效果？"},
  {intent:"prevention",no:"5",name:"预防复发推理",hint:"怎么防止再次发生",template:"{case}如何预防复发？"}
];
const svg=document.getElementById("graph"),question=document.getElementById("question"),statusBox=document.getElementById("status"),stepsHost=document.getElementById("steps"),legend=document.getElementById("legend"),bar=document.getElementById("bar"),speed=document.getElementById("speed"),caseChips=document.getElementById("caseChips"),questionChips=document.getElementById("questionChips");
let graph,nodes,edges,by,activeNodes=new Set(),activeEdges=new Set(),chain=[],timer=null,currentNodeId=null,currentEdgeId=null,currentSeed=null,currentIntent="cause";
fetch("curated-parts-graph.json").then(r=>r.json()).then(data=>{graph=data;nodes=data.nodes.map(n=>({...n}));edges=data.edges.map((e,i)=>({...e,id:`edge:${i}`}));by=new Map(nodes.map(n=>[n.id,n]));currentIntent=detectIntent(question.value);renderLegend();renderCaseChips();renderQuestionChips();drawFull();});
function renderLegend(){legend.innerHTML=Object.entries(typeLabel).map(([type,label])=>`<div><span class="sw" style="background:${colors[type]||"#64748b"}"></span>${label}</div>`).join("")}
function renderCaseChips(){const selected=currentSeed?.id||findSeed(question.value.trim())?.id;caseChips.innerHTML=nodes.filter(n=>n.type==="fault_case").map(n=>`<button class="${n.id===selected?"active":""}" data-id="${esc(n.id)}">${esc(shortCase(n.label))}</button>`).join("");for(const btn of caseChips.querySelectorAll("button"))btn.onclick=()=>selectCase(btn.dataset.id)}
function renderQuestionChips(){const seed=currentSeed||findSeed(question.value.trim());questionChips.innerHTML=questionPresets.map(p=>`<button class="${p.intent===currentIntent?"active":""}" data-intent="${p.intent}"><span class="qNo">${esc(p.no)}.</span><span class="qText">${esc(questionText(p,seed))}</span><small>${esc(p.name)} · ${esc(p.hint)}</small></button>`).join("");for(const btn of questionChips.querySelectorAll("button"))btn.onclick=()=>askPreset(btn.dataset.intent)}
function questionText(p,seed){return p.template.replace("{case}",seed.label)}
function shortCase(label){return label.replace("故障","").replace("异常","异常").slice(0,12)}
function selectCase(id){const seed=by.get(id);if(!seed)return;if(timer)clearInterval(timer);timer=null;currentSeed=seed;setQuestionForIntent(seed,currentIntent);activeNodes=new Set([seed.id]);activeEdges=new Set();chain=buildChain(seed,currentIntent);currentNodeId=seed.id;currentEdgeId=null;bar.style.width="0%";statusBox.textContent=`已选择：${seed.label} · 可点击五个问题进行专项推理`;renderCaseChips();renderQuestionChips();renderSteps();drawFull(seed)}
function askPreset(intent){const seed=currentSeed||findSeed(question.value.trim());currentIntent=intent;setQuestionForIntent(seed,intent);renderQuestionChips();run()}
function setQuestionForIntent(seed,intent){const preset=questionPresets.find(p=>p.intent===intent)||questionPresets[0];question.value=preset.template.replace("{case}",seed.label)}
function detectIntent(q){const text=q.toLowerCase();if(/预防|复发|防止|避免/.test(text))return"prevention";if(/处理|修复|更换|解决|验证|效果/.test(text))return"action";if(/排查|定位|检查|诊断|怎么查|如何查/.test(text))return"diagnosis";if(/原因|导致|根因|为什么|因果/.test(text))return"cause";if(/证据|支持|数据|现象|表现|报警|温度|压力/.test(text))return"evidence";return currentIntent||"cause"}
function findSeed(q){const text=q.toLowerCase();const aliases=[["偏航","case:yaw_hydraulic_pressure"],["液压","case:yaw_hydraulic_pressure"],["igbt","case:converter_igbt"],["变流","case:converter_igbt"],["主轴","case:main_shaft_bearing_wear"],["轴承","case:main_shaft_bearing_wear"],["绕组","case:generator_winding_temp_jump"],["温度","case:generator_winding_temp_jump"]];for(const [key,id] of aliases)if(text.includes(key))return by.get(id);return nodes.find(n=>n.type==="fault_case")}
function network(seed){const wanted=new Set([seed.id]);let frontier=[seed.id];for(let depth=0;depth<3;depth++){const next=[];for(const id of frontier){const rel=edges.filter(e=>e.source===id||e.target===id).sort((a,b)=>edgePriority(a.type)-edgePriority(b.type)).slice(0,depth===0?18:10);for(const e of rel){if(!wanted.has(e.source)){wanted.add(e.source);next.push(e.source)}if(!wanted.has(e.target)){wanted.add(e.target);next.push(e.target)}}}frontier=next.slice(0,28)}const ns=nodes.filter(n=>wanted.has(n.id));const es=edges.filter(e=>wanted.has(e.source)&&wanted.has(e.target));return{nodes:ns,edges:es}}
function layout(net,seed){const rect=svg.getBoundingClientRect(),w=Math.max(rect.width,980),h=Math.max(rect.height,620);svg.setAttribute("viewBox",`0 0 ${w} ${h}`);const lanes=laneConfig(w),buckets={root_cause:[],failure:[],fault:[],evidence:[],action:[],validation:[]};for(const n of net.nodes){const lane=laneFor(n,seed);(buckets[lane]??=buckets.evidence).push(n)}for(const [lane,items] of Object.entries(buckets)){const sorted=items.sort((a,b)=>nodePriority(a)-nodePriority(b)||a.label.localeCompare(b.label,"zh-Hans-CN"));const x=lanes[lane]?.x??w/2;const usable=h-150,gap=Math.max(44,Math.min(76,usable/Math.max(1,sorted.length)));const start=h/2-gap*(sorted.length-1)/2;sorted.forEach((n,i)=>{n.x=x;n.y=Math.max(72,Math.min(h-54,start+i*gap))})}}
function laneConfig(w){return{root_cause:{x:w*.10,label:"根因"},failure:{x:w*.27,label:"中间失效"},fault:{x:w*.45,label:"故障"},evidence:{x:w*.62,label:"证据/表现"},action:{x:w*.79,label:"处理"},validation:{x:w*.93,label:"验证/预防"}}}
function laneFor(n,seed){if(n.id===seed.id)return"fault";if(["causal_factor","management_factor","excluded_cause"].includes(n.type))return"root_cause";if(["intermediate_failure","component"].includes(n.type))return"failure";if(["fault_case","risk"].includes(n.type))return"fault";if(["diagnostic_signal","diagnostic_step","symptom","evidence"].includes(n.type))return"evidence";if(["action","temporary_action"].includes(n.type))return"action";if(["prevention","validation"].includes(n.type))return"validation";return"evidence"}
function nodePriority(n){return({management_factor:1,causal_factor:2,excluded_cause:3,component:4,intermediate_failure:5,fault_case:6,diagnostic_step:7,diagnostic_signal:8,evidence:9,symptom:10,temporary_action:11,action:12,prevention:13,validation:14,risk:15}[n.type]??30)}
function drawLanes(){const view=svg.getAttribute("viewBox").split(" ").map(Number),w=view[2],h=view[3],lanes=laneConfig(w),keys=["root_cause","failure","fault","evidence","action","validation"];for(let i=0;i<keys.length;i++){const key=keys[i],lane=lanes[key],prev=i===0?20:(lanes[keys[i-1]].x+lane.x)/2,next=i===keys.length-1?w-20:(lane.x+lanes[keys[i+1]].x)/2;const band=document.createElementNS("http://www.w3.org/2000/svg","rect");band.setAttribute("class","laneBand");band.setAttribute("x",prev+8);band.setAttribute("y",52);band.setAttribute("width",Math.max(30,next-prev-16));band.setAttribute("height",h-84);band.setAttribute("rx","10");svg.append(band);const pill=document.createElementNS("http://www.w3.org/2000/svg","rect");pill.setAttribute("class","lanePill");pill.setAttribute("x",lane.x-43);pill.setAttribute("y",18);pill.setAttribute("width","86");pill.setAttribute("height","26");pill.setAttribute("rx","6");svg.append(pill);const text=document.createElementNS("http://www.w3.org/2000/svg","text");text.setAttribute("class","laneLabel");text.setAttribute("x",lane.x);text.setAttribute("y",35);text.setAttribute("text-anchor","middle");text.textContent=lane.label;svg.append(text);if(i<keys.length-1){const nextLane=lanes[keys[i+1]],line=document.createElementNS("http://www.w3.org/2000/svg","line");line.setAttribute("class","laneLine");line.setAttribute("x1",(lane.x+nextLane.x)/2);line.setAttribute("x2",(lane.x+nextLane.x)/2);line.setAttribute("y1",58);line.setAttribute("y2",h-32);svg.append(line)}}}
function drawFull(seed=nodes.find(n=>n.type==="fault_case")){currentSeed=seed;const net=network(seed);layout(net,seed);renderCaseChips();svg.replaceChildren();const defs=document.createElementNS("http://www.w3.org/2000/svg","defs");defs.innerHTML='<filter id="edgeGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="blur"></feGaussianBlur><feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter><marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#111827"></path></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="4.8" markerHeight="4.8" orient="auto-start-reverse"><path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563eb"></path></marker>';svg.append(defs);drawLanes();for(const e of net.edges){const s=by.get(e.source),t=by.get(e.target);const d=edgePath(s,t,e);const path=document.createElementNS("http://www.w3.org/2000/svg","path");const live=activeEdges.has(e.id),current=e.id===currentEdgeId;path.setAttribute("class","edge"+(activeEdges.size&&!live?" dim":"")+(live?" live":"")+(current?" current":""));path.setAttribute("data-edge",e.id);path.setAttribute("d",d);path.setAttribute("marker-end",current?"url(#arrowBlue)":live?"url(#arrow)":"");svg.append(path);if(live){const mid=pointOnCurve(s,t,e,.5);const label=document.createElementNS("http://www.w3.org/2000/svg","text");label.setAttribute("class","edgeLabel");label.setAttribute("x",mid.x);label.setAttribute("y",mid.y-6);label.setAttribute("text-anchor","middle");label.textContent=relationLabel[e.type]||e.type;svg.append(label)}if(current){const dot=document.createElementNS("http://www.w3.org/2000/svg","circle");dot.setAttribute("class","flowDot");dot.setAttribute("r","5");dot.setAttribute("fill","#2563eb");const anim=document.createElementNS("http://www.w3.org/2000/svg","animateMotion");anim.setAttribute("dur",".72s");anim.setAttribute("repeatCount","2");anim.setAttribute("path",d);dot.append(anim);svg.append(dot)}}for(const n of net.nodes){const g=document.createElementNS("http://www.w3.org/2000/svg","g");g.setAttribute("class","node"+(activeNodes.size&&!activeNodes.has(n.id)?" dim":"")+(activeNodes.has(n.id)?" live pulse":"")+(n.id===currentNodeId?" current":""));g.setAttribute("transform",`translate(${n.x},${n.y})`);g.onclick=()=>focusNode(n.id);if(n.id===currentNodeId){const halo=document.createElementNS("http://www.w3.org/2000/svg","circle");halo.setAttribute("class","halo");g.append(halo)}const c=document.createElementNS("http://www.w3.org/2000/svg","circle");c.setAttribute("r",n.type==="fault_case"?24:n.type==="causal_factor"?18:15);c.setAttribute("fill",colors[n.type]||"#64748b");g.append(c,makeNodeLabel(n));svg.append(g)}}
function edgePath(s,t,e){const sign=Math.sign(t.x-s.x||1),dx=Math.max(48,Math.abs(t.x-s.x)*.46),offset=((hash(e.id)%5)-2)*8;return`M ${s.x} ${s.y} C ${s.x+sign*dx} ${s.y+offset}, ${t.x-sign*dx} ${t.y-offset}, ${t.x} ${t.y}`}
function pointOnCurve(s,t,e,p){const sign=Math.sign(t.x-s.x||1),dx=Math.max(48,Math.abs(t.x-s.x)*.46),offset=((hash(e.id)%5)-2)*8;const c1={x:s.x+sign*dx,y:s.y+offset},c2={x:t.x-sign*dx,y:t.y-offset};const a=(1-p)**3,b=3*(1-p)**2*p,c=3*(1-p)*p*p,d=p**3;return{x:a*s.x+b*c1.x+c*c2.x+d*t.x,y:a*s.y+b*c1.y+c*c2.y+d*t.y}}
function makeNodeLabel(n){const viewW=Number(svg.getAttribute("viewBox").split(" ")[2]),rightSide=n.x>viewW*.86,chars=rightSide?7:8,lines=labelLines(n.label,chars),width=Math.max(...lines.map(s=>Array.from(s).length))*12+16,height=lines.length*15+9,x=rightSide?-width-26:26,y=-height/2;const group=document.createElementNS("http://www.w3.org/2000/svg","g");group.setAttribute("class","nodeLabel");group.setAttribute("transform",`translate(${x},${y})`);const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");rect.setAttribute("rx","5");rect.setAttribute("width",width);rect.setAttribute("height",height);const text=document.createElementNS("http://www.w3.org/2000/svg","text");text.setAttribute("x","8");text.setAttribute("y",lines.length===1?height/2+4:14);for(let i=0;i<lines.length;i++){const tspan=document.createElementNS("http://www.w3.org/2000/svg","tspan");tspan.setAttribute("x","8");if(i>0)tspan.setAttribute("dy","15");tspan.textContent=lines[i];text.append(tspan)}group.append(rect,text);return group}
function labelLines(label,maxChars){const chars=Array.from(label);if(chars.length<=maxChars)return[label];const first=chars.slice(0,maxChars).join(""),rest=chars.slice(maxChars,maxChars*2-1).join("");return[first,rest+(chars.length>maxChars*2-1?"...":"")]}
function hash(value){let h=0;for(let i=0;i<value.length;i++)h=(h*31+value.charCodeAt(i))|0;return Math.abs(h)}
function buildChain(seed,intent="cause"){const net=network(seed),ids=new Set(net.nodes.map(n=>n.id)),pool=edges.filter(e=>ids.has(e.source)&&ids.has(e.target));const result=[],seen=new Set(),causePath=causalPathEdges(seed,pool);const touches=e=>result.some(s=>s.from.id===e.source||s.from.id===e.target||s.to.id===e.source||s.to.id===e.target);const add=(stage,list,limit)=>{for(const e of list.slice(0,limit)){if(seen.has(e.id))continue;seen.add(e.id);const from=by.get(e.source),to=by.get(e.target),node=stepNode(e,seed);result.push({stage:stageName(stage,e,seed),edge:e,from,to,node})}};const fromSeed=types=>pool.filter(e=>e.source===seed.id&&types.includes(e.type)).sort(edgeStageCompare(seed));const typed=types=>pool.filter(e=>types.includes(e.type)).sort(edgeStageCompare(seed));if(intent==="cause"){add("根因链",causePath,14);add("故障表现",fromSeed(["MANIFESTS_AS","CAN_ESCALATE_TO"]),5);add("关键证据",fromSeed(["DIAGNOSED_BY","SUPPORTED_BY"]),4)}else if(intent==="diagnosis"){const checks=fromSeed(["HAS_DIAGNOSTIC_STEP"]);add(checks.length?"排查入口":"定位证据",checks.length?checks:fromSeed(["DIAGNOSED_BY","SUPPORTED_BY","MANIFESTS_AS"]),10);add("检查结果",typed(["RESULTS_IN","EXCLUDES","CONFIRMS","DIAGNOSES_EARLY"]).filter(e=>touches(e)||by.get(e.source)?.type==="diagnostic_step"),12);add("根因回扣",causePath,10)}else if(intent==="evidence"){add("故障现象",fromSeed(["MANIFESTS_AS","CAN_ESCALATE_TO"]),6);add("诊断证据",fromSeed(["DIAGNOSED_BY","SUPPORTED_BY"]),10);add("证据解释",typed(["CONFIRMS","RESULTS_IN"]).filter(e=>touches(e)||by.get(e.source)?.type==="diagnostic_step"),8);add("因果解释",causePath,8)}else if(intent==="action"){add("处置方案",fromSeed(["TEMPORARILY_MITIGATED_BY","MITIGATED_BY"]),10);add("效果验证",typed(["VERIFIED_BY"]).filter(e=>touches(e)||by.get(e.source)?.type==="action"||by.get(e.source)?.type==="temporary_action"),10);add("验证佐证",fromSeed(["SUPPORTED_BY"]),5);add("处置依据",fromSeed(["DIAGNOSED_BY","MANIFESTS_AS"]),6)}else if(intent==="prevention"){add("预防策略",fromSeed(["PREVENTED_BY"]),10);add("反向控制",typed(["PREVENTS"]).filter(e=>touches(e)||["prevention","action","temporary_action"].includes(by.get(e.source)?.type)),10);add("根因控制",causePath,12);add("风险闭环",fromSeed(["CAN_ESCALATE_TO","SUPPORTED_BY"]),4)}if(!result.length)add("关联推理",pool.sort(edgeStageCompare(seed)),16);return result.slice(0,40)}
function causalPathEdges(seed,pool){const causal=new Set(["LEADS_TO","CAN_TRIGGER"]),incoming=new Map(),paths=[];for(const e of pool.filter(e=>causal.has(e.type))){if(!incoming.has(e.target))incoming.set(e.target,[]);incoming.get(e.target).push(e)}const walk=(id,path,visited)=>{const rel=(incoming.get(id)||[]).filter(e=>!visited.has(e.source)).sort(edgeFlowCompare(seed)).slice(0,8);if(!rel.length){if(path.length)paths.push([...path]);return}for(const e of rel)walk(e.source,[e,...path],new Set([...visited,e.source]))};walk(seed.id,[],new Set([seed.id]));paths.sort((a,b)=>b.length-a.length||edgePriority(a[0]?.type)-edgePriority(b[0]?.type));const rootsWithLong=new Set(paths.filter(p=>p.length>1).map(p=>p[0].source)),picked=[];for(const path of paths){if(path.length===1&&rootsWithLong.has(path[0].source))continue;for(const e of path)if(!picked.includes(e))picked.push(e);if(picked.length>=18)break}return picked}
function stepNode(e,seed){return by.get(e.target===seed.id?e.source:e.target)||by.get(e.source)}
function stageName(stage,e,seed){if(stage==="根因链"&&e.target===seed.id)return"根因链 · 收敛故障";if(stage==="检查结果"&&e.type==="EXCLUDES")return"检查结果 · 排除";if(stage==="检查结果"&&e.type==="CONFIRMS")return"检查结果 · 确认";if(stage==="效果验证"&&e.type==="VERIFIED_BY")return"效果验证 · 闭环";if(stage==="反向控制"&&e.type==="PREVENTS")return"反向控制 · 阻断根因";return stage}
function edgeFlowCompare(seed){return(a,b)=>{const as=laneRank(by.get(a.source),seed),at=laneRank(by.get(a.target),seed),bs=laneRank(by.get(b.source),seed),bt=laneRank(by.get(b.target),seed);const af=Math.max(as,at),bf=Math.max(bs,bt);return af-bf||Math.min(as,at)-Math.min(bs,bt)||edgePriority(a.type)-edgePriority(b.type)||by.get(a.source).label.localeCompare(by.get(b.source).label,"zh-Hans-CN")}}
function edgeStageCompare(seed){return(a,b)=>{const as=laneRank(by.get(a.source),seed),at=laneRank(by.get(a.target),seed),bs=laneRank(by.get(b.source),seed),bt=laneRank(by.get(b.target),seed);return edgePriority(a.type)-edgePriority(b.type)||Math.max(as,at)-Math.max(bs,bt)||Math.min(as,at)-Math.min(bs,bt)||by.get(a.source).label.localeCompare(by.get(b.source).label,"zh-Hans-CN")}}
function laneRank(n,seed){return({root_cause:0,failure:1,fault:2,evidence:3,action:4,validation:5}[laneFor(n,seed)]??3)}
function edgePriority(type){return({CAN_TRIGGER:1,LEADS_TO:2,HAS_DIAGNOSTIC_STEP:3,RESULTS_IN:4,CONFIRMS:5,DIAGNOSED_BY:6,SUPPORTED_BY:7,TEMPORARILY_MITIGATED_BY:8,MITIGATED_BY:9,VERIFIED_BY:10,PREVENTED_BY:11,PREVENTS:12,EXCLUDES:13,MANIFESTS_AS:14,CAN_ESCALATE_TO:15,DIAGNOSES_EARLY:16}[type]??30)}
function run(){if(timer)clearInterval(timer);const seed=findSeed(question.value.trim());currentIntent=detectIntent(question.value.trim());activeNodes=new Set([seed.id]);activeEdges=new Set();currentNodeId=seed.id;currentEdgeId=null;chain=buildChain(seed,currentIntent);renderQuestionChips();renderSteps();let index=0;bar.style.width="0%";statusBox.textContent=`开始播放 · 命中：${seed.label} · 问题：${intentLabel(currentIntent)}`;drawFull(seed);const tick=()=>{if(index>=chain.length){statusBox.textContent=`播放完成 · ${intentLabel(currentIntent)} · 证据链节点 ${activeNodes.size} · 边 ${activeEdges.size}`;bar.style.width="100%";currentEdgeId=null;drawFull(seed);clearInterval(timer);timer=null;return}const step=chain[index];activeNodes.add(step.from.id);activeNodes.add(step.to.id);activeEdges.add(step.edge.id);currentNodeId=step.node.id;currentEdgeId=step.edge.id;bar.style.width=`${Math.round(((index+1)/Math.max(1,chain.length))*100)}%`;statusBox.textContent=`播放中 ${index+1}/${chain.length} · ${intentLabel(currentIntent)} · ${step.stage} · 当前节点：${step.node.label}`;renderSteps(index);drawFull(seed);const activeStep=stepsHost.querySelector(".step.active");if(activeStep)activeStep.scrollIntoView({block:"nearest",behavior:"smooth"});index++};tick();timer=setInterval(tick,Number(speed.value))}
function intentLabel(intent){return(questionPresets.find(p=>p.intent===intent)||questionPresets[0]).name}
function renderSteps(activeIndex=-1){stepsHost.innerHTML=chain.map((s,i)=>`<div class="step ${i===activeIndex?"active":""}" data-index="${i}"><div class="stepHead"><span class="stepTag">${esc(s.stage)}</span><b>${i+1}. ${esc(relationLabel[s.edge.type]||s.edge.type)}</b></div><span>${esc(s.from.label)} → ${esc(s.to.label)}</span></div>`).join("");for(const el of stepsHost.querySelectorAll(".step"))el.onclick=()=>{const s=chain[Number(el.dataset.index)];focusNode(s.node.id)}}
function focusNode(id){activeNodes.add(id);currentNodeId=id;drawFull(currentSeed||findSeed(question.value.trim()))}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
document.getElementById("run").onclick=run;question.addEventListener("keydown",e=>{if(e.key==="Enter")run()});window.addEventListener("resize",()=>{if(nodes)drawFull(findSeed(question.value.trim()))});
</script>
