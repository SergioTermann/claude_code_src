<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 风起时域</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4efe4;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #75684f;
      --line: #e2d3b0;
      --gold: #b88922;
      --gold-dark: #8f6717;
      --gold-soft: #f7edd7;
      --danger: #b42318;
      --focus: rgba(184, 137, 34, 0.2);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(115deg, rgba(184, 137, 34, 0.15), transparent 34%),
        linear-gradient(245deg, rgba(143, 103, 23, 0.11), transparent 36%),
        var(--bg);
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .shell {
      width: min(980px, 100%);
      min-height: 560px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      background: var(--panel);
      border: 1px solid rgba(215, 224, 234, 0.95);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(94, 69, 18, 0.18);
    }

    .brand {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 42px;
      background:
        linear-gradient(145deg, #9a711c 0%, #c99a33 54%, #f3d892 100%);
      color: #fff;
      overflow: hidden;
    }

    .brand::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(135deg, rgba(0, 0, 0, 0.7), transparent 70%);
    }

    .brand-top,
    .brand-bottom {
      position: relative;
      z-index: 1;
    }

    .brand h1 {
      margin: 0;
      max-width: 390px;
      font-size: 32px;
      line-height: 1.22;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand-kicker {
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 0 12px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.46);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.92);
      background: rgba(255, 255, 255, 0.13);
      font-size: 13px;
      font-weight: 700;
    }

    .brand-subtitle {
      margin: 16px 0 0;
      max-width: 420px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 15px;
      line-height: 1.8;
    }

    .brand-bottom {
      display: grid;
      gap: 12px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 13px;
    }

    .brand-stat {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .brand-stat::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.18);
      flex: 0 0 auto;
    }

    .login {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px;
    }

    .login h2 {
      margin: 0;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .login-note {
      margin: 10px 0 30px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      font-size: 14px;
      font-weight: 700;
      color: #263244;
    }

    .field {
      position: relative;
    }

    .field input {
      width: 100%;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 13px;
      color: var(--ink);
      background: #fffdf9;
      font-size: 15px;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .field input:focus {
      border-color: var(--gold);
      background: #fff;
      box-shadow: 0 0 0 4px var(--focus);
    }

    .actions {
      margin-top: 24px;
    }

    button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 7px;
      background: var(--gold);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease;
      box-shadow: 0 12px 24px rgba(184, 137, 34, 0.22);
    }

    button:hover {
      background: var(--gold-dark);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.68;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status {
      min-height: 22px;
      margin-top: 14px;
      color: var(--danger);
      font-size: 14px;
      line-height: 1.6;
    }

    .helper {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #f0e4c9;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 820px) {
      .page {
        padding: 18px;
      }

      .shell {
        min-height: 0;
        grid-template-columns: 1fr;
      }

      .brand {
        min-height: 230px;
        padding: 28px;
      }

      .brand h1 {
        font-size: 26px;
      }

      .brand-bottom {
        display: none;
      }

      .login {
        padding: 30px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="shell" aria-label="登录">
      <aside class="brand">
        <div class="brand-top">
          <div class="brand-kicker">内网智能运维平台</div>
          <h1>风起时域</h1>
          <p class="brand-subtitle">面向新能源运维场景的内网智能问答、故障诊断和知识库检索平台。</p>
        </div>
        <div class="brand-bottom">
          <div class="brand-stat">账号登录后自动加载个人历史会话</div>
          <div class="brand-stat">对话记录支持下载到本地浏览器</div>
          <div class="brand-stat">局域网环境部署，数据保存在内网服务器</div>
        </div>
      </aside>

      <section class="login">
        <h2>账号登录</h2>
        <p class="login-note">请输入管理员分配的账号和密码。</p>
        <form id="loginForm">
          <label for="username">账号</label>
          <div class="field">
            <input id="username" name="username" autocomplete="username" required autofocus>
          </div>

          <label for="password">密码</label>
          <div class="field">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>

          <div class="actions">
            <button id="loginBtn" type="submit">登录系统</button>
          </div>
          <div id="status" class="status" role="alert"></div>
        </form>
        <div class="helper">忘记密码或账号无法登录时，请联系系统管理员重置。</div>
      </section>
    </section>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const statusEl = document.getElementById('status');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      statusEl.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.error || '登录失败');
        }
        window.location.href = '/';
      } catch (error) {
        statusEl.textContent = error.message || '登录失败';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '登录系统';
      }
    });
  </script>
</body>
</html>
