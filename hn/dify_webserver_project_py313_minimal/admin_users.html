<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户管理 - 华能吉林公司智能助手</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #f4f6f8;
      color: #172033;
    }
    header {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: #fff;
      border-bottom: 1px solid #dbe3ec;
    }
    h1 { margin: 0; font-size: 18px; }
    main { max-width: 1120px; margin: 24px auto; padding: 0 18px; }
    .panel {
      background: #fff;
      border: 1px solid #dbe3ec;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(120px, 1fr));
      gap: 12px;
      align-items: end;
    }
    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
    input {
      width: 100%;
      height: 38px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 0 10px;
    }
    .check-row {
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .check-row input { width: auto; height: auto; }
    button, a.button-link {
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 6px;
      background: #1d4ed8;
      color: #fff;
      padding: 0 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    td.actions-cell {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    button.danger { background: #b42318; }
    button.secondary, a.button-link { background: #475467; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #e4e7ec;
      text-align: left;
    }
    th { background: #f8fafc; font-size: 13px; }
    .status { min-height: 22px; margin-top: 12px; color: #166534; }
    .error { color: #b42318; }
    @media (max-width: 820px) {
      .form-grid { grid-template-columns: 1fr; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <header>
    <h1>用户管理</h1>
    <a class="button-link" href="/">返回智能助手</a>
  </header>
  <main>
    <section class="panel">
      <h2>创建用户</h2>
      <form id="createUserForm" class="form-grid">
        <div>
          <label for="username">账号</label>
          <input id="username" required>
        </div>
        <div>
          <label for="name">姓名</label>
          <input id="name">
        </div>
        <div>
          <label for="password">初始密码</label>
          <input id="password" type="text" placeholder="留空自动生成">
        </div>
        <label class="check-row">
          <input id="isAdmin" type="checkbox"> 管理员
        </label>
        <button type="submit">创建</button>
      </form>
      <div id="createStatus" class="status"></div>
    </section>

    <section class="panel">
      <h2>用户列表</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>账号</th>
            <th>姓名</th>
            <th>管理员</th>
            <th>创建时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
      <div id="listStatus" class="status"></div>
    </section>
  </main>

  <script>
    const usersBody = document.getElementById('usersBody');
    const listStatus = document.getElementById('listStatus');
    const createStatus = document.getElementById('createStatus');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    async function loadUsers() {
      listStatus.textContent = '加载中...';
      listStatus.className = 'status';
      try {
        const response = await fetch('/api/admin/users');
        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.error || '加载用户失败');
        }
        usersBody.innerHTML = (data.users || []).map(user => `
          <tr>
            <td>${escapeHtml(user.id)}</td>
            <td>${escapeHtml(user.username)}</td>
            <td>${escapeHtml(user.name)}</td>
            <td>${user.is_admin ? '是' : '否'}</td>
            <td>${escapeHtml(user.created_at || '')}</td>
            <td class="actions-cell">
              <button class="secondary" onclick="resetPassword(${Number(user.id)})">重置密码</button>
              <button class="danger" onclick="deleteUser(${Number(user.id)})">删除</button>
            </td>
          </tr>
        `).join('');
        listStatus.textContent = `共 ${(data.users || []).length} 个用户`;
      } catch (error) {
        listStatus.textContent = error.message;
        listStatus.className = 'status error';
      }
    }

    async function deleteUser(userId) {
      if (!confirm('确定删除这个用户及其所有历史记录吗？')) {
        return;
      }
      const response = await fetch(`/api/admin/users/${userId}`, { method: 'DELETE' });
      const data = await response.json();
      if (!response.ok || !data.success) {
        alert(data.error || '删除失败');
        return;
      }
      await loadUsers();
    }

    async function resetPassword(userId) {
      const customPassword = prompt('输入新密码；留空则自动生成临时密码。');
      if (customPassword === null) {
        return;
      }
      const response = await fetch(`/api/admin/users/${userId}/password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: customPassword })
      });
      const data = await response.json();
      if (!response.ok || !data.success) {
        alert(data.error || '重置密码失败');
        return;
      }
      alert(`密码已重置：${data.new_password}`);
    }

    document.getElementById('createUserForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      createStatus.textContent = '';
      createStatus.className = 'status';
      try {
        const response = await fetch('/api/admin/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            name: document.getElementById('name').value.trim(),
            password: document.getElementById('password').value,
            is_admin: document.getElementById('isAdmin').checked
          })
        });
        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data.error || '创建失败');
        }
        const passwordText = data.initial_password ? ` 初始密码：${data.initial_password}` : '';
        createStatus.textContent = `创建成功。${passwordText}`;
        event.target.reset();
        await loadUsers();
      } catch (error) {
        createStatus.textContent = error.message;
        createStatus.className = 'status error';
      }
    });

    loadUsers();
  </script>
</body>
</html>
