<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Windrise 专利交底书附图</title>
  <style>
    body {
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
      font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 34px 28px 60px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }
    p {
      margin: 0 0 28px;
      color: #475569;
      font-size: 16px;
    }
    section {
      margin: 0 0 34px;
      padding: 18px;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Windrise 专利交底书附图</h1>
    <p>以下附图根据技术交底书上下文绘制，SVG 可编辑，PNG 可直接插入 Word 或 PPT。</p>

    <section>
      <h2>图1 系统总体结构图</h2>
      <img src="fig1-system-architecture.svg" alt="图1 系统总体结构图">
    </section>
    <section>
      <h2>图2 资料接入至知识构建的方法流程图</h2>
      <img src="fig2-knowledge-build-flow.svg" alt="图2 资料接入至知识构建的方法流程图">
    </section>
    <section>
      <h2>图3 领域知识关系示意图</h2>
      <img src="fig3-domain-relationship.svg" alt="图3 领域知识关系示意图">
    </section>
    <section>
      <h2>图4 故障机理归纳和故障条目挂接示意图</h2>
      <img src="fig4-mechanism-mapping.svg" alt="图4 故障机理归纳和故障条目挂接示意图">
    </section>
    <section>
      <h2>图5 多轮现场排查交互流程图</h2>
      <img src="fig5-multiturn-troubleshooting.svg" alt="图5 多轮现场排查交互流程图">
    </section>
    <section>
      <h2>图6 本地化和企业内网部署结构图</h2>
      <img src="fig6-local-deployment.svg" alt="图6 本地化和企业内网部署结构图">
    </section>
  </main>
</body>
</html>
