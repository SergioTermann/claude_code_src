<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 34px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .sub{font:400 18px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#475569}
      .head{font:700 22px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .txt{font:400 16px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#334155}
      .white{font:700 18px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#fff;text-anchor:middle}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14}
      .line{stroke:#334155;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#f8fafc"/>
  <text x="70" y="70" class="title">图4 故障机理归纳和故障条目挂接示意图</text>
  <text x="72" y="104" class="sub">多个分散故障条目被归纳到现场可理解的机理模板，支撑原因解释和优先排查。</text>

  <rect x="80" y="170" width="300" height="500" class="card"/>
  <text x="120" y="215" class="head">本地故障条目</text>
  <rect x="120" y="255" width="220" height="55" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="230" y="289" class="txt" text-anchor="middle">故障码 A</text>
  <rect x="120" y="335" width="220" height="55" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="230" y="369" class="txt" text-anchor="middle">故障码 B</text>
  <rect x="120" y="415" width="220" height="55" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="230" y="449" class="txt" text-anchor="middle">故障码 C</text>
  <rect x="120" y="495" width="220" height="55" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="230" y="529" class="txt" text-anchor="middle">故障码 D</text>
  <rect x="120" y="575" width="220" height="55" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="230" y="609" class="txt" text-anchor="middle">故障码 E</text>

  <rect x="545" y="150" width="310" height="555" class="card"/>
  <text x="600" y="195" class="head">故障机理模板</text>
  <rect x="585" y="240" width="230" height="70" rx="12" fill="#0f766e"/>
  <text x="700" y="269" class="white">反馈链路异常</text>
  <text x="700" y="294" class="white">PLC / 开关 / 信号</text>
  <rect x="585" y="355" width="230" height="70" rx="12" fill="#d97706"/>
  <text x="700" y="384" class="white">执行机构异常</text>
  <text x="700" y="409" class="white">变桨 / 偏航 / 制动</text>
  <rect x="585" y="470" width="230" height="70" rx="12" fill="#7c3aed"/>
  <text x="700" y="499" class="white">电气电源异常</text>
  <text x="700" y="524" class="white">24V / 母线 / 电网</text>
  <rect x="585" y="585" width="230" height="70" rx="12" fill="#dc2626"/>
  <text x="700" y="614" class="white">保护链断开</text>
  <text x="700" y="639" class="white">安全链 / 急停</text>

  <rect x="1020" y="170" width="300" height="500" class="card"/>
  <text x="1060" y="215" class="head">问答使用方式</text>
  <text x="1060" y="275" class="txt">1. 识别故障码和机型</text>
  <text x="1060" y="320" class="txt">2. 找到对应机理模板</text>
  <text x="1060" y="365" class="txt">3. 输出优先验证动作</text>
  <text x="1060" y="410" class="txt">4. 给出合格标准</text>
  <text x="1060" y="455" class="txt">5. 根据反馈继续排查</text>
  <rect x="1060" y="535" width="220" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1170" y="568" class="txt" text-anchor="middle">从“查条目”</text>
  <text x="1170" y="595" class="txt" text-anchor="middle">提升为“解释机理”</text>

  <path d="M340 282 C425 275 500 270 585 275" class="line"/>
  <path d="M340 362 C425 365 500 380 585 390" class="line"/>
  <path d="M340 442 C425 430 500 390 585 390" class="line"/>
  <path d="M340 522 C425 515 500 505 585 505" class="line"/>
  <path d="M340 602 C425 610 500 620 585 620" class="line"/>
  <path d="M815 390 C900 395 955 405 1020 420" class="line"/>

  <rect x="130" y="760" width="1140" height="58" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="160" y="795" class="sub">机理模板可以专家预置，也可以根据历史故障数据聚类后经专家审核形成。</text>
</svg>
