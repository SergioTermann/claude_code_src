<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 34px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#0f172a}
      .sub{font:400 18px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#475569}
      .nodeText{font:700 20px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#fff;text-anchor:middle}
      .small{font:400 15px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#334155;text-anchor:middle}
      .edge{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .note{font:400 17px "Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#f8fafc"/>
  <text x="70" y="70" class="title">图3 领域知识关系示意图</text>
  <text x="72" y="104" class="sub">用领域关系约束故障码检索范围，避免只按数字命中错误机型或错误资料。</text>

  <circle cx="700" cy="415" r="82" fill="#dc2626"/>
  <text x="700" y="405" class="nodeText">故障码</text>
  <text x="700" y="434" class="nodeText">报警信息</text>

  <circle cx="240" cy="210" r="70" fill="#2563eb"/><text x="240" y="218" class="nodeText">风场</text>
  <circle cx="465" cy="210" r="70" fill="#0f766e"/><text x="465" y="218" class="nodeText">机型</text>
  <circle cx="700" cy="170" r="70" fill="#16a34a"/><text x="700" y="178" class="nodeText">品牌</text>
  <circle cx="955" cy="210" r="70" fill="#d97706"/><text x="955" y="218" class="nodeText">系统</text>
  <circle cx="1175" cy="330" r="70" fill="#7c3aed"/><text x="1175" y="338" class="nodeText">部件</text>

  <circle cx="240" cy="610" r="70" fill="#0891b2"/><text x="240" y="618" class="nodeText">来源资料</text>
  <circle cx="465" cy="665" r="70" fill="#4f46e5"/><text x="465" y="673" class="nodeText">复位方式</text>
  <circle cx="955" cy="665" r="70" fill="#db2777"/><text x="955" y="673" class="nodeText">可能原因</text>
  <circle cx="1175" cy="540" r="70" fill="#65a30d"/><text x="1175" y="548" class="nodeText">处理建议</text>

  <path d="M300 220 C350 220 385 215 405 212" class="edge"/>
  <text x="352" y="195" class="small">对应</text>
  <path d="M526 202 C580 192 620 182 635 178" class="edge"/>
  <text x="580" y="165" class="small">归属</text>
  <path d="M648 360 C600 310 545 255 515 230" class="edge"/>
  <text x="582" y="305" class="small">适用机型</text>
  <path d="M760 360 C820 300 880 245 900 230" class="edge"/>
  <text x="845" y="308" class="small">所属系统</text>
  <path d="M782 406 C925 388 1035 350 1110 335" class="edge"/>
  <text x="970" y="365" class="small">涉及部件</text>
  <path d="M758 475 C825 550 890 615 920 638" class="edge"/>
  <text x="850" y="585" class="small">可能原因</text>
  <path d="M778 445 C910 485 1045 520 1110 535" class="edge"/>
  <text x="965" y="505" class="small">处理建议</text>
  <path d="M646 477 C590 545 525 615 500 642" class="edge"/>
  <text x="565" y="585" class="small">复位方式</text>
  <path d="M622 448 C500 505 365 575 305 604" class="edge"/>
  <text x="455" y="550" class="small">来源证据</text>

  <rect x="130" y="760" width="1140" height="58" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="160" y="795" class="note">检索时先确定风场和机型，再解释故障码，最后回溯到来源资料和处理依据。</text>
</svg>
